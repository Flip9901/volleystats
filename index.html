<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>VolleyStats</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f3f5f7;
    color: #18202a;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

header {
    background: #111827;
    color: white;
    padding: 16px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.header-title {
    font-size: 22px;
    font-weight: 800;
}

.header-subtitle {
    opacity: .7;
    font-size: 13px;
    margin-top: 2px;
}

.page {
    display: none;
    padding: 14px;
    padding-bottom: 90px;
}

.page.active {
    display: block;
}

.nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: white;
    border-top: 1px solid #ddd;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    z-index: 50;
}

.nav button {
    border: none;
    background: white;
    color: #6b7280;
    font-size: 12px;
    font-weight: 700;
}

.nav button.active {
    color: #111827;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

h2 {
    margin: 0 0 12px;
    font-size: 19px;
}

h3 {
    margin: 0 0 10px;
    font-size: 16px;
}

.small {
    color: #6b7280;
    font-size: 13px;
}

.primary {
    background: #111827;
    color: white;
    border: none;
    border-radius: 11px;
    padding: 12px 16px;
    font-weight: 700;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
    border: none;
    border-radius: 11px;
    padding: 11px 15px;
    font-weight: 700;
}

.danger {
    background: #fee2e2;
    color: #991b1b;
    border: none;
    border-radius: 11px;
    padding: 11px 15px;
    font-weight: 700;
}

.full {
    width: 100%;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    margin-top: 6px;
    margin-bottom: 12px;
    background: white;
}

label {
    font-size: 13px;
    font-weight: 700;
}

/* SPIELE */

.game-item {
    padding: 14px 0;
    border-bottom: 1px solid #eee;
}

.game-item:last-child {
    border-bottom: none;
}

.game-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.game-opponent {
    font-size: 17px;
    font-weight: 800;
}

.match-score {
    font-size: 22px;
    font-weight: 900;
}

.set-results {
    margin-top: 5px;
    color: #6b7280;
    font-size: 13px;
}

.game-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.game-buttons button {
    flex: 1;
}

/* SCORE */

.score-card {
    text-align: center;
}

.set-label {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 3px;
}

.set-score-live {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 8px;
}

.score {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
}

.score-team {
    text-align: center;
    min-width: 100px;
}

.score-name {
    font-weight: 800;
    font-size: 14px;
}

.score-number {
    font-size: 54px;
    font-weight: 900;
    line-height: 1.05;
}

.score-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
}

.score-buttons button {
    width: 48px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background: #e5e7eb;
    font-size: 22px;
    font-weight: 800;
}

/* COURT */

.court {
    max-width: 500px;
    margin: auto;
    background: #d8b27c;
    border: 4px solid #fff;
    border-radius: 14px;
    padding: 10px;
}

.court-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 90px);
    gap: 7px;
}

.position {
    background: rgba(255,255,255,.85);
    border: 2px solid transparent;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 4px;
}

.position.selected {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.2);
}

.position-number {
    font-size: 11px;
    color: #6b7280;
}

.position-name {
    font-weight: 800;
    font-size: 13px;
}

.bench {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}

.bench-player {
    border: none;
    border-radius: 10px;
    padding: 9px 11px;
    background: #e5e7eb;
    font-weight: 700;
}

.bench-player.selected {
    background: #2563eb;
    color: white;
}

.substitution-hint {
    background: #dbeafe;
    color: #1e40af;
    border-radius: 10px;
    padding: 11px;
    margin-top: 10px;
    font-size: 13px;
    font-weight: 700;
}

/* AKTIONEN */

.category-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.category-buttons button {
    border: none;
    border-radius: 11px;
    padding: 12px;
    background: #e5e7eb;
    font-weight: 800;
}

.category-buttons button.active {
    background: #111827;
    color: white;
}

.action-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
}

.action-btn {
    border: none;
    border-radius: 12px;
    padding: 15px 8px;
    font-weight: 800;
    background: #f1f5f9;
}

.action-btn.point {
    background: #dcfce7;
    color: #166534;
}

.action-btn.error {
    background: #fee2e2;
    color: #991b1b;
}

/* ANALYSE */

.analysis-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.stat-box {
    background: #f8fafc;
    border-radius: 11px;
    padding: 10px;
}

.stat-title {
    font-size: 12px;
    color: #64748b;
}

.stat-value {
    font-size: 19px;
    font-weight: 900;
    margin-top: 2px;
}

.stat-sub {
    font-size: 11px;
    color: #64748b;
    margin-top: 2px;
}

.table-wrap {
    overflow-x: auto;
}

.stats-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    min-width: 700px;
}

.stats-table th,
.stats-table td {
    padding: 8px 6px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

.stats-table th:first-child,
.stats-table td:first-child {
    text-align: left;
}

.stats-table th {
    color: #64748b;
    font-size: 11px;
}

details {
    margin-top: 10px;
}

summary {
    cursor: pointer;
    font-weight: 800;
    padding: 10px 0;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 25px 10px;
}

/* KADER */

.roster-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.roster-info {
    flex: 1;
}

.roster-name {
    font-weight: 800;
}

.roster-meta {
    color: #6b7280;
    font-size: 12px;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 450px;
    border-radius: 18px;
    padding: 18px;
}

.modal-buttons {
    display: flex;
    gap: 8px;
}

.modal-buttons button {
    flex: 1;
}

@media (min-width: 700px) {

    .page {
        max-width: 900px;
        margin: auto;
    }

    .stat-grid {
        grid-template-columns: repeat(4, 1fr);
    }

}

</style>
</head>

<body>

<header>

    <div class="header-title">
        🏐 VolleyStats
    </div>

    <div class="header-subtitle" id="headerSubtitle">
        Spielstatistik
    </div>

</header>


<!-- =========================
     SPIELE
========================= -->

<section id="pageGames" class="page active">

    <div class="card">

        <button class="primary full"
                onclick="openNewGameModal()">

            + Neues Spiel

        </button>

    </div>


    <div class="card">

        <h2>Spiele</h2>

        <div id="gamesList"></div>

    </div>


    <div class="card">

        <h3>Daten sichern</h3>

        <div style="display:flex;gap:8px;">

            <button class="secondary"
                    style="flex:1"
                    onclick="exportData()">

                Export

            </button>

            <button class="secondary"
                    style="flex:1"
                    onclick="document.getElementById('importFile').click()">

                Import

            </button>

        </div>

        <input
            id="importFile"
            type="file"
            accept=".json"
            style="display:none"
            onchange="importData(event)"
        >

    </div>

</section>


<!-- =========================
     LIVE
========================= -->

<section id="pageLive" class="page">

    <div id="liveContent"></div>

</section>


<!-- =========================
     KADER
========================= -->

<section id="pageRoster" class="page">

    <div class="card">

        <h2>Kader</h2>

        <label>Name</label>

        <input
            id="rosterName"
            placeholder="Spielerin"
        >

        <label>Nummer</label>

        <input
            id="rosterNumber"
            type="number"
            placeholder="z. B. 7"
        >

        <label>Position</label>

        <select id="rosterPosition">

            <option>Außen</option>
            <option>Diagonal</option>
            <option>Zuspiel</option>
            <option>Mitte</option>
            <option>Libera</option>
            <option>Universal</option>

        </select>

        <button
            class="primary full"
            onclick="addPlayer()">

            Spielerin hinzufügen

        </button>

    </div>


    <div class="card">

        <div id="rosterList"></div>

    </div>

</section>


<!-- =========================
     ANALYSE
========================= -->

<section id="pageAnalysis" class="page">

    <div id="analysisContent"></div>

</section>


<!-- =========================
     NAVIGATION
========================= -->

<nav class="nav">

    <button
        id="navGames"
        class="active"
        onclick="showPage('games')">

        🏐<br>
        Spiele

    </button>

    <button
        id="navLive"
        onclick="showPage('live')">

        ▶️<br>
        Live

    </button>

    <button
        id="navRoster"
        onclick="showPage('roster')">

        👥<br>
        Kader

    </button>

    <button
        id="navAnalysis"
        onclick="showPage('analysis')">

        📊<br>
        Analyse

    </button>

</nav>


<!-- =========================
     NEUES SPIEL
========================= -->

<div id="newGameModal" class="modal">

    <div class="modal-content">

        <h2>Neues Spiel</h2>

        <label>Gegner</label>

        <input
            id="newOpponent"
            placeholder="z. B. SV Musterstadt"
        >

        <label>Datum</label>

        <input
            id="newDate"
            type="date"
        >

        <div class="modal-buttons">

            <button
                class="secondary"
                onclick="closeNewGameModal()">

                Abbrechen

            </button>

            <button
                class="primary"
                onclick="createGame()">

                Spiel erstellen

            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   DATEN
========================================================= */

const STORAGE_KEY = "volleystats_v2";

let data = {
    roster: [],
    games: []
};

let currentGameId = null;

let selectedPlayerId = null;

let selectedCategory = null;

let substitutionPosition = null;

let analysisGameId = null;


/* =========================================================
   DATEN LADEN
========================================================= */

loadData();


function loadData() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (saved) {

        try {

            data = JSON.parse(saved);

        } catch(e) {

            data = {
                roster: [],
                games: []
            };

        }

    }

    if (!data.roster)
        data.roster = [];

    if (!data.games)
        data.games = [];


    data.games.forEach(game => {

        if (!game.actions)
            game.actions = [];

        if (!game.sets)
            game.sets = [];

        if (!game.substitutions)
            game.substitutions = [];

        if (!game.lineup)
            game.lineup = {};

    });


    renderGames();

    renderRoster();

}


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


function getCurrentGame() {

    return data.games.find(
        g => g.id === currentGameId
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page) {

    document
        .querySelectorAll(".page")
        .forEach(el => {
            el.classList.remove("active");
        });


    document
        .querySelectorAll(".nav button")
        .forEach(el => {
            el.classList.remove("active");
        });


    if (page === "games") {

        document
            .getElementById("pageGames")
            .classList.add("active");

        document
            .getElementById("navGames")
            .classList.add("active");

        document
            .getElementById("headerSubtitle")
            .textContent = "Spielstatistik";

        renderGames();

    }


    if (page === "live") {

        document
            .getElementById("pageLive")
            .classList.add("active");

        document
            .getElementById("navLive")
            .classList.add("active");

        document
            .getElementById("headerSubtitle")
            .textContent = "Live-Spiel";

        renderLive();

    }


    if (page === "roster") {

        document
            .getElementById("pageRoster")
            .classList.add("active");

        document
            .getElementById("navRoster")
            .classList.add("active");

        document
            .getElementById("headerSubtitle")
            .textContent = "Kader";

        renderRoster();

    }


    if (page === "analysis") {

        document
            .getElementById("pageAnalysis")
            .classList.add("active");

        document
            .getElementById("navAnalysis")
            .classList.add("active");

        document
            .getElementById("headerSubtitle")
            .textContent = "Spielanalyse";

        renderAnalysis();

    }

}


/* =========================================================
   NEUES SPIEL
========================================================= */

function openNewGameModal() {

    document
        .getElementById("newOpponent")
        .value = "";


    const today =
        new Date()
        .toISOString()
        .split("T")[0];


    document
        .getElementById("newDate")
        .value = today;


    document
        .getElementById("newGameModal")
        .classList.add("show");

}


function closeNewGameModal() {

    document
        .getElementById("newGameModal")
        .classList.remove("show");

}


function createGame() {

    const opponent =
        document
            .getElementById("newOpponent")
            .value
            .trim();


    const date =
        document
            .getElementById("newDate")
            .value;


    if (!opponent) {

        alert("Bitte Gegner eingeben.");

        return;

    }


    const game = {

        id: Date.now(),

        opponent,

        date,

        currentSet: 1,

        scoreUs: 0,

        scoreOpponent: 0,

        sets: [],

        actions: [],

        substitutions: [],

        lineup: {
            1: null,
            2: null,
            3: null,
            4: null,
            5: null,
            6: null
        },

        finished: false

    };


    setupLineup(game);


    data.games.unshift(game);


    saveData();


    currentGameId = game.id;


    closeNewGameModal();


    showPage("live");

}


/* =========================================================
   AUFSTELLUNG
========================================================= */

function setupLineup(game) {

    const used =
        new Set();


    const positions =
        [1,2,3,4,5,6];


    positions.forEach(position => {

        if (game.lineup[position]) {

            used.add(
                game.lineup[position]
            );

            return;

        }


        const player =
            data.roster.find(
                p => !used.has(p.id)
            );


        if (player) {

            game.lineup[position] =
                player.id;

            used.add(player.id);

        }

    });

}


/* =========================================================
   SATZSTAND
========================================================= */

function getSetScore(game) {

    let us = 0;

    let opponent = 0;


    (game.sets || [])
        .forEach(set => {

            if (set.us > set.opponent) {

                us++;

            }

            else if (
                set.opponent > set.us
            ) {

                opponent++;

            }

        });


    return {
        us,
        opponent
    };

}


/* =========================================================
   SPIELE ANZEIGEN
========================================================= */

function renderGames() {

    const container =
        document.getElementById("gamesList");


    if (!data.games.length) {

        container.innerHTML = `
            <div class="empty">
                Noch keine Spiele vorhanden.
            </div>
        `;

        return;

    }


    container.innerHTML =
        data.games
        .map(game => {

            const setScore =
                getSetScore(game);


            const setResults =
                (game.sets || [])
                .map(
                    s => `${s.us}:${s.opponent}`
                )
                .join(" · ");


            let statusText = "";


            if (!game.finished) {

                statusText = `
                    <div class="small">
                        Aktueller Satz ${game.currentSet}:
                        ${game.scoreUs}:${game.scoreOpponent}
                    </div>
                `;

            }


            return `

                <div class="game-item">

                    <div class="game-top">

                        <div>

                            <div class="game-opponent">
                                vs. ${escapeHtml(game.opponent)}
                            </div>

                            <div class="small">
                                ${formatDate(game.date)}
                            </div>

                        </div>


                        <div class="match-score">

                            ${setScore.us}
                            :
                            ${setScore.opponent}

                        </div>

                    </div>


                    ${
                        setResults
                        ? `
                            <div class="set-results">
                                Sätze: ${setResults}
                            </div>
                        `
                        : ""
                    }


                    ${statusText}


                    <div class="game-buttons">

                        <button
                            class="secondary"
                            onclick="openGame(${game.id})">

                            ${
                                game.finished
                                ? "🏐 Öffnen"
                                : "▶️ Fortsetzen"
                            }

                        </button>


                        <button
                            class="secondary"
                            onclick="openAnalysis(${game.id})">

                            📊 Analyse

                        </button>

                    </div>

                </div>

            `;

        })
        .join("");

}


/* =========================================================
   SPIEL ÖFFNEN
========================================================= */

function openGame(id) {

    currentGameId = id;


    const game =
        data.games.find(
            g => g.id === id
        );


    if (!game) return;


    if (game.finished) {

        openAnalysis(id);

    }

    else {

        showPage("live");

    }

}


/* =========================================================
   KADER
========================================================= */

function addPlayer() {

    const name =
        document
            .getElementById("rosterName")
            .value
            .trim();


    const number =
        document
            .getElementById("rosterNumber")
            .value;


    const position =
        document
            .getElementById("rosterPosition")
            .value;


    if (!name) {

        alert("Bitte Name eingeben.");

        return;

    }


    data.roster.push({

        id: Date.now(),

        name,

        number,

        position

    });


    saveData();


    document
        .getElementById("rosterName")
        .value = "";


    document
        .getElementById("rosterNumber")
        .value = "";


    renderRoster();

}


function deletePlayer(id) {

    if (
        !confirm(
            "Spielerin wirklich löschen?"
        )
    ) return;


    data.roster =
        data.roster.filter(
            p => p.id !== id
        );


    saveData();


    renderRoster();

}


function renderRoster() {

    const container =
        document.getElementById("rosterList");


    if (!data.roster.length) {

        container.innerHTML = `
            <div class="empty">
                Noch keine Spielerinnen im Kader.
            </div>
        `;

        return;

    }


    container.innerHTML =
        data.roster
        .map(player => {

            return `

                <div class="roster-row">

                    <div class="roster-info">

                        <div class="roster-name">

                            ${
                                player.number
                                ? "#" +
                                  escapeHtml(player.number) +
                                  " "
                                : ""
                            }

                            ${escapeHtml(player.name)}

                        </div>


                        <div class="roster-meta">

                            ${escapeHtml(
                                player.position
                            )}

                        </div>

                    </div>


                    <button
                        class="danger"
                        onclick="deletePlayer(${player.id})">

                        Löschen

                    </button>

                </div>

            `;

        })
        .join("");

}


/* =========================================================
   LIVE
========================================================= */

function renderLive() {

    const game =
        getCurrentGame();


    if (!game) {

        document
            .getElementById("liveContent")
            .innerHTML = `

                <div class="card empty">

                    Kein Spiel ausgewählt.

                </div>

            `;

        return;

    }


    setupLineup(game);


    const setScore =
        getSetScore(game);


    const lineup =
        game.lineup || {};


    const positions =
        [4,3,2,5,6,1];


    let courtHtml = "";


    positions.forEach(position => {

        const playerId =
            lineup[position];


        const player =
            data.roster.find(
                p => p.id === playerId
            );


        const selected =
            substitutionPosition === position
            ? "selected"
            : "";


        courtHtml += `

            <div
                class="position ${selected}"
                onclick="selectPosition(${position})">

                <div class="position-number">

                    Pos. ${position}

                </div>


                <div class="position-name">

                    ${
                        player
                        ? escapeHtml(player.name)
                        : "frei"
                    }

                </div>

            </div>

        `;

    });

/* =========================================================
   SCORE
========================================================= */

function changeScore(team, amount) {

    const game =
        getCurrentGame();


    if (!game) return;


    if (team === "us") {

        game.scoreUs =
            Math.max(
                0,
                game.scoreUs + amount
            );

    }


    if (team === "opponent") {

        game.scoreOpponent =
            Math.max(
                0,
                game.scoreOpponent + amount
            );

    }


    saveData();


    renderLive();

}


/* =========================================================
   WECHSEL
========================================================= */

function selectPosition(position) {

    const game =
        getCurrentGame();


    if (!game) return;


    const playerId =
        game.lineup[position];


    if (!playerId) return;


    substitutionPosition =
        position;


    selectedPlayerId =
        playerId;


    selectedCategory = null;


    renderLive();

}


function choosePositionForPlayer(playerId) {

    const game =
        getCurrentGame();


    if (!game) return;


    if (substitutionPosition === null) {

        selectedPlayerId =
            playerId;

        renderLive();

        return;

    }


    const position =
        substitutionPosition;


    const oldPlayerId =
        game.lineup[position];


    if (oldPlayerId === playerId) {

        substitutionPosition = null;

        selectedPlayerId =
            playerId;

        renderLive();

        return;

    }


    game.lineup[position] =
        playerId;


    game.substitutions.push({

        set: game.currentSet,

        position,

        oldPlayerId,

        newPlayerId: playerId,

        time: new Date().toISOString()

    });


    selectedPlayerId = null;

    selectedCategory = null;

    substitutionPosition = null;


    saveData();


    renderLive();

}

/* =========================================================
   AKTION AUFZEICHNEN
========================================================= */

function recordAction(
    category,
    type,
    point
) {

    const game =
        getCurrentGame();


    if (!game || !selectedPlayerId)
        return;


    const player =
        data.roster.find(
            p => p.id === selectedPlayerId
        );


    if (!player) return;


    const action = {

        id: Date.now(),

        playerId: player.id,

        playerName: player.name,

        category,

        type,

        usPoint:
            point === "us",

        opponentPoint:
            point === "opponent",

        set:
            game.currentSet,

        time:
            new Date().toISOString()

    };


    game.actions.push(action);


    if (point === "us") {

        game.scoreUs++;

    }


    if (point === "opponent") {

        game.scoreOpponent++;

    }


    selectedPlayerId = null;

    selectedCategory = null;

    substitutionPosition = null;


    saveData();


    renderLive();

}


/* =========================================================
   RÜCKGÄNGIG
========================================================= */

function undoLastAction() {

    const game =
        getCurrentGame();


    if (
        !game ||
        !game.actions.length
    ) {

        alert(
            "Keine Aktion zum Rückgängigmachen."
        );

        return;

    }


    const action =
        game.actions[
            game.actions.length - 1
        ];


    if (
        action.set !==
        game.currentSet
    ) {

        alert(
            "Die letzte Aktion gehört zu einem vorherigen Satz."
        );

        return;

    }


    game.actions.pop();


    if (action.usPoint) {

        game.scoreUs =
            Math.max(
                0,
                game.scoreUs - 1
            );

    }


    if (action.opponentPoint) {

        game.scoreOpponent =
            Math.max(
                0,
                game.scoreOpponent - 1
            );

    }


    saveData();


    renderLive();

}


/* =========================================================
   SATZ BEENDEN
========================================================= */

function finishSet() {

    const game =
        getCurrentGame();


    if (!game) return;


    if (
        game.scoreUs === 0 &&
        game.scoreOpponent === 0
    ) {

        alert(
            "Der Satz hat noch keinen Punktestand."
        );

        return;

    }


    if (
        !confirm(
            `Satz ${game.currentSet} mit ` +
            `${game.scoreUs}:${game.scoreOpponent} ` +
            `beenden?`
        )
    ) {

        return;

    }


    game.sets.push({

        set:
            game.currentSet,

        us:
            game.scoreUs,

        opponent:
            game.scoreOpponent

    });


    game.scoreUs = 0;

    game.scoreOpponent = 0;


    if (game.currentSet < 5) {

        game.currentSet++;

    }


    selectedPlayerId = null;

    selectedCategory = null;

    substitutionPosition = null;


    saveData();


    renderLive();

}


/* =========================================================
   SPIEL BEENDEN
========================================================= */

function finishGame() {

    const game =
        getCurrentGame();


    if (!game) return;


    if (!game.sets.length) {

        alert(
            "Bitte zuerst mindestens einen Satz beenden."
        );

        return;

    }


    if (
        game.scoreUs !== 0 ||
        game.scoreOpponent !== 0
    ) {

        const saveCurrent =
            confirm(
                `Der aktuelle Satz ${game.currentSet} ` +
                `ist noch nicht beendet.\n\n` +
                `Möchtest du ihn vor dem Beenden ` +
                `des Spiels speichern?`
            );


        if (saveCurrent) {

            game.sets.push({

                set:
                    game.currentSet,

                us:
                    game.scoreUs,

                opponent:
                    game.scoreOpponent

            });


            game.scoreUs = 0;

            game.scoreOpponent = 0;

        }

    }


    if (
        !confirm(
            "Spiel wirklich beenden?"
        )
    ) {

        return;

    }


    game.finished = true;


    saveData();


    selectedPlayerId = null;

    selectedCategory = null;

    substitutionPosition = null;


    openAnalysis(game.id);

}


/* =========================================================
   ANALYSE – AKTIONEN
========================================================= */

function getActions(
    game,
    setNumber = null
) {

    const actions =
        game.actions || [];


    if (setNumber === null) {

        return actions;

    }


    return actions.filter(
        a => a.set === setNumber
    );

}


function count(
    actions,
    category,
    type
) {

    return actions.filter(
        a =>
            a.category === category &&
            a.type === type
    ).length;

}


/* =========================================================
   STATISTIK BERECHNEN
========================================================= */

function getStats(actions) {

    /* =====================
       ANGRIFF
    ===================== */

    const attackKills =
        count(
            actions,
            "attack",
            "kill"
        );


    const attackPlayable =
        count(
            actions,
            "attack",
            "playable"
        );


    const attackErrors =
        count(
            actions,
            "attack",
            "error"
        );


    const attackBlocked =
        count(
            actions,
            "attack",
            "blocked"
        );


    const attackAttempts =
        attackKills +
        attackPlayable +
        attackErrors +
        attackBlocked;


    /*
       Punktquote:

       Wie oft wurde direkt
       ein Punkt erzielt?
    */

    const attackPointRate =
        attackAttempts
        ? (
            attackKills /
            attackAttempts
        ) * 100
        : 0;


    /*
       Angriffseffizienz:

       Punkt = positiv
       Weiter spielbar = neutral
       Fehler = negativ
       Block = negativ

       Niemals unter 0 %
    */

    const attackEfficiency =
        attackAttempts
        ? Math.max(
            0,
            (
                (
                    attackKills -
                    attackErrors -
                    attackBlocked
                )
                /
                attackAttempts
            ) * 100
        )
        : 0;


    /* =====================
       ANNAHME
    ===================== */

    const receptionPositive =
        count(
            actions,
            "reception",
            "positive"
        );


    const receptionNeutral =
        count(
            actions,
            "reception",
            "neutral"
        );


    const receptionNegative =
        count(
            actions,
            "reception",
            "negative"
        );


    const receptionErrors =
        count(
            actions,
            "reception",
            "error"
        );


    const receptionAttempts =
        receptionPositive +
        receptionNeutral +
        receptionNegative +
        receptionErrors;


    const receptionPositiveRate =
        receptionAttempts
        ? (
            receptionPositive /
            receptionAttempts
        ) * 100
        : 0;


    /* =====================
       AUFSCHLAG
    ===================== */

    const serveAces =
        count(
            actions,
            "serve",
            "ace"
        );


    const servePressure =
        count(
            actions,
            "serve",
            "pressure"
        );


    const serveNormal =
        count(
            actions,
            "serve",
            "normal"
        );


    const serveErrors =
        count(
            actions,
            "serve",
            "error"
        );


    const serveAttempts =
        serveAces +
        servePressure +
        serveNormal +
        serveErrors;


    /* =====================
       BLOCK
    ===================== */

    const blockPoints =
        count(
            actions,
            "block",
            "point"
        );


    const blockTouches =
        count(
            actions,
            "block",
            "touch"
        );


    const blockErrors =
        count(
            actions,
            "block",
            "error"
        );


    /* =====================
       ABWEHR
    ===================== */

    const defenseSuccessful =
        count(
            actions,
            "defense",
            "successful"
        );


    const defenseErrors =
        count(
            actions,
            "defense",
            "error"
        );


    return {

        attackKills,

        attackPlayable,

        attackErrors,

        attackBlocked,

        attackAttempts,

        attackPointRate,

        attackEfficiency,


        receptionPositive,

        receptionNeutral,

        receptionNegative,

        receptionErrors,

        receptionAttempts,

        receptionPositiveRate,


        serveAces,

        servePressure,

        serveNormal,

        serveErrors,

        serveAttempts,


        blockPoints,

        blockTouches,

        blockErrors,


        defenseSuccessful,

        defenseErrors

    };

}

                                        ${formatPercent(
                                            s.attackEfficiency
                                        )}

                                    </td>


                                    <td>

                                        ${formatPercent(
                                            s.attackPointRate
                                        )}

                                    </td>


                                    <td>

                                        ${s.receptionPositive}
                                        /
                                        ${s.receptionAttempts}

                                    </td>


                                    <td>

                                        ${s.serveAces}

                                    </td>


                                    <td>

                                        ${s.serveErrors}

                                    </td>


                                    <td>

                                        ${s.blockPoints}

                                    </td>


                                    <td>

                                        ${s.defenseSuccessful}

                                    </td>

                                </tr>

                            `;

                        })
                        .join("")
                    }

                </tbody>

            </table>

        </div>

    `;

}


/* =========================================================
   AKTUELLER SATZ
========================================================= */

function renderCurrentSetAnalysis() {

    const container =
        document.getElementById(
            "currentSetAnalysis"
        );


    if (!container) return;


    const game =
        getCurrentGame();


    if (!game) return;


    container.innerHTML = `

        ${renderTeamStats(
            game,
            game.currentSet
        )}


        <div style="margin-top:15px;">

            <h3>Spielerinnen</h3>

            ${renderPlayerTable(
                game,
                game.currentSet
            )}

        </div>

    `;

}


/* =========================================================
   SPIELANALYSE ÖFFNEN
========================================================= */

function openAnalysis(id) {

    analysisGameId =
        id;


    currentGameId =
        id;


    showPage("analysis");

}


/* =========================================================
   SPIELANALYSE
========================================================= */

function renderAnalysis() {

    const container =
        document.getElementById(
            "analysisContent"
        );


    const game =
        data.games.find(
            g => g.id === analysisGameId
        );


    if (!game) {

        container.innerHTML = `

            <div class="card empty">

                Kein Spiel ausgewählt.

            </div>

        `;

        return;

    }


    const setScore =
        getSetScore(game);


    const setResults =
        (game.sets || [])
        .map(
            s => `${s.us}:${s.opponent}`
        )
        .join(" · ");


    container.innerHTML = `

        <div class="card">

            <div class="analysis-header">

                <div>

                    <h2>

                        vs.
                        ${escapeHtml(
                            game.opponent
                        )}

                    </h2>


                    <div class="small">

                        ${formatDate(
                            game.date
                        )}

                    </div>

                </div>


                <div style="text-align:right">

                    <div class="small">
                        Satzstand
                    </div>


                    <div
                        style="
                            font-size:28px;
                            font-weight:900;
                        ">

                        ${setScore.us}
                        :
                        ${setScore.opponent}

                    </div>

                </div>

            </div>


            ${
                setResults
                ? `

                    <div
                        class="set-results"
                        style="margin-top:12px;">

                        ${setResults}

                    </div>

                `
                : ""
            }

        </div>


        <div class="card">

            <h2>
                Gesamtanalyse
            </h2>


            ${renderTeamStats(game)}

        </div>


        <div class="card">

            <h2>
                Spielerinnen – Gesamt
            </h2>


            ${renderPlayerTable(game)}

        </div>


        <div class="card">

            <h2>
                Einzelne Sätze
            </h2>


            ${renderSetAnalyses(game)}

        </div>

    `;

}


/* =========================================================
   EINZELNE SÄTZE
========================================================= */

function renderSetAnalyses(game) {

    if (
        !game.sets ||
        !game.sets.length
    ) {

        return `

            <div class="empty">

                Noch keine abgeschlossenen
                Sätze.

            </div>

        `;

    }


    return game.sets
        .map(set => {

            return `

                <details>

                    <summary>

                        Satz ${set.set}
                        –
                        ${set.us}:${set.opponent}

                    </summary>


                    <div class="set-analysis">

                        ${renderTeamStats(
                            game,
                            set.set
                        )}


                        <div
                            style="margin-top:15px;">

                            <h3>
                                Spielerinnen
                            </h3>


                            ${renderPlayerTable(
                                game,
                                set.set
                            )}

                        </div>

                    </div>

                </details>

            `;

        })
        .join("");

}


/* =========================================================
   EXPORT
========================================================= */

function exportData() {

    const json =
        JSON.stringify(
            data,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type: "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href =
        url;


    a.download =
        `volleystats-backup-${
            new Date()
            .toISOString()
            .split("T")[0]
        }.json`;


    a.click();


    URL.revokeObjectURL(url);

}


/* =========================================================
   IMPORT
========================================================= */

function importData(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            try {

                const imported =
                    JSON.parse(
                        e.target.result
                    );


                if (
                    !imported ||
                    !Array.isArray(
                        imported.roster
                    ) ||
                    !Array.isArray(
                        imported.games
                    )
                ) {

                    throw new Error();

                }


                data =
                    imported;


                data.games.forEach(
                    game => {

                        if (
                            !game.actions
                        )
                            game.actions = [];


                        if (
                            !game.sets
                        )
                            game.sets = [];


                        if (
                            !game.substitutions
                        )
                            game.substitutions = [];


                        if (
                            !game.lineup
                        )
                            game.lineup = {};

                    }
                );


                saveData();


                renderGames();

                renderRoster();


                alert(
                    "Daten erfolgreich importiert."
                );


            }

            catch(e) {

                alert(
                    "Die Datei konnte nicht importiert werden."
                );

            }

        };


    reader.readAsText(file);


    event.target.value = "";

}


/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function formatPercent(value) {

    return `${value.toFixed(1)} %`;

}


function formatDate(date) {

    if (!date) return "";


    const d =
        new Date(
            date + "T12:00:00"
        );


    return d.toLocaleDateString(
        "de-DE"
    );

}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   START
========================================================= */

renderGames();

renderRoster();

</script>
