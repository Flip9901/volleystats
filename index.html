<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VolleyStats</title>

<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;
  --line:#e5e7eb;--blue:#1769e0;--green:#16a34a;--red:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
.app{min-height:100vh;padding-bottom:82px}
header{position:sticky;top:0;z-index:20;background:white;border-bottom:1px solid var(--line);
padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:22px;font-weight:900}
.team-select{width:auto;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:white}
main{max-width:1200px;margin:auto;padding:18px}
.page{display:none}.page.active{display:block}
h1,h2,h3,h4{margin-top:0}.muted{color:var(--muted)}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{padding:11px 15px;border-radius:11px;background:#e9eef5;font-weight:700}
.btn.primary{background:var(--blue);color:white}.btn.success{background:#dcfce7;color:#166534}
.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{padding:7px 10px;font-size:13px}
input,select{width:100%;padding:11px 12px;border:1px solid #d7dce2;border-radius:10px;background:white}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:white;border-top:1px solid var(--line);display:flex;justify-content:center}
nav button{flex:1;max-width:220px;padding:12px 5px;background:white;color:var(--muted);font-weight:700}
nav button.active{color:var(--blue)}
.game-card{cursor:pointer}.game-card:hover{border-color:var(--blue)}
.score{text-align:center;font-size:46px;font-weight:900}.set-score{text-align:center;color:var(--muted);font-weight:700}
.court{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:520px;margin:15px auto}
.position{min-height:88px;border:2px dashed #cbd5e1;border-radius:14px;background:#f8fafc;padding:8px;text-align:center}
.position strong{display:block;font-size:12px;color:var(--muted)}
.position-player{margin-top:7px;font-weight:800}
.bench{display:flex;flex-wrap:wrap;gap:8px}
.bench-player{padding:10px 12px;background:#eef2f7;border-radius:10px;cursor:grab;font-weight:700}
.player-select{padding:9px 11px;border-radius:10px;background:#eef2f7;font-weight:700}
.player-select.selected{background:var(--blue);color:white}
.action-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.action-grid button{min-height:65px;border-radius:12px;background:#eef2f7;font-weight:800}
.action-grid button.selected{background:var(--blue);color:white}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.result-grid button{min-height:56px;border-radius:12px;font-weight:800}
.good{background:#dcfce7;color:#166534}.neutral{background:#fef3c7;color:#92400e}
.bad{background:#fee2e2;color:#991b1b}
.last-action{border-left:5px solid var(--blue);background:#eff6ff;padding:12px;border-radius:10px}
.legend{font-size:13px;line-height:1.65;background:#f8fafc;border-radius:10px;padding:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}
.stat-number{font-size:28px;font-weight:900}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f7;font-size:12px;font-weight:700}
.set-tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px}
.set-tabs button{padding:8px 13px;border-radius:9px;background:#e9eef5;font-weight:700}
.set-tabs button.active{background:var(--blue);color:white}.scroll{overflow-x:auto}
.feed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:700px){
 main{padding:12px}.action-grid{grid-template-columns:repeat(5,1fr)}
 .result-grid{grid-template-columns:repeat(2,1fr)}.score{font-size:38px}
 .feed-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">🏐 VolleyStats</div>
  <select id="teamSelect" class="team-select" onchange="changeTeam(this.value)">
    <option value="Damen">Damen</option>
    <option value="Herren">Herren</option>
  </select>
</header>

<main>
<section id="page-games" class="page active"></section>
<section id="page-live" class="page"></section>
<section id="page-roster" class="page"></section>
<section id="page-analysis" class="page"></section>
</main>

<nav>
<button id="nav-games" onclick="showPage('games')">🏠<br>Spiele</button>
<button id="nav-live" onclick="showPage('live')">🏐<br>Live</button>
<button id="nav-roster" onclick="showPage('roster')">👥<br>Kader</button>
<button id="nav-analysis" onclick="showPage('analysis')">📊<br>Analyse</button>
</nav>

</div>

<script>
/* =========================================================
   VOLLEYSTATS
   ========================================================= */

const STORAGE_KEY="volleystats_complete_v3";

const EMPTY_DB={
  version:3,
  currentTeam:"Damen",
  selectedGameId:null,
  teams:{
    Damen:{players:[],games:[]},
    Herren:{players:[],games:[]}
  }
};

let db=loadDB();
let currentPage="games";
let selectedPlayer=null;
let selectedCategory=null;
let dragSource=null;
let opponentErrorMode=false;


/* =========================================================
   DATENBANK
   ========================================================= */

function loadDB(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved){
      const parsed=JSON.parse(saved);

      if(parsed.version===3 &&
         parsed.teams &&
         parsed.teams.Damen &&
         parsed.teams.Herren){
        return parsed;
      }
    }
  }catch(e){
    console.error(e);
  }

  return structuredClone(EMPTY_DB);
}

function saveDB(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

function currentTeam(){
  return db.teams[db.currentTeam];
}

function currentGame(){
  return currentTeam().games.find(g=>g.id===db.selectedGameId)||null;
}

function newId(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function esc(value){
  return String(value??"").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[char]));
}

function dateDE(date){
  return new Date(date).toLocaleDateString("de-DE");
}


/* =========================================================
   NAVIGATION
   ========================================================= */

function showPage(page){
  currentPage=page;
  render();
}

function changeTeam(team){
  db.currentTeam=team;
  db.selectedGameId=null;
  selectedPlayer=null;
  selectedCategory=null;
  saveDB();
  render();
}


/* =========================================================
   HAUPT-RENDER
   ========================================================= */

function render(){
  document.querySelectorAll(".page").forEach(el=>el.classList.remove("active"));

  const pageEl=document.getElementById("page-"+currentPage);
  if(pageEl)pageEl.classList.add("active");

  document.querySelectorAll("nav button").forEach(el=>el.classList.remove("active"));

  const nav=document.getElementById("nav-"+currentPage);
  if(nav)nav.classList.add("active");

  document.getElementById("teamSelect").value=db.currentTeam;

  renderGames();
  renderLive();
  renderRoster();
  renderAnalysis();
}


/* =========================================================
   SPIELE
   ========================================================= */

function renderGames(){

  const el=document.getElementById("page-games");
  const games=currentTeam().games.slice().reverse();

  el.innerHTML=`
    <div class="row between">
      <div>
        <h1>Spiele</h1>
        <div class="muted">${esc(db.currentTeam)}</div>
      </div>

      <button class="btn primary" onclick="createGame()">
        ＋ Neues Spiel
      </button>
    </div>

    <div class="grid" style="margin-top:15px">

      ${
        games.length
        ?
        games.map(game=>`

          <div class="card game-card" onclick="openGame('${game.id}')">

            <div class="row between">
              <strong>vs. ${esc(game.opponent)}</strong>

              <span class="pill">
                ${game.finished?"Beendet":"Live"}
              </span>
            </div>

            <div class="muted" style="margin-top:5px">
              ${dateDE(game.date)}
            </div>

            <h2 style="margin:14px 0">
              ${game.setsWon}:${game.setsLost}
            </h2>

            <div class="muted">
              ${game.sets.length
                ?game.sets.map(s=>`Satz ${s.no}: ${s.us}:${s.opponent}`).join(" · ")
                :"Noch kein Satz beendet"}
            </div>

            <div class="row" style="margin-top:12px">

              <button
                class="btn small"
                onclick="event.stopPropagation();openGame('${game.id}')">
                Öffnen
              </button>

              <button
                class="btn small danger"
                onclick="event.stopPropagation();deleteGame('${game.id}')">
                Löschen
              </button>

            </div>

          </div>

        `).join("")
        :
        `
        <div class="card">
          <h3>Noch keine Spiele</h3>
          <p class="muted">
            Erstelle dein erstes Spiel mit „Neues Spiel“.
          </p>
        </div>
        `
      }

    </div>
  `;
}


function createGame(){

  const opponent=prompt("Gegner:");

  if(!opponent || !opponent.trim())return;

  const game={
    id:newId(),
    opponent:opponent.trim(),
    date:new Date().toISOString(),

    finished:false,

    currentSet:1,

    scoreUs:0,
    scoreOpponent:0,

    setsWon:0,
    setsLost:0,

    /*
      null = Aufschlag noch nicht festgelegt
      us = wir
      opponent = Gegner
    */
    servingTeam:null,

    sets:[],

    actions:[],

    feeds:{},

    /*
      Position:
      1 = hinten rechts
      2 = vorne rechts
      3 = vorne Mitte
      4 = vorne links
      5 = hinten links
      6 = hinten Mitte
    */
    lineup:{
      1:null,
      2:null,
      3:null,
      4:null,
      5:null,
      6:null
    }
  };

  currentTeam().games.push(game);

  db.selectedGameId=game.id;

  saveDB();

  selectedPlayer=null;
  selectedCategory=null;

  currentPage="live";

  render();
}


function openGame(id){
  db.selectedGameId=id;
  selectedPlayer=null;
  selectedCategory=null;
  saveDB();

  currentPage="live";

  render();
}


function deleteGame(id){

  if(!confirm("Spiel wirklich löschen?"))return;

  currentTeam().games=currentTeam().games.filter(g=>g.id!==id);

  if(db.selectedGameId===id){
    db.selectedGameId=null;
  }

  saveDB();
  render();
}


/* =========================================================
   LIVE
   ========================================================= */

function renderLive(){

  const el=document.getElementById("page-live");
  const game=currentGame();

  if(!game){

    el.innerHTML=`
      <div class="card">
        <h1>Live</h1>

        <p class="muted">
          Noch kein Spiel ausgewählt.
        </p>

        <button class="btn primary" onclick="showPage('games')">
          Zu den Spielen
        </button>
      </div>
    `;

    return;
  }

  const players=currentTeam().players;

  el.innerHTML=`

    <div class="row between">

      <div>
        <h1>vs. ${esc(game.opponent)}</h1>

        <div class="muted">
          ${dateDE(game.date)} · Satz ${game.currentSet}
        </div>
      </div>

      <button class="btn" onclick="finishGame()">
        Spiel beenden
      </button>

    </div>


    <!-- SCORE -->

    <div class="grid" style="margin-top:14px">

      <div class="card">

        <div class="score">
          ${game.scoreUs} : ${game.scoreOpponent}
        </div>

        <div class="set-score">
          Sätze ${game.setsWon}:${game.setsLost}
        </div>

        <div class="row" style="justify-content:center;margin-top:12px">

          <span class="pill">
            Aufschlag:
            ${
              game.servingTeam==="us"
              ?"Wir"
              :
              game.servingTeam==="opponent"
              ?"Gegner"
              :
              "noch nicht festgelegt"
            }
          </span>

        </div>

        <div class="row" style="justify-content:center;margin-top:12px">

          <button class="btn success"
                  onclick="manualPoint('us')">
            + Unser Punkt
          </button>

          <button class="btn danger"
                  onclick="manualPoint('opponent')">
            + Gegnerpunkt
          </button>

        </div>

        <div class="row" style="justify-content:center;margin-top:9px">

          <button class="btn"
                  onclick="finishSet()">
            Satz beenden
          </button>

        </div>

      </div>


      <!-- LETZTE AKTION -->

      <div class="card">

        <h3>Letzte Aktion</h3>

        <div class="last-action">

          ${
            game.actions.length
            ?
            formatAction(game.actions[game.actions.length-1])
            :
            "Noch keine Aktion"
          }

        </div>

      </div>

    </div>


    <!-- AUFSTELLUNG -->

    <div class="grid" style="margin-top:14px">

      <div class="card">

        <h3>Aufstellung</h3>

        <p class="muted">
          Spieler von der Bank auf eine Position ziehen.
          Feldspieler aufeinander ziehen, um sie zu tauschen.
        </p>

        <div class="court">

          ${[4,3,2,5,6,1].map(position=>`

            <div
              class="position"
              draggable="true"
              ondragstart="dragPosition(${position})"
              ondragover="event.preventDefault()"
              ondrop="dropPosition(${position})">

              <strong>Position ${position}</strong>

              ${playerAtPosition(game,position)}

            </div>

          `).join("")}

        </div>


        <h4>Bank</h4>

        <div class="bench">

          ${
            players
              .filter(p=>!Object.values(game.lineup).includes(p.id))
              .map(p=>`

                <div
                  class="bench-player"
                  draggable="true"
                  ondragstart="dragBench('${p.id}')">

                  #${esc(p.num)} ${esc(p.name)}

                </div>

              `).join("")
              ||
              `<span class="muted">Keine Spieler auf der Bank.</span>`
          }

        </div>

      </div>


      <!-- AKTIONEN -->

      <div class="card">

        <h3>Aktion erfassen</h3>

        <p class="muted">
          1. Spieler → 2. Kategorie → 3. Ergebnis
        </p>


        <div class="bench">

          ${
            players.map(p=>`

              <button
                class="player-select ${
                  selectedPlayer===p.id?"selected":""
                }"
                onclick="selectPlayer('${p.id}')">

                #${esc(p.num)} ${esc(p.name)}

              </button>

            `).join("")
          }

        </div>


        <div class="action-grid" style="margin-top:12px">

          ${[
            ["Angriff",1],
            ["Annahme",2],
            ["Aufschlag",3],
            ["Block",4],
            ["Abwehr",5]
          ].map(([name,num])=>`

            <button
              class="${
                selectedCategory===name?"selected":""
              }"
              onclick="selectCategory('${name}')">

              ${num}<br>${name}

            </button>

          `).join("")}

        </div>


        ${renderResultButtons()}

      </div>

    </div>


    <!-- GEGNERFEHLER -->

    <div class="card" style="margin-top:14px">

      <h3>Gegnerfehler</h3>

      <p class="muted">
        Jeder Gegnerfehler gibt automatisch einen Punkt für uns.
      </p>

      <div class="result-grid">

        ${[
          "Aufschlag aus",
          "Aufschlag Netz",
          "Angriff aus",
          "Angriff Netz",
          "Netz / Rotation",
          "Sonstiger Fehler"
        ].map((name,index)=>`

          <button
            class="bad"
            onclick="recordOpponentError('${name}')">

            ${index+1}. ${name}

          </button>

        `).join("")}

      </div>

    </div>


    <!-- NUMPAD -->

    <div class="card" style="margin-top:14px">

      <h3>Numpad-Steuerung</h3>

      <div class="legend">

        <b>Spieler:</b><br>
        1–9 = Spieler 1–9<br>
        Shift+1 = Spieler 10<br>
        Shift+2 = Spieler 11<br>
        Shift+3 = Spieler 12<br>
        Shift+4 = Spieler 13<br>
        Shift+5 = Spieler 14<br><br>

        <b>Kategorien:</b><br>
        1 = Angriff<br>
        2 = Annahme<br>
        3 = Aufschlag<br>
        4 = Block<br>
        5 = Abwehr<br><br>

        <b>Gegnerfehler:</b><br>
        0 → 1–6<br><br>

        Die Eingabe funktioniert auch mit einem externen Numpad.

      </div>

    </div>


    <!-- AKTUELLER SATZ -->

    <div class="card" style="margin-top:14px">

      <h3>Analyse aktueller Satz</h3>

      ${renderSetAnalysis(game,game.currentSet)}

    </div>

  `;
}


function playerAtPosition(game,position){

  const playerId=game.lineup[position];

  if(!playerId){
    return `<div class="muted" style="margin-top:8px">leer</div>`;
  }

  const player=currentTeam().players.find(p=>p.id===playerId);

  if(!player){
    return `<div class="muted">unbekannt</div>`;
  }

  return `
    <div class="position-player">
      #${esc(player.num)} ${esc(player.name)}
    </div>
  `;
}


/* =========================================================
   DRAG & DROP
   ========================================================= */

function dragBench(playerId){
  dragSource={
    type:"bench",
    playerId
  };
}

function dragPosition(position){
  dragSource={
    type:"position",
    position
  };
}

function dropPosition(targetPosition){

  const game=currentGame();

  if(!game || !dragSource)return;

  if(dragSource.type==="bench"){

    /*
      Bankspieler kommt aufs Feld.
      Der bisherige Spieler geht automatisch auf die Bank.
    */

    game.lineup[targetPosition]=dragSource.playerId;

  }else{

    /*
      Zwei Feldspieler tauschen ihre Positionen.
    */

    const sourcePosition=dragSource.position;

    const temp=game.lineup[sourcePosition];

    game.lineup[sourcePosition]=game.lineup[targetPosition];

    game.lineup[targetPosition]=temp;
  }

  dragSource=null;

  saveDB();
  render();
}


/* =========================================================
   SPIELER / KATEGORIE
   ========================================================= */

function selectPlayer(id){
  selectedPlayer=id;
  render();
}

function selectCategory(category){
  selectedCategory=category;
  render();
}


const ACTION_RESULTS={

  Angriff:[
    ["1","Punkt","good"],
    ["2","Spielbar","neutral"],
    ["3","Fehler","bad"],
    ["4","Geblockt","bad"]
  ],

  Annahme:[
    ["1","Positiv","good"],
    ["2","Spielbar","neutral"],
    ["3","Fehler","bad"]
  ],

  Aufschlag:[
    ["1","Ass","good"],
    ["2","Druck","neutral"],
    ["3","Normal","neutral"],
    ["4","Fehler","bad"]
  ],

  Block:[
    ["1","Punkt","good"],
    ["2","Touch","neutral"],
    ["3","Fehler","bad"]
  ],

  Abwehr:[
    ["1","Erfolgreich","good"],
    ["2","Spielbar","neutral"],
    ["3","Fehler","bad"]
  ]

};


function renderResultButtons(){

  if(!selectedPlayer){
    return `
      <p class="muted" style="margin-top:12px">
        Zuerst Spieler auswählen.
      </p>
    `;
  }

  if(!selectedCategory){
    return `
      <p class="muted" style="margin-top:12px">
        Jetzt Kategorie auswählen.
      </p>
    `;
  }

  return `

    <div class="result-grid">

      ${ACTION_RESULTS[selectedCategory].map(result=>`

        <button
          class="${result[2]}"
          onclick="recordAction('${result[0]}','${result[1]}')">

          ${result[0]}. ${result[1]}

        </button>

      `).join("")}

    </div>

  `;
}


/* =========================================================
   AKTION AUFZEICHNEN
   ========================================================= */

function recordAction(code,label){

  const game=currentGame();

  if(!game || !selectedPlayer || !selectedCategory)return;

  const action={
    type:"player",
    playerId:selectedPlayer,
    category:selectedCategory,
    code,
    label,
    set:game.currentSet,
    time:Date.now()
  };

  game.actions.push(action);

  applyActionPoint(game,selectedCategory,code);

  saveDB();

  selectedPlayer=null;
  selectedCategory=null;

  render();
}


function applyActionPoint(game,category,code){

  let winner=null;

  if(category==="Angriff"){

    if(code==="1")winner="us";

    if(code==="3" || code==="4")winner="opponent";
  }

  if(category==="Annahme"){

    if(code==="3")winner="opponent";
  }

  if(category==="Aufschlag"){

    if(code==="1")winner="us";

    if(code==="4")winner="opponent";
  }

  if(category==="Block"){

    if(code==="1")winner="us";

    if(code==="3")winner="opponent";
  }

  if(category==="Abwehr"){

    if(code==="3")winner="opponent";
  }

  if(winner){
    awardPoint(game,winner);
  }
}


/* =========================================================
   GEGNERFEHLER
   ========================================================= */

function recordOpponentError(label){

  const game=currentGame();

  if(!game)return;

  game.actions.push({
    type:"opponentError",
    label,
    set:game.currentSet,
    time:Date.now()
  });

  awardPoint(game,"us");

  saveDB();
  render();
}


/* =========================================================
   MANUELLE PUNKTE
   ========================================================= */

function manualPoint(team){

  const game=currentGame();

  if(!game)return;

  awardPoint(game,team);

  game.actions.push({
    type:"manual",
    team,
    label:team==="us"?"Unser Punkt":"Gegnerpunkt",
    set:game.currentSet,
    time:Date.now()
  });

  saveDB();
  render();
}


/* =========================================================
   PUNKT + ROTATION
   ========================================================= */

function awardPoint(game,winner){

  /*
    Volleyball-Logik:

    Wir servieren + wir gewinnen:
      Punkt für uns, KEINE Rotation.

    Wir servieren + Gegner gewinnt:
      Gegner bekommt Punkt.
      Wir rotieren NICHT.
      Aufschlag wechselt zum Gegner.

    Gegner serviert + wir gewinnen:
      Punkt für uns.
      Wir rotieren.
      Aufschlag geht zu uns.

    Gegner serviert + Gegner gewinnt:
      Punkt für Gegner.
      Keine Rotation.
    */

  if(winner==="us"){
    game.scoreUs++;
  }else{
    game.scoreOpponent++;
  }


  if(game.servingTeam===null){

    /*
      Für den ersten Rallyepunkt:
      Der Gewinner bekommt den Aufschlag.
    */

    game.servingTeam=winner;

    return;
  }


  if(game.servingTeam==="opponent" && winner==="us"){

    rotatePlayers(game);

    game.servingTeam="us";

    return;
  }


  if(game.servingTeam==="us" && winner==="opponent"){

    game.servingTeam="opponent";

    return;
  }

  /*
    In allen anderen Fällen bleibt der Aufschlag
    bei derselben Mannschaft.
  */
}


function rotatePlayers(game){

  /*
    Rotation:

    1 → 6
    6 → 5
    5 → 4
    4 → 3
    3 → 2
    2 → 1
  */

  const old={...game.lineup};

  game.lineup[6]=old[1];
  game.lineup[5]=old[6];
  game.lineup[4]=old[5];
  game.lineup[3]=old[4];
  game.lineup[2]=old[3];
  game.lineup[1]=old[2];
}


/* =========================================================
   SÄTZE
   ========================================================= */

function saveCurrentSet(game){

  const setData={
    no:game.currentSet,
    us:game.scoreUs,
    opponent:game.scoreOpponent,
    actions:game.actions.filter(
      action=>action.set===game.currentSet
    )
  };

  const existing=game.sets.find(
    set=>set.no===game.currentSet
  );

  if(existing){
    Object.assign(existing,setData);
  }else{
    game.sets.push(setData);
  }

  game.setsWon=game.sets.filter(
    set=>set.us>set.opponent
  ).length;

  game.setsLost=game.sets.filter(
    set=>set.opponent>set.us
  ).length;
}


function finishSet(){

  const game=currentGame();

  if(!game)return;

  if(
    game.scoreUs===0 &&
    game.scoreOpponent===0
  ){
    alert("Der Satz hat noch keine Punkte.");
    return;
  }

  if(!confirm(
    `Satz ${game.currentSet} mit ${game.scoreUs}:${game.scoreOpponent} beenden?`
  ))return;

  saveCurrentSet(game);

  game.currentSet++;

  game.scoreUs=0;
  game.scoreOpponent=0;

  /*
    Die Aufstellung bleibt bestehen.
    Der Aufschlag wird für den neuen Satz
    neu festgelegt.
  */

  game.servingTeam=null;

  saveDB();
  render();
}


function finishGame(){

  const game=currentGame();

  if(!game)return;

  saveCurrentSet(game);

  game.finished=true;

  saveDB();
  render();
}

function formatAction(action){

  if(action.type==="opponentError"){
    return `
      <strong>Gegnerfehler</strong><br>
      ${esc(action.label)}
    `;
  }

  if(action.type==="manual"){
    return `
      <strong>${action.team==="us"?"Unser Punkt":"Gegnerpunkt"}</strong>
    `;
  }

  const player=currentTeam().players.find(
    p=>p.id===action.playerId
  );

  return `
    <strong>
      #${esc(player?.num||"?")} ${esc(player?.name||"Spieler")}
    </strong><br>
    ${esc(action.category)} · ${esc(action.label)}
  `;
}


/* =========================================================
   AKTUELLER SATZ – ANALYSE
   ========================================================= */

function renderSetAnalysis(game,setNo){

  const actions=game.actions.filter(
    action=>
      action.set===setNo &&
      action.type==="player"
  );

  const categories=[
    "Angriff",
    "Annahme",
    "Aufschlag",
    "Block",
    "Abwehr"
  ];

  return `

    <div class="grid">

      ${categories.map(category=>{

        const list=actions.filter(
          action=>action.category===category
        );

        const successful=list.filter(
          action=>action.code==="1"
        ).length;

        const percentage=list.length
          ?Math.round(successful/list.length*100)
          :0;

        return `

          <div class="card">

            <div class="muted">
              ${category}
            </div>

            <div class="stat-number">
              ${percentage}%
            </div>

            <div>
              ${successful} erfolgreich /
              ${list.length} Aktionen
            </div>

          </div>

        `;

      }).join("")}

    </div>

  `;
}

function numpadKey(number){

  if(number<=9){
    return number;
  }

  return `Shift+${number-9}`;
}


function addPlayer(){

  const name=document.getElementById("newPlayerName").value.trim();

  const number=Number(
    document.getElementById("newPlayerNumber").value
  );

  const position=
    document.getElementById("newPlayerPosition").value;

  if(!name){
    alert("Bitte einen Namen eingeben.");
    return;
  }

  if(
    !Number.isInteger(number) ||
    number<1 ||
    number>14
  ){
    alert("Bitte eine Nummer von 1 bis 14 verwenden.");
    return;
  }

  if(
    currentTeam().players.some(
      player=>player.num===number
    )
  ){
    alert("Diese Nummer ist bereits vergeben.");
    return;
  }

  currentTeam().players.push({

    id:newId(),
    name,
    num:number,
    position

  });

  saveDB();
  render();
}


function deletePlayer(id){

  if(!confirm("Spieler wirklich löschen?"))return;

  currentTeam().players=
    currentTeam().players.filter(
      player=>player.id!==id
    );

  currentTeam().games.forEach(game=>{

    Object.keys(game.lineup).forEach(position=>{

      if(game.lineup[position]===id){
        game.lineup[position]=null;
      }

    });

  });

  saveDB();
  render();
}

function overallMetric(game,category){

  const actions=game.actions.filter(
    action=>
      action.type==="player" &&
      action.category===category
  );

  const successful=actions.filter(
    action=>action.code==="1"
  ).length;

  const percentage=actions.length
    ?Math.round(successful/actions.length*100)
    :0;

  return `

    <div class="card">

      <div class="muted">
        ${category}
      </div>

      <div class="stat-number">
        ${percentage}%
      </div>

      <div>
        ${successful} erfolgreich
        von ${actions.length}
      </div>

    </div>

  `;
}


function changeAnalysisGame(id){

  db.selectedGameId=id;

  saveDB();

  render();
}


function renderFeedTable(game,setNumber){

  const feed=
    game.feeds?.[setNumber]||
    {
      aussen:0,
      diagonal:0,
      mitte:0,
      hinten:0
    };

  const total=
    Number(feed.aussen||0)+
    Number(feed.diagonal||0)+
    Number(feed.mitte||0)+
    Number(feed.hinten||0);

  return `

    <div class="card" style="margin-bottom:10px">

      <h4>Satz ${setNumber}</h4>

      <div class="feed-grid">

        ${[
          ["aussen","Außen"],
          ["diagonal","Diagonal"],
          ["mitte","Mitte"],
          ["hinten","Hinten"]
        ].map(([key,label])=>`

          <div>

            <label>${label}</label>

            <input
              type="number"
              min="0"
              value="${feed[key]||0}"
              onchange="
                saveFeed(
                  ${setNumber},
                  '${key}',
                  this.value
                )
              ">

          </div>

        `).join("")}

      </div>

      <p class="muted">
        Gesamt: ${total}
      </p>

    </div>

  `;
}


function saveFeed(setNumber,key,value){

  const game=currentGame();

  if(!game)return;

  if(!game.feeds){
    game.feeds={};
  }

  if(!game.feeds[setNumber]){
    game.feeds[setNumber]={
      aussen:0,
      diagonal:0,
      mitte:0,
      hinten:0
    };
  }

  game.feeds[setNumber][key]=
    Number(value)||0;

  saveDB();

  render();
}


/* =========================================================
   NUMPAD
   ========================================================= */

document.addEventListener("keydown",event=>{

  if(currentPage!=="live")return;

  const game=currentGame();

  if(!game)return;


  /*
    GEGNERFEHLER

    0 → 1–6
  */

  if(event.key==="0"){

    opponentErrorMode=true;

    event.preventDefault();

    return;
  }


  if(
    opponentErrorMode &&
    event.key>="1" &&
    event.key<="6"
  ){

    opponentErrorMode=false;

    const errors=[
      "Aufschlag aus",
      "Aufschlag Netz",
      "Angriff aus",
      "Angriff Netz",
      "Netz / Rotation",
      "Sonstiger Fehler"
    ];

    recordOpponentError(
      errors[Number(event.key)-1]
    );

    event.preventDefault();

    return;
  }


  /*
    SPIELER

    1–9
    Shift+1–5 = 10–14
  */

  let playerNumber=null;

  if(
    event.shiftKey &&
    event.key>="1" &&
    event.key<="5"
  ){

    playerNumber=
      Number(event.key)+9;

  }else if(
    !event.shiftKey &&
    event.key>="1" &&
    event.key<="9"
  ){

    playerNumber=Number(event.key);

  }


  /*
    Wenn bereits ein Spieler ausgewählt ist,
    haben 1–5 Vorrang als Kategorie.
  */

  if(
    selectedPlayer &&
    !event.shiftKey &&
    event.key>="1" &&
    event.key<="5"
  ){

    const categories=[
      "Angriff",
      "Annahme",
      "Aufschlag",
      "Block",
      "Abwehr"
    ];

    selectedCategory=
      categories[Number(event.key)-1];

    render();

    event.preventDefault();

    return;
  }


  if(playerNumber!==null){

    const player=currentTeam().players.find(
      p=>p.num===playerNumber
    );

    if(player){

      selectedPlayer=player.id;

      render();

      event.preventDefault();

      return;
    }
  }

});


/* =========================================================
   START
   ========================================================= */

render();

</script>
