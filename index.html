<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VolleyStats</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 14px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

input, select, button {
  font: inherit;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  margin-top: 6px;
}

.row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.players {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.player {
  min-height: 65px;
  border: none;
  border-radius: 12px;
  background: #e5e7eb;
  font-weight: 700;
  font-size: 17px;
}

.player.selected {
  background: #111827;
  color: white;
}

.category {
  margin-top: 18px;
  font-weight: 700;
  font-size: 18px;
}

.actions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 8px;
}

.action {
  border: none;
  border-radius: 12px;
  padding: 16px 8px;
  font-weight: 700;
  background: #e5e7eb;
}

.action:active,
.player:active,
.mainbutton:active {
  transform: scale(.97);
}

.mainbutton {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 14px;
  background: #111827;
  color: white;
  font-weight: 700;
  margin-top: 8px;
}

.danger {
  background: #b91c1c;
}

.stats {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.stats th,
.stats td {
  padding: 8px 4px;
  border-bottom: 1px solid #e5e7eb;
  text-align: center;
}

.stats th:first-child,
.stats td:first-child {
  text-align: left;
}

.hidden {
  display: none;
}

.message {
  text-align: center;
  font-weight: 700;
  padding: 8px;
}

.score {
  font-size: 30px;
  font-weight: 800;
  text-align: center;
}

.scorebuttons {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.scorebuttons button {
  width: 55px;
  height: 45px;
  border: none;
  border-radius: 10px;
  font-size: 22px;
  font-weight: bold;
  background: #e5e7eb;
}

@media (max-width: 600px) {
  .players {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>🏐 VolleyStats</h1>
</header>

<div class="container">

  <div class="card">
    <div class="row">
      <div>
        <label>Gegner</label>
        <input id="opponent" placeholder="z. B. Dachau">
      </div>

      <div>
        <label>Satz</label>
        <select id="setNumber">
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
        </select>
      </div>
    </div>

    <div class="score" id="score">0 : 0</div>

    <div class="scorebuttons">
      <button onclick="changeScore(1,0)">+1</button>
      <button onclick="changeScore(-1,0)">−1</button>
      <button onclick="changeScore(0,1)">+1</button>
      <button onclick="changeScore(0,-1)">−1</button>
    </div>
  </div>

  <div class="card">

    <h2>Spieler auswählen</h2>

    <div class="players" id="players"></div>

    <div class="message" id="message">
      Bitte Spieler auswählen
    </div>

    <div class="category">Angriff</div>

    <div class="actions">
      <button class="action" onclick="record('attack','kill')">
        🟢 Punkt
      </button>

      <button class="action" onclick="record('attack','playable')">
        🟡 Spielbar
      </button>

      <button class="action" onclick="record('attack','error')">
        🔴 Fehler
      </button>

      <button class="action" onclick="record('attack','blocked')">
        ⛔ Geblockt
      </button>
    </div>

    <div class="category">Annahme</div>

    <div class="actions">
      <button class="action" onclick="record('reception','positive')">
        🟢 Positiv
      </button>

      <button class="action" onclick="record('reception','neutral')">
        🟡 Neutral
      </button>

      <button class="action" onclick="record('reception','negative')">
        🟠 Negativ
      </button>

      <button class="action" onclick="record('reception','error')">
        🔴 Fehler / Ass
      </button>
    </div>

    <div class="category">Aufschlag</div>

    <div class="actions">
      <button class="action" onclick="record('serve','ace')">
        🟢 Ass
      </button>

      <button class="action" onclick="record('serve','pressure')">
        🟡 Druckvoll
      </button>

      <button class="action" onclick="record('serve','normal')">
        ⚪ Im Spiel
      </button>

      <button class="action" onclick="record('serve','error')">
        🔴 Fehler
      </button>
    </div>

    <div class="category">Block</div>

    <div class="actions">
      <button class="action" onclick="record('block','point')">
        🟢 Punkt
      </button>

      <button class="action" onclick="record('block','touch')">
        🟡 Touch
      </button>

      <button class="action" onclick="record('block','error')">
        🔴 Fehler
      </button>
    </div>

    <div class="category">Abwehr</div>

    <div class="actions">
      <button class="action" onclick="record('defense','successful')">
        🟢 Erfolgreich
      </button>

      <button class="action" onclick="record('defense','error')">
        🔴 Fehler
      </button>
    </div>

    <button class="mainbutton" onclick="undo()">
      ↩️ Letzte Aktion rückgängig
    </button>

  </div>

  <div class="card">
    <h2>Spielerstatistik</h2>

    <table class="stats">
      <thead>
        <tr>
          <th>Spieler</th>
          <th>Angriffe</th>
          <th>Punkte</th>
          <th>Fehler</th>
          <th>Eff.</th>
          <th>Annahme+</th>
          <th>Asse</th>
          <th>Block</th>
        </tr>
      </thead>

      <tbody id="stats"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Spieler bearbeiten</h2>

    <p>
      Du kannst hier die Namen deiner Spielerinnen eintragen.
    </p>

    <div id="roster"></div>

    <button class="mainbutton" onclick="saveRoster()">
      💾 Spieler speichern
    </button>
  </div>

  <div class="card">

    <h2>Daten</h2>

    <button class="mainbutton" onclick="exportData()">
      📤 Statistik sichern
    </button>

    <button class="mainbutton danger" onclick="newMatch()">
      🗑️ Neues Spiel
    </button>

  </div>

</div>

<script>

const defaultPlayers = [
  {number:1,name:"Spieler 1"},
  {number:2,name:"Spieler 2"},
  {number:3,name:"Spieler 3"},
  {number:4,name:"Spieler 4"},
  {number:5,name:"Spieler 5"},
  {number:6,name:"Spieler 6"},
  {number:7,name:"Spieler 7"},
  {number:8,name:"Spieler 8"},
  {number:9,name:"Spieler 9"},
  {number:10,name:"Spieler 10"},
  {number:11,name:"Spieler 11"},
  {number:12,name:"Spieler 12"}
];

let players =
  JSON.parse(localStorage.getItem("volleyPlayers"))
  || defaultPlayers;

let selectedPlayer = null;

let scoreA = 0;
let scoreB = 0;

let actions =
  JSON.parse(localStorage.getItem("volleyActions"))
  || [];

function save() {
  localStorage.setItem(
    "volleyPlayers",
    JSON.stringify(players)
  );

  localStorage.setItem(
    "volleyActions",
    JSON.stringify(actions)
  );
}

function renderPlayers() {

  const container =
    document.getElementById("players");

  container.innerHTML = "";

  players.forEach(player => {

    const button =
      document.createElement("button");

    button.className =
      "player" +
      (selectedPlayer === player.number
        ? " selected"
        : "");

    button.textContent =
      "#" + player.number +
      "\n" + player.name;

    button.onclick = () => {

      selectedPlayer = player.number;

      document.getElementById("message")
        .textContent =
        player.name + " ausgewählt";

      renderPlayers();
    };

    container.appendChild(button);
  });
}

function record(category, type) {

  if (!selectedPlayer) {

    document.getElementById("message")
      .textContent =
      "⚠️ Erst Spieler auswählen";

    return;
  }

  actions.push({
    player:selectedPlayer,
    category:category,
    type:type,
    time:Date.now()
  });

  save();
  renderStats();

  const player =
    players.find(p => p.number === selectedPlayer);

  document.getElementById("message")
    .textContent =
    "✓ " + player.name + ": " +
    category + " – " + type;
}

function undo() {

  if (actions.length === 0) return;

  actions.pop();

  save();
  renderStats();

  document.getElementById("message")
    .textContent =
    "Letzte Aktion rückgängig gemacht";
}

function renderStats() {

  const tbody =
    document.getElementById("stats");

  tbody.innerHTML = "";

  players.forEach(player => {

    const a =
      actions.filter(x =>
        x.player === player.number &&
        x.category === "attack"
      );

    const kills =
      a.filter(x => x.type === "kill").length;

    const attackErrors =
      a.filter(x =>
        x.type === "error" ||
        x.type === "blocked"
      ).length;

    const attacks = a.length;

    let efficiency = 0;

    if (attacks > 0) {

      efficiency =
        ((kills - attackErrors) / attacks * 100)
        .toFixed(0);
    }

    const receptions =
      actions.filter(x =>
        x.player === player.number &&
        x.category === "reception"
      );

    const positive =
      receptions.filter(x =>
        x.type === "positive"
      ).length;

    const positiveRate =
      receptions.length
        ? Math.round(
            positive / receptions.length * 100
          )
        : 0;

    const aces =
      actions.filter(x =>
        x.player === player.number &&
        x.category === "serve" &&
        x.type === "ace"
      ).length;

    const blocks =
      actions.filter(x =>
        x.player === player.number &&
        x.category === "block" &&
        x.type === "point"
      ).length;

    const row =
      document.createElement("tr");

    row.innerHTML = `
      <td>#${player.number} ${player.name}</td>
      <td>${attacks}</td>
      <td>${kills}</td>
      <td>${attackErrors}</td>
      <td>${efficiency}%</td>
      <td>${positiveRate}%</td>
      <td>${aces}</td>
      <td>${blocks}</td>
    `;

    tbody.appendChild(row);
  });
}

function renderRoster() {

  const container =
    document.getElementById("roster");

  container.innerHTML = "";

  players.forEach(player => {

    const input =
      document.createElement("input");

    input.value = player.name;

    input.dataset.number =
      player.number;

    input.placeholder =
      "Spieler " + player.number;

    container.appendChild(input);
  });
}

function saveRoster() {

  const inputs =
    document.querySelectorAll(
      "#roster input"
    );

  inputs.forEach(input => {

    const number =
      Number(input.dataset.number);

    const player =
      players.find(p =>
        p.number === number
      );

    player.name =
      input.value.trim() ||
      "Spieler " + number;
  });

  save();

  renderPlayers();
  renderStats();

  document.getElementById("message")
    .textContent =
    "✓ Spieler gespeichert";
}

function changeScore(a,b) {

  scoreA += a;
  scoreB += b;

  if (scoreA < 0) scoreA = 0;
  if (scoreB < 0) scoreB = 0;

  document.getElementById("score")
    .textContent =
    scoreA + " : " + scoreB;
}

function exportData() {

  const data = {
    opponent:
      document.getElementById("opponent").value,

    set:
      document.getElementById("setNumber").value,

    scoreA:scoreA,
    scoreB:scoreB,

    players:players,
    actions:actions
  };

  const blob =
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "VolleyStats-Spiel.json";

  a.click();

  URL.revokeObjectURL(url);
}

function newMatch() {

  if (!confirm(
    "Wirklich ein neues Spiel beginnen? Die aktuelle Statistik wird gelöscht."
  )) return;

  actions = [];

  scoreA = 0;
  scoreB = 0;

  save();

  document.getElementById("score")
    .textContent = "0 : 0";

  document.getElementById("message")
    .textContent =
    "Neues Spiel gestartet";

  renderStats();
}

renderPlayers();
renderStats();
renderRoster();

</script>

</body>
</html>
