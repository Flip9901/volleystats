<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VolleyStats</title>

<style>
:root{
  --bg:#f4f6fa;
  --card:#fff;
  --ink:#172033;
  --muted:#6b7485;
  --line:#e3e7ef;
  --accent:#315bea;
  --good:#168a55;
  --bad:#d43b45;
  --warn:#d88900;
  --shadow:0 8px 24px #18233a12;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  min-height:100vh;
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:10px 14px;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.brand{
  font-weight:900;
  font-size:21px;
  margin-right:auto;
}

.teamSelect{
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}

.nav{
  display:flex;
  gap:6px;
  padding:8px 14px;
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:58px;
  z-index:19;
}

.nav button{
  background:transparent;
  padding:10px 14px;
  border-radius:11px;
  color:var(--muted);
  font-weight:700;
}

.nav button.active{
  background:#edf1ff;
  color:var(--accent);
}

main{
  max-width:1300px;
  margin:auto;
  padding:16px;
}

.grid{
  display:grid;
  gap:14px;
}

.cols2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.cols3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow);
}

h2,h3{
  margin:0 0 12px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.primary{
  background:var(--accent);
  color:#fff;
  padding:11px 15px;
  border-radius:12px;
  font-weight:800;
}

.secondary{
  background:#eef1f6;
  color:var(--ink);
  padding:10px 13px;
  border-radius:11px;
  font-weight:700;
}

.danger{
  background:#ffecef;
  color:var(--bad);
  padding:10px 13px;
  border-radius:11px;
  font-weight:700;
}

.good{
  background:#e9f8f1;
  color:var(--good);
  padding:10px 13px;
  border-radius:11px;
  font-weight:800;
}

input,select{
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px 11px;
  background:#fff;
  min-width:0;
}

.score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:12px;
  align-items:center;
  text-align:center;
}

.scoreNum{
  font-size:54px;
  font-weight:900;
  line-height:1;
}

.scoreTeam{
  font-weight:800;
  font-size:18px;
}

.sets{
  font-weight:800;
  color:var(--muted);
  margin-top:7px;
}

.court{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,110px);
  gap:8px;
  max-width:700px;
  margin:auto;
}

.pos{
  border:2px dashed #cbd2df;
  border-radius:16px;
  background:#f8f9fc;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:8px;
  user-select:none;
}

.pos.drop{
  border-color:var(--accent);
  background:#edf1ff;
}

.pos b{
  display:block;
}

.bench{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  min-height:50px;
  padding:10px;
  border:2px dashed #d5dae4;
  border-radius:14px;
}

.playerChip{
  padding:10px 12px;
  border-radius:12px;
  background:#eef1f6;
  font-weight:800;
  touch-action:none;
}

.selected{
  outline:3px solid #9eb0ff;
  background:#edf1ff;
}

.actionGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.actionBtn{
  padding:13px 8px;
  border-radius:13px;
  background:#f0f2f7;
  text-align:left;
  font-weight:800;
}

.actionBtn span{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
  font-weight:600;
}

.actionBtn.sel{
  background:#e8edff;
  outline:2px solid var(--accent);
}

.resultGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.resultBtn{
  padding:13px 8px;
  border-radius:13px;
  background:#f0f2f7;
  font-weight:800;
}

.resultBtn.goodr{
  background:#eaf8f1;
}

.resultBtn.badr{
  background:#ffedf0;
}

.last{
  border-left:5px solid var(--accent);
  background:#f7f8ff;
  padding:12px;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  text-align:left;
  padding:9px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

th{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
}

.statgrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.stat{
  background:#f6f7fa;
  border-radius:13px;
  padding:11px;
}

.stat b{
  font-size:22px;
  display:block;
}

.pill{
  display:inline-block;
  padding:5px 8px;
  border-radius:999px;
  background:#eef1f6;
  font-size:12px;
  font-weight:800;
  margin:2px;
}

.keylegend{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.key{
  padding:9px;
  border-radius:10px;
  background:#f5f6f9;
  font-size:13px;
}

.key b{
  display:inline-block;
  min-width:34px;
}

.tabs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.tabs button{
  padding:9px 12px;
  border-radius:10px;
  background:#eef1f6;
  font-weight:700;
}

.tabs button.active{
  background:#e8edff;
  color:var(--accent);
}

.hidden{
  display:none!important;
}

.modalBack{
  position:fixed;
  inset:0;
  background:#11182766;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal{
  background:#fff;
  border-radius:20px;
  padding:20px;
  width:min(520px,100%);
  box-shadow:0 20px 60px #0003;
}

.toast{
  position:fixed;
  right:16px;
  bottom:16px;
  background:#172033;
  color:#fff;
  padding:12px 15px;
  border-radius:12px;
  z-index:200;
}

@media(max-width:850px){

  .cols2,
  .cols3{
    grid-template-columns:1fr;
  }

  .statgrid{
    grid-template-columns:repeat(2,1fr);
  }

  .actionGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .resultGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .court{
    grid-template-rows:repeat(2,90px);
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const KEY='volleystats_clean_v3';

const cats={
  attack:{
    name:'Angriff',
    items:[
      ['kill','Punkt'],
      ['playable','Spielbar'],
      ['error','Fehler'],
      ['blocked','Geblockt']
    ]
  },

  reception:{
    name:'Annahme',
    items:[
      ['positive','Positiv'],
      ['playable','Spielbar'],
      ['error','Fehler']
    ]
  },

  serve:{
    name:'Aufschlag',
    items:[
      ['ace','Ass'],
      ['pressure','Druckvoll'],
      ['normal','Normal'],
      ['error','Fehler']
    ]
  },

  block:{
    name:'Block',
    items:[
      ['point','Punkt'],
      ['touch','Touch'],
      ['error','Fehler']
    ]
  },

  defense:{
    name:'Abwehr',
    items:[
      ['successful','Erfolgreich'],
      ['playable','Spielbar'],
      ['error','Fehler']
    ]
  }
};

const oppErr=[
  ['serveout','Aufschlag aus'],
  ['servenet','Aufschlag Netz'],
  ['attackout','Angriff aus'],
  ['attacknet','Angriff Netz'],
  ['net','Netz/Rotation'],
  ['other','Sonstiger Fehler']
];

let db=load();

let state={
  page:'live',
  teamId:null,
  gameId:null,
  player:null,
  cat:null,
  oppMode:false,
  analysisTab:'gesamt'
};

let undoStack=[];


/* =========================
   DATEN
========================= */

function load(){

  try{

    let x=JSON.parse(localStorage.getItem(KEY));

    if(x && x.teams?.length)
      return x;

  }catch(e){}

  return {
    teams:[
      {
        id:id(),
        name:'Damen',
        players:[],
        games:[]
      }
    ],
    activeTeam:null
  };
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
}

function id(){
  return Math.random().toString(36).slice(2,10);
}

function team(){
  return db.teams.find(t=>t.id===state.teamId)||db.teams[0];
}

function game(){
  return team()?.games.find(g=>g.id===state.gameId);
}

function pct(a,b){
  return b ? Math.round(a/b*100) : 0;
}

function fmtDate(d){
  return new Date(d).toLocaleDateString('de-DE');
}

function snapshot(){

  undoStack.push(
    JSON.stringify(db)
  );

  if(undoStack.length>30)
    undoStack.shift();
}

function undo(){

  if(!undoStack.length){
    return toast('Nichts rückgängig zu machen.');
  }

  db=JSON.parse(
    undoStack.pop()
  );

  save();
  render();

  toast('Letzte Aktion rückgängig.');
}

function toast(s){

  let e=document.createElement('div');

  e.className='toast';
  e.textContent=s;

  document.body.appendChild(e);

  setTimeout(
    ()=>e.remove(),
    1800
  );
}


/* =========================
   SPIEL
========================= */

function ensureGame(){

  let t=team();

  if(!t)return;

  if(!state.gameId || !game()){

    state.gameId=
      t.games.find(g=>!g.finished)?.id ||
      t.games[0]?.id ||
      null;
  }
}

function newGame(){

  const t=team();

  if(!t.players.length){

    return toast(
      'Bitte zuerst Spieler im Kader anlegen.'
    );
  }

  const opp=prompt(
    'Gegner:',
    'Gegner'
  );

  if(!opp)return;

  const serve=confirm(
    'Wir beginnen mit Aufschlag?\n\nOK = Wir\nAbbrechen = Gegner'
  );

  const g={
    id:id(),
    opponent:opp,
    date:new Date().toISOString(),

    currentSet:1,

    scoreUs:0,
    scoreOpponent:0,

    sets:[],

    actions:[],

    lineups:[],

    lineup:t.players
      .slice(0,6)
      .map(p=>p.id),

    bench:t.players
      .slice(6)
      .map(p=>p.id),

    setFeeds:{},

    servingTeam:
      serve
      ? 'us'
      : 'opponent',

    finished:false,

    lastAction:null
  };

  t.games.unshift(g);

  state.gameId=g.id;
  state.page='live';

  save();
  render();
}


/* =========================
   ROTATION
========================= */

/*
   Array:
   Index 0 = Position 1
   Index 1 = Position 2
   Index 2 = Position 3
   Index 3 = Position 4
   Index 4 = Position 5
   Index 5 = Position 6

   Volleyball-Rotation:
   1 -> 6
   6 -> 5
   5 -> 4
   4 -> 3
   3 -> 2
   2 -> 1
*/

function rotate(g){

  g.lineup=[
    g.lineup[1],
    g.lineup[2],
    g.lineup[3],
    g.lineup[4],
    g.lineup[5],
    g.lineup[0]
  ];
}


/*
   Wichtig:
   Wir rotieren NICHT bei jedem eigenen Punkt.

   Nur wenn:
   Gegner serviert
   +
   wir gewinnen den Ballwechsel.

   Danach haben wir Aufschlag.
*/

function point(g,side){

  if(side==='us'){

    if(g.servingTeam==='opponent'){

      rotate(g);
    }

    g.scoreUs++;

    g.servingTeam='us';

  }else{

    g.scoreOpponent++;

    g.servingTeam='opponent';
  }
}


/* =========================
   SATZ
========================= */

function finishSet(){

  const g=game();

  if(!g)return;

  if(g.scoreUs===g.scoreOpponent){

    return toast(
      'Ein Satz kann nicht unentschieden beendet werden.'
    );
  }

  snapshot();

  g.sets.push({
    number:g.currentSet,
    us:g.scoreUs,
    opp:g.scoreOpponent,

    actions:g.actions.filter(
      a=>a.set===g.currentSet
    ),

    lineup:g.lineup.slice(),

    feed:
      g.setFeeds[g.currentSet] || {}
  });

  const usSets=
    g.sets.filter(
      s=>s.us>s.opp
    ).length;

  const oppSets=
    g.sets.filter(
      s=>s.opp>s.us
    ).length;

  /*
     Spielende bei:
     Best of 5:
     3 gewonnene Sätze
  */

  if(
    usSets>=3 ||
    oppSets>=3
  ){

    g.finished=true;

    g.scoreUs=0;
    g.scoreOpponent=0;

    save();
    render();

    return;
  }

  g.currentSet++;

  g.scoreUs=0;
  g.scoreOpponent=0;

  /*
     Aufschlag bleibt nach Satzende
     grundsätzlich bei der zuletzt
     bekannten servingTeam-Logik.
  */

  save();
  render();
}


/* =========================
   SPIELER-AKTION
========================= */

function record(cat,result,pid){

  const g=game();

  if(!g || !pid)return;

  snapshot();

  const p=
    team().players.find(
      x=>x.id===pid
    );

  const label=
    p?.name || '?';

  const a={
    type:'player',
    set:g.currentSet,
    player:pid,
    playerName:label,
    cat,
    result,
    time:Date.now()
  };

  g.actions.push(a);

  let ours=null;

  /*
     EIGENER PUNKT
  */

  if(
    cat==='attack' &&
    result==='kill'
  )
    ours='us';

  if(
    cat==='serve' &&
    result==='ace'
  )
    ours='us';

  if(
    cat==='block' &&
    result==='point'
  )
    ours='us';


  /*
     GEGNERPUNKT
  */

  if(
    cat==='attack' &&
    (
      result==='error' ||
      result==='blocked'
    )
  )
    ours='opp';

  if(
    cat==='serve' &&
    result==='error'
  )
    ours='opp';

  if(
    cat==='reception' &&
    result==='error'
  )
    ours='opp';

  if(
    cat==='block' &&
    result==='error'
  )
    ours='opp';

  if(
    cat==='defense' &&
    result==='error'
  )
    ours='opp';


  if(ours)
    point(g,ours);


  g.lastAction={
    text:
      `${label}: ${
        cats[cat].name
      } – ${
        cats[cat].items.find(
          x=>x[0]===result
        )?.[1] || result
      }`,
    time:Date.now()
  };


  /*
     Nach jeder Aktion Auswahl löschen.
  */

  state.player=null;
  state.cat=null;
  state.oppMode=false;

  save();
  render();
}


/* =========================
   GEGNERFEHLER
========================= */

function opponentError(k){

  const g=game();

  if(!g)return;

  snapshot();

  const name=
    oppErr.find(
      x=>x[0]===k
    )?.[1] || k;

  g.actions.push({
    type:'oppError',
    set:g.currentSet,
    error:k,
    errorName:name,
    time:Date.now()
  });

  /*
     Gegner macht Fehler:
     Wir bekommen Punkt.
     Falls Gegner serviert:
     automatische Rotation.
  */

  point(g,'us');

  g.lastAction={
    text:`Gegnerfehler: ${name}`,
    time:Date.now()
  };

  state.player=null;
  state.cat=null;
  state.oppMode=false;

  save();
  render();
}


/* =========================
   MANUELLER PUNKT
========================= */

function manualPoint(side){

  const g=game();

  if(!g)return;

  snapshot();

  point(g,side);

  g.actions.push({
    type:'manual',
    set:g.currentSet,
    side,
    time:Date.now()
  });

  g.lastAction={
    text:
      `Punkt manuell für ${
        side==='us'
        ? 'uns'
        : 'Gegner'
      }`,
    time:Date.now()
  };

  save();
  render();
}


/* =========================
   ZUSPIELVERTEILUNG
========================= */

function setFeed(setNo){

  const g=game();

  if(!g)return;

  const names=[
    'Zuspiel Außen',
    'Zuspiel Mitte',
    'Zuspiel Diagonal',
    'Zuspiel Hinterfeld'
  ];

  let html=
    '<div class="grid cols2">';

  names.forEach(
    (n,i)=>{

      html+=`
        <label>
          ${n}
          <input
            type="number"
            min="0"
            value="${
              g.setFeeds[setNo]?.[i] || 0
            }"
            data-feed="${i}"
          >
        </label>
      `;
    }
  );

  html+='</div>';

  showModal(
    'Zuspielverteilung – Satz '+setNo,
    html,
    ()=>{

      snapshot();

      g.setFeeds[setNo]={};

      document
        .querySelectorAll(
          '[data-feed]'
        )
        .forEach(
          x=>{
            g.setFeeds[setNo][x.dataset.feed]
              =+x.value || 0;
          }
        );

      save();
      render();
    }
  );
}


/* =========================
   MODAL
========================= */

function showModal(
  title,
  body,
  onSave
){

  const b=
    document.createElement('div');

  b.className='modalBack';

  b.innerHTML=`
    <div class="modal">

      <h2>${title}</h2>

      ${body}

      <div
        class="row"
        style="
          justify-content:flex-end;
          margin-top:16px
        "
      >

        <button
          class="secondary"
          id="mc"
        >
          Abbrechen
        </button>

        <button
          class="primary"
          id="ms"
        >
          Speichern
        </button>

      </div>

    </div>
  `;

  document.body.appendChild(b);

  b.querySelector('#mc')
    .onclick=()=>b.remove();

  b.querySelector('#ms')
    .onclick=()=>{
      onSave();
      b.remove();
    };
}


/* =========================
   KADER
========================= */

function addPlayer(){

  const t=team();

  showModal(
    'Spieler hinzufügen',

    `
      <div class="grid">

        <input
          id="pn"
          placeholder="Name"
        >

        <input
          id="num"
          type="number"
          min="1"
          max="99"
          placeholder="Trikotnummer"
        >

        <select id="pos">

          <option>Außen</option>
          <option>Diagonal</option>
          <option>Mitte</option>
          <option>Zuspiel</option>
          <option>Libero</option>

        </select>

      </div>
    `,

    ()=>{

      const name=
        document
          .getElementById('pn')
          .value
          .trim();

      const num=
        document
          .getElementById('num')
          .value
          .trim();

      const pos=
        document
          .getElementById('pos')
          .value;

      if(!name || !num){

        return toast(
          'Name und Trikotnummer fehlen.'
        );
      }

      if(
        t.players.some(
          p=>p.num==num
        )
      ){

        return toast(
          'Diese Trikotnummer gibt es bereits.'
        );
      }

      t.players.push({
        id:id(),
        name,
        num:+num,
        pos
      });

      save();
      render();
    }
  );
}


function editPlayer(pid){

  const t=team();

  const p=
    t.players.find(
      x=>x.id===pid
    );

  if(!p)return;

  showModal(

    'Spieler bearbeiten',

    `
      <div class="grid">

        <input
          id="pn"
          value="${esc(p.name)}"
        >

        <input
          id="num"
          type="number"
          value="${p.num}"
        >

        <select id="pos">

          ${
            [
              'Außen',
              'Diagonal',
              'Mitte',
              'Zuspiel',
              'Libero'
            ]
            .map(
              x=>`
                <option
                  ${
                    x===p.pos
                    ? 'selected'
                    : ''
                  }
                >
                  ${x}
                </option>
              `
            )
            .join('')
          }

        </select>

      </div>
    `,

    ()=>{

      const n=
        document
          .getElementById('pn')
          .value
          .trim();

      const nu=
        +document
          .getElementById('num')
          .value;

      const po=
        document
          .getElementById('pos')
          .value;

      if(
        t.players.some(
          x=>
            x.id!==pid &&
            x.num===nu
        )
      ){

        return toast(
          'Diese Trikotnummer gibt es bereits.'
        );
      }

      p.name=n;

function deletePlayer(pid){

  const t=team();

  const p=
    t.players.find(
      x=>x.id===pid
    );

  if(!p)return;

  if(
    !confirm(
      `Spieler ${p.name} löschen?`
    )
  )
    return;

  snapshot();

  t.players=
    t.players.filter(
      x=>x.id!==pid
    );

  t.games.forEach(
    g=>{

      g.lineup=
        g.lineup.map(
          x=>x===pid
          ? null
          : x
        );

      g.bench=
        g.bench.filter(
          x=>x!==pid
        );
    }
  );

  save();
  render();
}

/* =========================
   DRAG & DROP
========================= */

function dragStart(e,pid){

  e.dataTransfer
    .setData(
      'text/plain',
      pid
    );
}

function dropOn(e,targetIndex){

  e.preventDefault();

  const from=
    e.dataTransfer
      .getData('text/plain');

  const g=game();

  if(!g || !from)return;

  snapshot();

  let bi=
    g.bench.indexOf(from);

  /*
     Bank -> Feld
  */

  if(bi>=0){

    let old=
      g.lineup[targetIndex];

    g.lineup[targetIndex]=from;

    g.bench=
      g.bench.filter(
        x=>x!==from
      );

    if(old)
      g.bench.push(old);

  }

  /*
     Feld -> Feld
     = Tausch
  */

  else{

    let fi=
      g.lineup.indexOf(from);

    if(
      fi>=0 &&
      fi!==targetIndex
    ){

      [
        g.lineup[fi],
        g.lineup[targetIndex]
      ]=[
        g.lineup[targetIndex],
        g.lineup[fi]
      ];
    }
  }

  save();
  render();
}


/* =========================
   STATISTIK
========================= */

function stats(
  actions,
  pid=null
){

  let s={
    attackN:0,
    attackK:0,

    recN:0,
    recP:0,

    defN:0,
    defS:0,

    serveN:0,
    aces:0,
    serveE:0,

    blockN:0,
    blockP:0,

    attackErr:0,
    blocked:0,

    recErr:0,
    defErr:0,
    blockErr:0
  };

  actions
    .filter(
      a=>
        a.type==='player' &&
        (!pid || a.player===pid)
    )
    .forEach(
      a=>{

        if(a.cat==='attack'){

          s.attackN++;

          if(a.result==='kill')
            s.attackK++;

          if(a.result==='error')
            s.attackErr++;

          if(a.result==='blocked')
            s.blocked++;
        }

        if(a.cat==='reception'){

          s.recN++;

          if(a.result==='positive')
            s.recP++;

          if(a.result==='error')
            s.recErr++;
        }

        if(a.cat==='defense'){

          s.defN++;

          if(a.result==='successful')
            s.defS++;

          if(a.result==='error')
            s.defErr++;
        }

        if(a.cat==='serve'){

          s.serveN++;

          if(a.result==='ace')
            s.aces++;

          if(a.result==='error')
            s.serveE++;
        }

        if(a.cat==='block'){

          s.blockN++;

          if(a.result==='point')
            s.blockP++;

          if(a.result==='error')
            s.blockErr++;
        }

      }
    );

  return s;
}

========================= */

function exportData(){

  const a=
    document.createElement('a');

  a.href=
    URL.createObjectURL(
      new Blob(
        [
          JSON.stringify(
            db,
            null,
            2
          )
        ],
        {
          type:'application/json'
        }
      )
    );

  a.download=
    'volleystats-backup.json';

  a.click();
}


function importData(e){

  const f=
    e.target.files[0];

  if(!f)return;

  const r=
    new FileReader();

  r.onload=()=>{

    try{

      const x=
        JSON.parse(
          r.result
        );

      if(!x.teams)
        throw 0;

      db=x;

      state.teamId=
        db.teams[0].id;

      state.gameId=null;

      save();
      render();

      toast(
        'Backup importiert.'
      );

    }catch(_){

      toast(
        'Ungültige JSON-Datei.'
      );
    }
  };

  r.readAsText(f);
}


/* =========================
   TASTATUR / NUMPAD
========================= */

document.addEventListener(
  'keydown',
  e=>{

    /*
       Eingabefelder ignorieren.
    */

    if(
      [
        'INPUT',
        'TEXTAREA',
        'SELECT'
      ].includes(
        document.activeElement.tagName
      )
    )
      return;


    const k=e.key;


    /*
       Ctrl/Cmd + Z
    */

    if(
      k==='z' &&
      (e.ctrlKey || e.metaKey)
    ){

      e.preventDefault();

      undo();

      return;
    }


    /*
       0 = Gegnerfehler-Modus
    */

    if(k==='0'){

      state.oppMode=true;

      state.player=null;
      state.cat=null;

      render();

      return;
    }


    /*
       Gegnerfehler:
       0 -> 1-6
    */

    if(state.oppMode){

      let n=+k;

      if(
        n>=1 &&
        n<=6
      ){

        opponentError(
          oppErr[n-1][0]
        );
      }

      return;
    }


    const t=team();

    if(!t)return;


    /*
       Spieler auswählen
    */

    if(!state.player){

      let n=+k;

      /*
         Spieler 10–14:
         Shift + 1–5
      */

      if(e.shiftKey)
        n+=9;

      const p=
        t.players.find(
          x=>x.num===n
        );

      if(p){

        state.player=p.id;

        render();
      }

      return;
    }


    /*
       Kategorie auswählen
    */

    if(!state.cat){

      let n=+k;

      const keys=
        Object.keys(cats);

      if(
        n>=1 &&
        n<=5
      ){

        state.cat=
          keys[n-1];

        render();
      }

      return;
    }


    /*
       Ergebnis auswählen
    */

    const n=+k;

    if(
      n>=1 &&
      n<=cats[state.cat].items.length
    ){

      record(
        state.cat,
        cats[state.cat].items[n-1][0],
        state.player
      );
    }

  }
);

                      t.id===state.teamId
                      ? 'selected'
                      : ''
                    }
                  >
                    ${esc(t.name)}
                  </option>

                `
              )
              .join('')
          }

        </select>


        <button
          class="secondary"
          onclick="addTeam()"
        >
          + Team
        </button>

      </header>


      <nav class="nav">

        ${
          [
            ['live','Live'],
            ['games','Spiele'],
            ['roster','Kader']
          ]
          .map(
            x=>`

              <button
                class="
                  ${
                    state.page===x[0]
                    ? 'active'
                    : ''
                  }
                "
                onclick="
                  state.page='${x[0]}';
                  render()
                "
              >
                ${x[1]}
              </button>

            `
          )
          .join('')
        }

      </nav>


      <main>

        ${
          state.page==='live'
          ? liveUI()

          : state.page==='games'
          ? gamesUI()

          : rosterUI()
        }

      </main>
    `;


  document
    .getElementById('teamSel')
    .onchange=
      e=>changeTeam(
        e.target.value
      );
}


/* =========================
   START
========================= */

state.teamId=
  db.activeTeam ||
  db.teams[0].id;

ensureGame();

render();

</script>

</body>
</html>
