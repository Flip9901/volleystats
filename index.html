<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>VolleyStats</title><style>
:root{--bg:#0b1220;--p:#142033;--p2:#1d2d43;--line:#30425b;--tx:#f4f7fb;--mut:#9fb0c7;--g:#55e0a3;--b:#69a9ff;--r:#ff7d89;--a:#ffc66d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#0b1220,#12253a);color:var(--tx);font:15px system-ui;padding:14px}main{max-width:1100px;margin:auto}.top,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top,.between{justify-content:space-between}.top{margin-bottom:14px}.brand{display:flex;gap:10px;align-items:center}.logo{background:var(--g);color:#092018;border-radius:13px;padding:10px;font-weight:900;font-size:22px}.brand h1{margin:0}.muted,.hint,small{color:var(--mut)}button,input,select{font:inherit}button{cursor:pointer;background:var(--p2);color:var(--tx);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-weight:650}button.primary{background:var(--g);color:#092018;border-color:transparent}button.danger{background:#482432}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.nav .active{background:var(--g);color:#092018}.card{background:var(--p);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px}.card h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px}.s12{grid-column:span 12}.s6{grid-column:span 6}.s5{grid-column:span 5}.s7{grid-column:span 7}input,select{background:#0d1828;color:var(--tx);border:1px solid var(--line);padding:9px;border-radius:9px;max-width:100%}.field{display:grid;gap:5px;margin:8px 0}.field input{width:100%}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);padding:11px;border-radius:12px;margin-top:8px}.scoreline{display:flex;justify-content:center;align-items:center;gap:25px;text-align:center}.score{font-size:45px;font-weight:900}.score small{display:block;font-size:12px}.serve{color:var(--a);font-weight:750;margin:7px 0}.court{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pos{min-height:75px;border:1px solid #47715f;background:#193b35;border-radius:12px;padding:7px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px}.pos strong{font-size:13px}.pos small{font-size:11px}.chip{padding:8px;background:#0d1828;border:1px solid var(--line);border-radius:9px}.chip.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}.bench,.cats,.results{display:grid;gap:7px}.bench{display:flex;flex-wrap:wrap;margin:8px 0}.cats{grid-template-columns:repeat(3,1fr)}.results{grid-template-columns:repeat(2,1fr)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#0d1828;border:1px solid var(--line);border-radius:11px;padding:10px}.stat b{display:block;font-size:21px}.stat small{font-size:11px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line)}th{color:var(--mut)}.scroll{overflow:auto}.pill{display:inline-block;border-radius:99px;background:#20334b;padding:5px 9px;font-size:12px}.last{border-left:3px solid var(--g);background:#102a29;padding:11px;border-radius:8px}.hint{font-size:12px;line-height:1.5}.empty{text-align:center;padding:22px;color:var(--mut)}@media(max-width:720px){.s6,.s5,.s7{grid-column:span 12}.stats{grid-template-columns:repeat(2,1fr)}body{padding:9px}.score{font-size:38px}}
</style></head><body><main><header class="top"><div class="brand"><div class="logo">V</div><div><h1>VolleyStats</h1><small>Live-Scouting · Analyse</small></div></div><div class="row"><select id="teamSel"></select><button onclick="addTeam()">＋ Team</button></div></header><nav class="nav"><button data-p="games" onclick="go('games')">Spiele</button><button data-p="live" onclick="go('live')">Live</button><button data-p="roster" onclick="go('roster')">Kader</button><button data-p="analysis" onclick="go('analysis')">Analyse</button></nav><div id="app"></div><p class="hint">Daten werden lokal in diesem Browser gespeichert. Regelmäßig über „JSON exportieren“ sichern.</p></main>
<script>
const KEY='volleystats_clean_v3', $=id=>document.getElementById(id), uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cats={attack:['Angriff',[['kill','Punkt'],['playable','Spielbar'],['error','Fehler'],['blocked','Geblockt']]],reception:['Annahme',[['positive','Positiv'],['playable','Spielbar'],['error','Fehler']]],serve:['Aufschlag',[['ace','Ass'],['pressure','Druckvoll'],['normal','Normal'],['error','Fehler']]],block:['Block',[['point','Blockpunkt'],['touch','Touch'],['error','Fehler']]],defense:['Abwehr',[['successful','Erfolgreich'],['playable','Spielbar'],['error','Fehler']]]};
const oppErr=[['serveout','Aufschlag aus'],['servenet','Aufschlag Netz'],['attackout','Angriff aus'],['attacknet','Angriff Netz'],['net','Netz/Rotation'],['other','Sonstiger Fehler']];
let db=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));if(x?.teams?.length){x.teams.forEach(t=>{t.players??=[];t.games??=[];t.games.forEach(g=>{g.servingTeam??='us';g.lineup??=[null,null,null,null,null,null];g.actions??=[];g.sets??=[];g.setFeeds??={}})});return x}}catch(e){}return{teamId:'t1',teams:[{id:'t1',name:'Damen',players:[],games:[]}]}})(),page='games',selPlayer=null,selCat=null,drag=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)), T=()=>db.teams.find(t=>t.id===db.teamId)||db.teams[0], G=()=>T()?.games.find(g=>g.id===T().activeGame), go=p=>{page=p;selPlayer=selCat=null;render()};
function render(){save();$('teamSel').innerHTML=db.teams.map(t=>`<option value="${t.id}" ${t.id===db.teamId?'selected':''}>${esc(t.name)}</option>`).join('');$('teamSel').onchange=e=>{db.teamId=e.target.value;go('games')};document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===page));$('app').innerHTML=page==='games'?gamesUI():page==='roster'?rosterUI():page==='live'?liveUI():analysisUI()}
function addTeam(){let n=prompt('Teamname:');if(n?.trim()){let t={id:uid(),name:n.trim(),players:[],games:[]};db.teams.push(t);db.teamId=t.id;go('roster')}}
function addPlayer(){let t=T(),n=prompt('Name:');if(!n?.trim())return;let no=prompt('Trikotnummer (optional):','')||'',k=(prompt('Scouting-Taste: 1–9 oder Shift+1 bis Shift+5','')||'').toUpperCase().replace(/\s/g,''),key=k.startsWith('SHIFT+')?'S'+k.slice(6):k;if(!/^[1-9]$/.test(key)&&!/^S[1-5]$/.test(key))return alert('Ungültige Taste.');if(t.players.some(p=>p.key===key))return alert('Taste bereits vergeben.');t.players.push({id:uid(),name:n.trim(),number:no,key});render()}
function editPlayer(id){let p=T().players.find(x=>x.id===id),n=prompt('Name:',p.name);if(!n?.trim())return;let no=prompt('Trikotnummer:',p.number)||'',k=(prompt('Taste: 1–9 oder Shift+1 bis Shift+5',p.key.startsWith('S')?'Shift+'+p.key.slice(1):p.key)||p.key).toUpperCase().replace(/\s/g,'');k=k.startsWith('SHIFT+')?'S'+k.slice(6):k;if(!/^[1-9]$/.test(k)&&!/^S[1-5]$/.test(k))return alert('Ungültige Taste.');if(T().players.some(x=>x.id!==id&&x.key===k))return alert('Taste bereits vergeben.');Object.assign(p,{name:n.trim(),number:no,key:k});render()}
function rosterUI(){let t=T();return `<section class="card"><div class="row between"><div><h2>Kader · ${esc(t.name)}</h2><small>Bis zu 14 Spieler:innen, keine doppelten Tasten</small></div><button class="primary" onclick="addPlayer()">＋ Spieler</button></div>${t.players.length?`<div class="scroll"><table><tr><th>Name</th><th>Nr.</th><th>Taste</th><th></th></tr>${t.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.number||'–')}</td><td>${p.key.startsWith('S')?'Shift+'+p.key.slice(1):p.key}</td><td><button onclick="editPlayer('${p.id}')">✎</button> <button class="danger" onclick="delPlayer('${p.id}')">×</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Noch keine Spieler:innen angelegt.</div>'}<p class="hint">1–9 wählen Spieler:innen 1–9. Shift+1 bis Shift+5 wählen Spieler:innen 10–14.</p></section>`}
function delPlayer(id){if(!confirm('Spieler löschen?'))return;T().players=T().players.filter(p=>p.id!==id);T().games.forEach(g=>g.lineup=g.lineup.map(x=>x===id?null:x));render()}
function newGame(){let op=prompt('Gegner:');if(!op?.trim())return;let serve=prompt('Wer hat den ersten Aufschlag?\n1 = Wir\n2 = Gegner','1');let g={id:uid(),opponent:op.trim(),date:new Date().toISOString().slice(0,10),currentSet:1,scoreUs:0,scoreOpponent:0,sets:[],actions:[],lineup:[null,null,null,null,null,null],setFeeds:{},servingTeam:serve==='2'?'opponent':'us',finished:false};T().games.unshift(g);T().activeGame=g.id;go('live')}
function gamesUI(){let t=T();return `<section class="card"><div class="row between"><div><h2>Spiele · ${esc(t.name)}</h2><small>Neue Spiele starten oder gespeicherte Spiele öffnen.</small></div><button class="primary" onclick="newGame()">＋ Neues Spiel</button></div>${t.games.map(g=>`<div class="item"><div><b>${esc(g.opponent)}</b><br><small>${g.date} · ${g.finished?'Beendet':'Satz '+g.currentSet+' · '+g.scoreUs+':'+g.scoreOpponent}</small><br><small>Sätze: ${g.sets.map(s=>s.us+':'+s.opp).join(' · ')||'–'}</small></div><div class="row"><button onclick="T().activeGame='${g.id}';go('${g.finished?'analysis':'live'}')">Öffnen</button><button class="danger" onclick="delGame('${g.id}')">×</button></div></div>`).join('')||'<div class="empty">Noch keine Spiele.</div>'}<div class="row" style="margin-top:14px"><button onclick="exportJSON()">JSON exportieren</button><label class="pill">JSON importieren <input type="file" accept=".json" hidden onchange="importJSON(event)"></label></div></section>`}
function delGame(id){if(confirm('Spiel löschen?')){T().games=T().games.filter(g=>g.id!==id);render()}}
function pName(id){return T().players.find(x=>x.id===id)?.name||'Leer'}
function rotate(g){let l=g.lineup;g.lineup=[l[1],l[2],l[3],l[4],l[5],l[0]]}
function point(g,side){if(side==='us'){if(g.servingTeam==='opponent')rotate(g);g.scoreUs++;g.servingTeam='us'}else{g.scoreOpponent++;g.servingTeam='opponent'}}
function court(g){return [4,3,2,5,6,1].map(pos=>{let i=pos-1,id=g.lineup[i],p=T().players.find(x=>x.id===id);return `<div class="pos" draggable="${!!id}" ondragstart="dragStart(event,'${id||''}')" ondragover="event.preventDefault()" ondrop="dropPos(event,${i})" onclick="courtTap(${i})"><small>Position ${pos}</small><strong>${p?esc(p.name):'Leer'}</strong><small>${p?(p.number?'#'+esc(p.number):'Tippen/ziehen'):'Ziehen oder auswählen'}</small></div>`}).join('')}
function liveUI(){let g=G();if(!g)return `<section class="card"><h2>Kein aktives Spiel</h2><button class="primary" onclick="go('games')">Zu den Spielen</button></section>`;let a=g.actions.filter(x=>x.set===g.currentSet),s=stats(a),last=g.actions.at(-1);return `<div class="grid"><section class="card s12"><div class="row between"><div><span class="pill">Satz ${g.currentSet}</span><h2 style="margin-top:7px">${esc(g.opponent)}</h2><div class="serve">🏐 Aufschlag: ${g.servingTeam==='us'?'Wir':'Gegner'}</div></div><div class="row"><button onclick="changeServe()">Aufschlag ändern</button><button onclick="go('games')">Spiele</button></div></div><div class="scoreline"><div>Wir<div class="score">${g.scoreUs}</div></div><div>:</div><div>Gegner<div class="score">${g.scoreOpponent}</div></div></div><div class="row" style="justify-content:center"><span class="pill">Sätze ${g.sets.filter(s=>s.us>s.opp).length}:${g.sets.filter(s=>s.opp>s.opp).length}</span><button onclick="manual('us')">+1 Wir</button><button onclick="manual('opponent')">+1 Gegner</button><button onclick="undo()">↶ Rückgängig</button></div></section>
<section class="card s5"><h2>Feld · Aufstellung</h2><div class="court">${court(g)}</div><h2 style="margin-top:15px">Bank</h2><div class="bench">${T().players.filter(p=>!g.lineup.includes(p.id)).map(p=>`<button class="chip ${selPlayer===p.id?'sel':''}" draggable="true" ondragstart="dragStart(event,'${p.id}')" onclick="selectP('${p.id}')">${esc(p.name)} ${p.number?'#'+esc(p.number):''}</button>`).join('')||'<small>Keine Spieler:innen auf der Bank</small>'}</div><p class="hint">Zum Wechseln eine Spielerin/einen Spieler antippen und anschließend Feldposition antippen oder ziehen.</p></section>
<section class="card s7"><h2>Aktion erfassen</h2><small>1. Spieler:in → 2. Kategorie → 3. Ergebnis</small><div class="bench">${T().players.map(p=>`<button class="chip ${selPlayer===p.id?'sel':''}" onclick="selectP('${p.id}')">${esc(p.name)} <small>${p.key.startsWith('S')?'Shift+': ''}${p.key.startsWith('S')?p.key.slice(1):p.key}</small></button>`).join('')}</div><div class="cats">${Object.entries(cats).map(([k,v],i)=>`<button class="${selCat===k?'primary':''}" onclick="selCat='${k}';render()">${i+1} · ${v[0]}</button>`).join('')}</div>${selCat?`<div class="results" style="margin-top:9px">${cats[selCat][1].map((r,i)=>`<button onclick="record('${selCat}','${r[0]}')">${i+1} · ${r[1]}</button>`).join('')}</div>`:'<p class="hint">Kategorie auswählen, um Ergebnisse anzuzeigen.</p>'}<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h2>Gegnerfehler (0 → Nummer)</h2><div class="results">${oppErr.map((x,i)=>`<button onclick="oppPoint('${x[0]}')">0 → ${i+1} · ${x[1]}</button>`).join('')}</div></section>
<section class="card s6"><h2>Letzte Aktion</h2>${last?`<div class="last">${esc(fmt(last))}<br><small>Satz ${last.set} · Spielstand ${last.scoreUsAfter??'–'}:${last.scoreOppAfter??'–'}</small></div>`:'<div class="empty">Noch keine Aktionen.</div>'}<h2 style="margin-top:14px">Satzanalyse</h2><div class="stats">${box('Angriffserfolgsquote',s.attackN?Math.round(s.attackK/s.attackN*100)+'%':'–',s.attackK+' Punkte / '+s.attackN+' Angriffe')}${box('Annahme positiv',s.recN?Math.round(s.recP/s.recN*100)+'%':'–',s.recP+' / '+s.recN)}${box('Abwehr erfolgreich',s.defN?Math.round(s.defS/s.defN*100)+'%':'–',s.defS+' / '+s.defN)}</div></section>
<section class="card s6"><h2>Zuspielverteilung · Satz ${g.currentSet}</h2>${feedUI(g)}</section><section class="card s12"><div class="row between"><h2>Satzsteuerung</h2><div class="row"><button onclick="finishSet()">Satz beenden</button><button class="primary" onclick="finishGame()">Spiel beenden</button></div></div></section></div>`}
function box(a,b,c){return `<div class="stat"><small>${a}</small><b>${b}</b><small>${c}</small></div>`}
function selectP(id){selPlayer=selPlayer===id?null:id;render()}
function courtTap(i){let g=G();if(!g)return;if(selPlayer){let from=g.lineup.indexOf(selPlayer);if(from>=0)[g.lineup[from],g.lineup[i]]=[g.lineup[i],g.lineup[from]];else g.lineup[i]=selPlayer;selPlayer=null;save();render()}else if(g.lineup[i]){selPlayer=g.lineup[i];render()}}
function dragStart(e,id){drag=id;e.dataTransfer?.setData('text/plain',id)}
function dropPos(e,i){e.preventDefault();let id=e.dataTransfer?.getData('text/plain')||drag;if(!id)return;let g=G(),from=g.lineup.indexOf(id);if(from>=0)[g.lineup[from],g.lineup[i]]=[g.lineup[i],g.lineup[from]];else g.lineup[i]=id;drag=null;selPlayer=null;save();render()}
function record(c,r){let g=G();if(!selPlayer)return alert('Bitte zuerst Spieler:in auswählen.');let p=T().players.find(x=>x.id===selPlayer);if(!p)return;let a={id:uid(),set:g.currentSet,category:c,result:r,playerId:p.id,playerName:p.name,servingBefore:g.servingTeam,lineupBefore:[...g.lineup]};if((c==='attack'&&r==='kill')||(c==='serve'&&r==='ace')||(c==='block'&&r==='point'))point(g,'us');else if((c==='attack'&&['error','blocked'].includes(r))||(c==='serve'&&r==='error')||(c==='reception'&&r==='error')||(c==='block'&&r==='error')||(c==='defense'&&r==='error'))point(g,'opponent');pushAction(g,a);selCat=null;selPlayer=null;save();render()}
function pushAction(g,a){a.lineupAfter=[...g.lineup];a.servingAfter=g.servingTeam;a.scoreUsAfter=g.scoreUs;a.scoreOppAfter=g.scoreOpponent;g.actions.push(a)}
function oppPoint(k){let g=G(),x=oppErr.find(x=>x[0]===k),a={id:uid(),set:g.currentSet,category:'opponentError',result:k,label:x[1],playerName:'Gegner',servingBefore:g.servingTeam,lineupBefore:[...g.lineup]};point(g,'us');pushAction(g,a);save();render()}
function manual(side){let g=G(),a={id:uid(),set:g.currentSet,category:'manual',result:side,label:side==='us'?'Manueller Punkt für uns':'Manueller Punkt für Gegner',playerName:'Manuell',servingBefore:g.servingTeam,lineupBefore:[...g.lineup]};point(g,side);pushAction(g,a);save();render()}
function undo(){let g=G();if(!g?.actions.length)return;let a=g.actions.pop();if(a.servingBefore)g.servingTeam=a.servingBefore;if(a.lineupBefore)g.lineup=[...a.lineupBefore];let as=g.actions.filter(x=>x.set===g.currentSet);g.scoreUs=as.filter(x=>x.scoreUsAfter!=null).at(-1)?.scoreUsAfter||0;g.scoreOpponent=as.filter(x=>x.scoreOppAfter!=null).at(-1)?.scoreOppAfter||0;save();render()}
function changeServe(){let g=G(),a=prompt('Wer hat jetzt Aufschlag?\n1 = Wir\n2 = Gegner',g.servingTeam==='us'?'1':'2');if(a==='1'||a==='2'){g.servingTeam=a==='1'?'us':'opponent';save();render()}}
function finishSet(){let g=G();if(!confirm(`Satz ${g.currentSet} speichern: ${g.scoreUs}:${g.scoreOpponent}?`))return;g.sets.push({number:g.currentSet,us:g.scoreUs,opp:g.scoreOpponent,actions:g.actions.filter(a=>a.set===g.currentSet),feed:{...(g.setFeeds[g.currentSet]||{})}});g.currentSet++;g.scoreUs=g.scoreOpponent=0;let a=prompt('Wer hat im neuen Satz den ersten Aufschlag?\n1 = Wir\n2 = Gegner',g.servingTeam==='us'?'1':'2');if(a==='1'||a==='2')g.servingTeam=a==='1'?'us':'opponent';selPlayer=selCat=null;save();render()}
function finishGame(){let g=G();if(!confirm('Spiel beenden und aktuellen Satz speichern?'))return;if(g.scoreUs||g.scoreOpponent||!g.sets.length)g.sets.push({number:g.currentSet,us:g.scoreUs,opp:g.scoreOpponent,actions:g.actions.filter(a=>a.set===g.currentSet),feed:{...(g.setFeeds[g.currentSet]||{})}});g.finished=true;save();go('analysis')}
function feedUI(g){let f=g.setFeeds[g.currentSet]||(g.setFeeds[g.currentSet]={outside:0,middle:0,opposite:0,pipe:0,other:0}),fields=[['outside','Außen'],['middle','Mitte'],['opposite','Diagonal'],['pipe','Hinterfeld'],['other','Sonstige']];return `<div class="scroll"><table><tr><th>Angriffszone</th><th>Anzahl</th></tr>${fields.map(([k,n])=>`<tr><td>${n}</td><td><input type="number" min="0" value="${f[k]||0}" style="width:80px" onchange="setFeed('${g.id}',${g.currentSet},'${k}',this.value)"></td></tr>`).join('')}</table></div><small>Gesamt: ${fields.reduce((n,[k])=>n+Number(f[k]||0),0)} Zuspiele</small>`}
function setFeed(id,no,k,v){let g=T().games.find(x=>x.id===id);g.setFeeds[no]??={};g.setFeeds[no][k]=Math.max(0,Number(v)||0);save();render()}
function stats(a){let s={attackK:0,attackN:0,recP:0,recN:0,defS:0,defN:0,aces:0,serveN:0,serveE:0,blockP:0,blockN:0};a.forEach(x=>{if(x.category==='attack'){s.attackN++;if(x.result==='kill')s.attackK++}if(x.category==='reception'){s.recN++;if(x.result==='positive')s.recP++}if(x.category==='defense'){s.defN++;if(x.result==='successful')s.defS++}if(x.category==='serve'){s.serveN++;if(x.result==='ace')s.aces++;if(x.result==='error')s.serveE++}if(x.category==='block'){s.blockN++;if(x.result==='point')s.blockP++}});return s}
function fmt(a){if(a.category==='opponentError')return 'Gegnerfehler: '+a.label;if(a.category==='manual')return a.label;let c=cats[a.category];return `${a.playerName} · ${c[0]}: ${c[1].find(x=>x[0]===a.result)?.[1]||a.result}`}
function analysisUI(){let t=T(),games=t.games;if(!games.length)return '<section class="card"><h2>Analyse</h2><div class="empty">Noch keine Spiele vorhanden.</div></section>';let id=window.aid||G()?.id||games[0].id,g=games.find(x=>x.id===id)||games[0];window.aid=g.id;let sets=g.sets.map(s=>({number:s.number,us:s.us,opp:s.opp,actions:s.actions||g.actions.filter(a=>a.set===s.number),feed:s.feed||g.setFeeds[s.number]||{}}));if(!g.finished)sets.push({number:g.currentSet,us:g.scoreUs,opp:g.scoreOpponent,actions:g.actions.filter(a=>a.set===g.currentSet),feed:g.setFeeds[g.currentSet]||{}});let all=sets.flatMap(s=>s.actions),s=stats(all);return `<section class="card"><div class="row between"><h2>Analyse · ${esc(t.name)}</h2><select onchange="window.aid=this.value;render()">${games.map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.opponent)} · ${x.date}</option>`).join('')}</select></div><h2>${esc(g.opponent)}</h2><div class="row">${sets.map(x=>`<span class="pill">Satz ${x.number}: ${x.us}:${x.opp}</span>`).join('')}</div></section><section class="card"><h2>Gesamtstatistik</h2><div class="stats">${box('Angriffserfolgsquote',s.attackN?Math.round(s.attackK/s.attackN*100)+'%':'–',s.attackK+' Punkte / '+s.attackN+' Angriffe')}${box('Annahme positiv',s.recN?Math.round(s.recP/s.recN*100)+'%':'–',s.recP+' / '+s.recN)}${box('Aufschlag-Ass',s.aces,s.serveN+' Aufschläge')}${box('Aufschlagfehler',s.serveE,'')}${box('Blockpunkte',s.blockP,s.blockN+' Blockaktionen')}${box('Abwehr erfolgreich',s.defN?Math.round(s.defS/s.defN*100)+'%':'–',s.defS+' / '+s.defN)}</div></section><section class="card"><h2>Spieler:innen</h2><div class="scroll"><table><tr><th>Name</th><th>Angriff Pkt./Vers.</th><th>Quote</th><th>Annahme +/Ges.</th><th>Ass/Service</th><th>Block Pkt./Aktion</th><th>Abwehr +/Ges.</th></tr>${t.players.map(p=>{let z=stats(all.filter(x=>x.playerId===p.id));return `<tr><td>${esc(p.name)}</td><td>${z.attackK}/${z.attackN}</td><td>${z.attackN?Math.round(z.attackK/z.attackN*100)+'%':'–'}</td><td>${z.recP}/${z.recN}</td><td>${z.aces}/${z.serveN}</td><td>${z.blockP}/${z.blockN}</td><td>${z.defS}/${z.defN}</td></tr>`}).join('')}</table></div></section><section class="card"><h2>Zuspielverteilung pro Satz</h2>${sets.map(x=>{let f=x.feed||{},fields=[['Außen','outside'],['Mitte','middle'],['Diagonal','opposite'],['Hinterfeld','pipe'],['Sonstige','other']],n=fields.reduce((a,[,k])=>a+Number(f[k]||0),0);return `<p><b>Satz ${x.number}</b> · ${n} Zuspiele<br>${fields.map(([l,k])=>`${l}: ${f[k]||0} (${n?Math.round((f[k]||0)/n*100):0}%)`).join(' · ')}</p>`}).join('')}</section><section class="card"><h2>Aktionen</h2><div class="scroll"><table><tr><th>Satz</th><th>Aktion</th><th>Spielstand danach</th></tr>${g.actions.slice().reverse().map(a=>`<tr><td>${a.set}</td><td>${esc(fmt(a))}</td><td>${a.scoreUsAfter??'–'}:${a.scoreOppAfter??'–'}</td></tr>`).join('')}</table></div></section>`}
function exportJSON(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='volleystats-backup.json';a.click();URL.revokeObjectURL(u)}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.teams)throw 0;if(confirm('Import ersetzt aktuelle Daten. Fortfahren?')){db=x;db.teamId??=db.teams[0].id;save();render()}}catch{alert('Import fehlgeschlagen.')}};r.readAsText(f)}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||page!=='live'||!G())return;if(e.key==='Escape'){selPlayer=selCat=null;render();return}if(e.key==='0'){let n=prompt('Gegnerfehler:\n1 Aufschlag aus\n2 Aufschlag Netz\n3 Angriff aus\n4 Angriff Netz\n5 Netz/Rotation\n6 Sonstiger Fehler');if(+n>=1&&+n<=6)oppPoint(oppErr[+n-1][0]);return}if(!selPlayer){let k=e.shiftKey?'S'+e.key:e.key,p=T().players.find(x=>x.key===k);if(p){e.preventDefault();selPlayer=p.id;render()}return}if(!selCat){let k=Object.keys(cats)[+e.key-1];if(k){e.preventDefault();selCat=k;render()}return}let r=cats[selCat][1][+e.key-1];if(r){e.preventDefault();record(selCat,r[0])}});
render();
</script></body></html>
