<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VolleyStats</title>

<style>
:root{
  --bg:#0b1220;
  --card:#131e30;
  --card2:#1b2940;
  --line:#2a3a54;
  --text:#f5f7fb;
  --muted:#9baac0;
  --accent:#b7f34a;
  --danger:#ff7373;
  --green:#4ed58a;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(135deg,#0b1220,#111d30);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  border:1px solid var(--line);
  background:var(--card2);
  color:var(--text);
  padding:11px 14px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.12);
}

button.primary{
  background:var(--accent);
  color:#17210a;
  border-color:var(--accent);
}

button.danger{
  color:#ffb0b0;
  border-color:#713d49;
}

button.small{
  padding:7px 10px;
  font-size:.86rem;
}

.app{
  max-width:1200px;
  margin:auto;
  padding:18px 16px 80px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:45px;
  height:45px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:var(--accent);
  color:#17210a;
  font-size:24px;
  font-weight:900;
}

.brand h1{
  margin:0;
}

.brand p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:.85rem;
}

select,
input{
  background:#0c1525;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
}

.team-select{
  min-width:150px;
}

.row{
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap;
}

.between{
  justify-content:space-between;
}

.nav{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:20px 0;
}

.nav button.active{
  background:var(--accent);
  color:#17210a;
  border-color:var(--accent);
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.page-title h2{
  margin:0;
}

.muted,
.note{
  color:var(--muted);
}

.note{
  font-size:.82rem;
  line-height:1.5;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.card{
  background:rgba(19,30,48,.97);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
}

.card h3{
  margin:0 0 12px;
}

.empty{
  padding:25px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:14px;
}

.game-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:99px;
  background:#26364d;
  font-size:.78rem;
}

.scoreboard{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  text-align:center;
  align-items:center;
  gap:12px;
}

.score{
  font-size:clamp(2.8rem,8vw,4.5rem);
  font-weight:900;
}

.score-label{
  color:var(--muted);
}

.sets-line{
  text-align:center;
  color:var(--muted);
  margin-top:7px;
}

.serve-line{
  text-align:center;
  color:var(--accent);
  font-weight:800;
  margin-top:10px;
}

.live-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:14px;
}

.stack{
  display:grid;
  gap:14px;
}

.court{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,100px);
  gap:8px;
  padding:10px;
  border-radius:16px;
  background:linear-gradient(140deg,#27654f,#1d493e);
  border:2px solid #83c49d;
}

.pos{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  border-radius:12px;
  background:rgba(8,25,24,.7);
  border:1px solid rgba(255,255,255,.3);
  cursor:pointer;
  min-width:0;
}

.pos strong{
  font-size:1rem;
}

.pos small{
  opacity:.8;
}

.pos.selected{
  outline:3px solid var(--accent);
}

.pos.dragover{
  outline:3px solid white;
}

.bench{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.bench-player{
  background:#0c1525;
}

.bench-player.selected{
  outline:2px solid var(--accent);
}

.category-grid,
.result-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.category-grid button,
.result-grid button{
  min-height:50px;
  text-align:left;
}

.category-grid button.chosen{
  background:var(--accent);
  color:#17210a;
}

.result-grid button.good{
  border-color:#557a30;
}

.result-grid button.bad{
  border-color:#75404b;
}

.last-action{
  padding:11px 13px;
  border-left:4px solid var(--accent);
  background:#0d1828;
  border-radius:0 10px 10px 0;
}

.actions-list{
  display:grid;
  gap:7px;
  max-height:230px;
  overflow:auto;
  margin-top:10px;
}

.action-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 10px;
  background:#0c1525;
  border-radius:10px;
  font-size:.88rem;
}

.action-item small{
  color:var(--muted);
}

.metric-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}

.metric{
  background:#0c1525;
  border-radius:12px;
  padding:12px;
}

.metric strong{
  display:block;
  font-size:1.45rem;
}

.metric span{
  color:var(--muted);
  font-size:.78rem;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:10px 9px;
  text-align:left;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}

th{
  color:var(--muted);
}

.section-gap{
  margin-top:14px;
}

.inline-input{
  width:80px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:var(--accent);
  color:#17210a;
  padding:11px 16px;
  border-radius:12px;
  font-weight:800;
  display:none;
  z-index:100;
}

@media(max-width:780px){

  .grid,
  .live-grid{
    grid-template-columns:1fr;
  }

  .metric-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .court{
    grid-template-rows:repeat(2,85px);
  }

}

</style>
</head>

<body>

<div class="app">

<header class="top">

  <div class="brand">

    <div class="logo">V</div>

    <div>
      <h1>VolleyStats</h1>
      <p>Live-Scouting · Spielanalyse · Saison</p>
    </div>

  </div>

  <div class="row">

    <select
      id="teamSelect"
      class="team-select"
    ></select>

    <button
      class="small"
      onclick="addTeam()"
    >
      + Team
    </button>

  </div>

</header>

<nav
  class="nav"
  id="nav"
></nav>

<main id="view"></main>

</div>

<div
  id="toast"
  class="toast"
></div>


<script>

/* =========================================================
   GRUNDKONFIGURATION
========================================================= */

const STORAGE_KEY="volleystats_final_v1";


const CATEGORIES=[
  ["attack","Angriff"],
  ["reception","Annahme"],
  ["serve","Aufschlag"],
  ["block","Block"],
  ["defense","Abwehr"]
];


const ACTIONS={

  attack:[
    ["Punkt","kill"],
    ["Spielbar","playable"],
    ["Fehler","error"],
    ["Geblockt","blocked"]
  ],

  reception:[
    ["Positiv","positive"],
    ["Spielbar","playable"],
    ["Fehler","error"]
  ],

  serve:[
    ["Ass","ace"],
    ["Druckvoll","pressure"],
    ["Normal","normal"],
    ["Fehler","error"]
  ],

  block:[
    ["Punktblock","point"],
    ["Touch","touch"],
    ["Fehler","error"]
  ],

  defense:[
    ["Erfolgreich","successful"],
    ["Spielbar","playable"],
    ["Fehler","error"]
  ]

};


const OPPONENT_ERRORS=[

  ["serveOut","Aufschlag ins Aus"],
  ["serveNet","Aufschlag ins Netz"],
  ["attackOut","Angriff ins Aus"],
  ["attackNet","Angriff ins Netz"],
  ["netRotation","Netz / Rotation"],
  ["other","Sonstiger Fehler"]

];


const FEED_OPTIONS=[
  "Außen",
  "Mitte",
  "Diagonal",
  "Hinterfeld",
  "Pipe",
  "Sonstige"
];


/* =========================================================
   APP STATE
========================================================= */

let db=loadDatabase();

let page="Spiele";
let gameId=null;

let selectedPlayer=null;
let selectedCategory=null;


/* =========================================================
   DATABASE
========================================================= */

function uid(){

  return Math.random()
    .toString(36)
    .slice(2,10);

}


function loadDatabase(){

  try{

    const saved=
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      );

    if(
      saved &&
      Array.isArray(saved.teams)
    ){

      saved.teams.forEach(team=>{

        team.players ??=[];
        team.games ??=[];

        team.games.forEach(game=>{

          game.servingTeam ??="us";

          game.lineup ??=[
            null,
            null,
            null,
            null,
            null,
            null
          ];

          game.actions ??=[];
          game.substitutions ??=[];
          game.sets ??=[];
          game.setFeeds ??={};

          game.currentSet ??=1;

          game.scoreUs ??=0;
          game.scoreOpponent ??=0;

          game.finished ??=false;

        });

      });


      if(
        !saved.currentTeam ||
        !saved.teams.some(
          team=>team.id===saved.currentTeam
        )
      ){

        saved.currentTeam=
          saved.teams[0]?.id;

      }


      return saved;

    }

  }catch(error){

    console.log(error);

  }


  return{

    currentTeam:"team1",

    teams:[

      {
        id:"team1",
        name:"Damen",
        players:[],
        games:[]
      },

      {
        id:"team2",
        name:"Herren",
        players:[],
        games:[]
      }

    ]

  };

}


function saveDatabase(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(db)
  );

}


function currentTeam(){

  return db.teams.find(
    team=>team.id===db.currentTeam
  ) || db.teams[0];

}


function currentGame(){

  return currentTeam()
    ?.games
    .find(
      game=>game.id===gameId
    );

}


/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[char])
    );

}


function toast(message){

  const element=
    document.getElementById("toast");

  element.textContent=message;
  element.style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=
    setTimeout(()=>{
      element.style.display="none";
    },2200);

}


function percent(a,b){

  if(!b) return 0;

  return Math.round(
    a/b*100
  );

}


function keyText(key){

  if(key>=10){

    return "Shift+"+(key-9);

  }

  return String(key);

}


/* =========================================================
   NAVIGATION
========================================================= */

function renderNavigation(){

  const items=[
    ["Spiele","🏐"],
    ["Live","🎯"],
    ["Kader","👥"],
    ["Analyse","📊"]
  ];


  document.getElementById("nav").innerHTML=

    items.map(
      ([name,icon])=>`

        <button
          class="${
            page===name
              ?"active"
              :""
          }"
          onclick="goTo('${name}')"
        >
          ${icon} ${name}
        </button>

      `
    ).join("");

}


function goTo(newPage){

  page=newPage;

  render();

}


/* =========================================================
   HAUPT-RENDER
========================================================= */

function render(){

  renderNavigation();


  const teamSelect=
    document.getElementById("teamSelect");


  teamSelect.innerHTML=
    db.teams.map(
      team=>`

        <option
          value="${team.id}"
          ${
            team.id===db.currentTeam
              ?"selected"
              :""
          }
        >
          ${esc(team.name)}
        </option>

      `
    ).join("");


  teamSelect.onchange=
    event=>{

      db.currentTeam=
        event.target.value;

      gameId=null;
      selectedPlayer=null;
      selectedCategory=null;

      saveDatabase();
      render();

    };


  const view=
    document.getElementById("view");


  if(page==="Spiele"){

    view.innerHTML=
      renderGames();

  }

  else if(page==="Live"){

    view.innerHTML=
      renderLive();

  }

  else if(page==="Kader"){

    view.innerHTML=
      renderRoster();

  }

  else{

    view.innerHTML=
      renderAnalysis();

  }

}


/* =========================================================
   TEAMS
========================================================= */

function addTeam(){

  const name=
    prompt(
      "Name des Teams:"
    );

  if(!name?.trim()) return;


  const team={

    id:uid(),
    name:name.trim(),
    players:[],
    games:[]

  };


  db.teams.push(team);

  db.currentTeam=
    team.id;

  saveDatabase();
  render();

}


/* =========================================================
   SPIELE
========================================================= */

function createGame(){

  const opponent=
    prompt("Gegner:");

  if(!opponent?.trim()) return;


  const firstServe=
    prompt(
      "Wer hat den ersten Aufschlag?\n\n"+
      "1 = Wir\n"+
      "2 = Gegner",
      "1"
    );


  const servingTeam=
    firstServe==="2"
      ?"opponent"
      :"us";


  const game={

    id:uid(),

    opponent:
      opponent.trim(),

    date:
      new Date()
        .toISOString()
        .slice(0,10),

    currentSet:1,

    scoreUs:0,
    scoreOpponent:0,

    sets:[],

    actions:[],

    substitutions:[],

    lineup:[
      null,
      null,
      null,
      null,
      null,
      null
    ],

    setFeeds:{},

    servingTeam,

    finished:false

  };


  const players=
    currentTeam()
      .players
      .slice()
      .sort(
        (a,b)=>a.number-b.number
      );


  game.lineup=
    players
      .slice(0,6)
      .map(
        player=>player.id
      );


  while(
    game.lineup.length<6
  ){

    game.lineup.push(null);

  }


  currentTeam()
    .games
    .unshift(game);


  gameId=game.id;

  selectedPlayer=null;
  selectedCategory=null;

  saveDatabase();

  page="Live";

  render();

  toast("Spiel erstellt");

}


function openGame(id){

  gameId=id;

  page=
    currentGame()?.finished
      ?"Analyse"
      :"Live";

  selectedPlayer=null;
  selectedCategory=null;

  render();

}


function deleteGame(id){

  if(
    !confirm(
      "Dieses Spiel wirklich löschen?"
    )
  ){

    return;

  }


  currentTeam().games=
    currentTeam().games.filter(
      game=>game.id!==id
    );


  if(gameId===id){

    gameId=null;

  }


  saveDatabase();
  render();

}


/* =========================================================
   SPIELE-SEITE
========================================================= */

function renderGames(){

  const team=
    currentTeam();


  return `

    <div class="page-title">

      <div>

        <h2>Spiele</h2>

        <div class="muted">
          ${esc(team.name)}
          ·
          ${team.games.length}
          Spiele
        </div>

      </div>


      <button
        class="primary"
        onclick="createGame()"
      >
        ＋ Neues Spiel
      </button>

    </div>


    <div class="grid">

      <section class="card">

        <h3>Deine Spiele</h3>


        ${
          team.games.length

          ?

          team.games.map(
            game=>`

              <div class="game-card">

                <div>

                  <strong>
                    ${esc(game.opponent)}
                  </strong>

                  <div class="muted">
                    ${esc(game.date)}
                    ·
                    ${
                      game.finished
                        ?"Beendet"
                        :"Satz "+game.currentSet
                    }
                  </div>

                  <div class="note">

                    Sätze:
                    ${getSetScore(game)}

                    ·

                    Stand:
                    ${game.scoreUs}:${game.scoreOpponent}

                  </div>

                </div>


                <div class="row">

                  <button
                    class="small primary"
                    onclick="openGame('${game.id}')"
                  >
                    ${
                      game.finished
                        ?"Analyse"
                        :"Öffnen"
                    }
                  </button>


                  <button
                    class="small danger"
                    onclick="deleteGame('${game.id}')"
                  >
                    ✕
                  </button>

                </div>

              </div>

            `
          ).join("")

          :

          `
            <div class="empty">
              Noch keine Spiele.
              Lege dein erstes Spiel an.
            </div>
          `

        }

      </section>


      <section class="card">

        <h3>Import / Export</h3>

        <p class="note">
          Sichere deine Daten als JSON-Datei.
        </p>


        <div class="row">

          <button
            onclick="exportDatabase()"
          >
            Daten exportieren
          </button>


          <button
            onclick="
              document
                .getElementById('importFile')
                .click()
            "
          >
            Daten importieren
          </button>


          <input
            id="importFile"
            type="file"
            accept=".json,application/json"
            style="display:none"
            onchange="importDatabase(event)"
          >

        </div>

      </section>

    </div>

  `;

}


/* =========================================================
   KADER
========================================================= */

function renderRoster(){

  const team=
    currentTeam();


  return `

    <div class="page-title">

      <div>

        <h2>Kader</h2>

        <div class="muted">
          Spielerinnen und Scouting-Tasten
        </div>

      </div>


      <button
        class="primary"
        onclick="openPlayerForm()"
      >
        ＋ Spieler hinzufügen
      </button>

    </div>


    <section class="card">

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>Nr.</th>
              <th>Name</th>
              <th>Position</th>
              <th>Scouting-Taste</th>
              <th></th>

            </tr>

          </thead>


          <tbody>

            ${
              team.players
                .slice()
                .sort(
                  (a,b)=>
                    a.number-b.number
                )
                .map(
                  player=>`

                    <tr>

                      <td>
                        ${player.number}
                      </td>

                      <td>
                        <strong>
                          ${esc(player.name)}
                        </strong>
                      </td>

                      <td>
                        ${esc(
                          player.position || "—"
                        )}
                      </td>

                      <td>
                        <span class="pill">
                          ${keyText(
                            player.scoutingKey
                          )}
                        </span>
                      </td>

                      <td>

                        <div class="row">

                          <button
                            class="small"
                            onclick="
                              editPlayer(
                                '${player.id}'
                              )
                            "
                          >
                            Bearbeiten
                          </button>


                          <button
                            class="small danger"
                            onclick="
                              deletePlayer(
                                '${player.id}'
                              )
                            "
                          >
                            Löschen
                          </button>

                        </div>

                      </td>

                    </tr>

                  `
                )
                .join("")
            }

          </tbody>

        </table>

      </div>


      ${
        !team.players.length
          ?
          `
            <div class="empty">
              Noch kein Kader angelegt.
            </div>
          `
          :""
      }


      <p class="note">

        <b>1–9</b>
        = Spielerinnen 1–9

        ·

        <b>Shift+1–5</b>
        = Spielerinnen 10–14.

        Jede Taste darf nur einmal vergeben werden.

      </p>

    </section>

  `;

}


function editPlayer(id){

  const player=
    currentTeam()
      .players
      .find(
        player=>player.id===id
      );

  openPlayerForm(player);

}


function openPlayerForm(player=null){

  const numberInput=
    prompt(
      "Trikotnummer:",
      player?.number ??
      currentTeam().players.length+1
    );


  if(numberInput===null) return;


  const number=
    Number(numberInput);


  if(
    !Number.isInteger(number) ||
    number<1 ||
    number>99
  ){

    alert(
      "Bitte eine gültige Trikotnummer eingeben."
    );

    return;

  }


  const name=
    prompt(
      "Name:",
      player?.name ?? ""
    );


  if(!name?.trim()) return;


  const position=
    prompt(
      "Position:",
      player?.position ?? ""
    ) ?? "";


  const keyInput=
    prompt(
      "Scouting-Taste:\n\n"+
      "1–9 = Spielerin 1–9\n"+
      "10–14 = Shift+1–5",
      String(
        player?.scoutingKey ??
        Math.min(
          14,
          currentTeam().players.length+1
        )
      )
    );


  if(keyInput===null) return;


  const scoutingKey=
    Number(keyInput);


  if(
    !Number.isInteger(scoutingKey) ||
    scoutingKey<1 ||
    scoutingKey>14
  ){

    alert(
      "Die Scouting-Taste muss zwischen 1 und 14 liegen."
    );

    return;

  }


  const duplicate=
    currentTeam()
      .players
      .some(
        existing=>
          existing.id!==player?.id &&
          existing.scoutingKey===
            scoutingKey
      );


  if(duplicate){

    alert(
      "Diese Scouting-Taste ist bereits vergeben."
    );

    return;

  }


  const data={

    id:
      player?.id || uid(),

    number,

    name:
      name.trim(),

    position:
      position.trim(),

    scoutingKey

  };


  if(player){

    Object.assign(
      player,
      data
    );

  }else{

    currentTeam()
      .players
      .push(data);

  }


  saveDatabase();
  render();

}


function deletePlayer(id){

  if(
    !confirm(
      "Spielerin wirklich löschen?"
    )
  ){

    return;

  }


  currentTeam().players=
    currentTeam()
      .players
      .filter(
        player=>player.id!==id
      );


  currentTeam().games.forEach(
    game=>{

      game.lineup=
        game.lineup.map(
          playerId=>
            playerId===id
              ?null
              :playerId
        );

    }
  );


  saveDatabase();
  render();

}

/* =========================================================
   SPIELER AUSWÄHLEN
========================================================= */

function selectCourtPosition(position){

  const game=
    currentGame();


  if(!game) return;


  const playerId=
    game.lineup[position];


  if(!playerId){

    toast(
      "Diese Position ist frei."
    );

    return;

  }


  if(
    selectedPlayer &&
    selectedPlayer!==playerId
  ){

    swapPlayers(
      selectedPlayer,
      playerId
    );

    return;

  }


  selectedPlayer=
    playerId;

  selectedCategory=null;

  render();

}


function selectBenchPlayer(id){

  if(
    selectedPlayer &&
    selectedPlayer!==id
  ){

    swapPlayers(
      selectedPlayer,
      id
    );

    return;

  }


  selectedPlayer=id;
  selectedCategory=null;

  render();

}


function clearSelection(){

  selectedPlayer=null;
  selectedCategory=null;

  render();

}


function chooseCategory(category){

  if(!selectedPlayer){

    toast(
      "Bitte zuerst eine Spielerin auswählen."
    );

    return;

  }


  selectedCategory=
    category;

  render();

}


/* =========================================================
   DRAG & DROP
========================================================= */

function dragCourt(event,position){

  event.dataTransfer.setData(
    "text/plain",
    JSON.stringify({
      type:"court",
      position
    })
  );

}


function dragBench(event,playerId){

  event.dataTransfer.setData(
    "text/plain",
    JSON.stringify({
      type:"bench",
      playerId
    })
  );

}


function dropCourt(event,targetPosition){

  event.preventDefault();


  event.currentTarget
    .classList
    .remove("dragover");


  let data;


  try{

    data=
      JSON.parse(
        event.dataTransfer
          .getData("text/plain")
      );

  }catch{

    return;

  }


  if(data.type==="court"){

    swapPositions(
      data.position,
      targetPosition
    );

  }

  else if(
    data.type==="bench"
  ){

    substitutePlayer(
      data.playerId,
      targetPosition
    );

  }

}


/* =========================================================
   WECHSEL
========================================================= */

function swapPlayers(
  playerA,
  playerB
){

  const game=
    currentGame();


  if(!game) return;


  const indexA=
    game.lineup.indexOf(
      playerA
    );

  const indexB=
    game.lineup.indexOf(
      playerB
    );


  if(
    indexA>=0 &&
    indexB>=0
  ){

    [
      game.lineup[indexA],
      game.lineup[indexB]
    ]=[
      game.lineup[indexB],
      game.lineup[indexA]
    ];

  }

  else if(
    indexA>=0 &&
    indexB<0
  ){

    game.lineup[indexA]=
      playerB;

  }

  else if(
    indexA<0 &&
    indexB>=0
  ){

    game.lineup[indexB]=
      playerA;

  }


  game.substitutions.push({

    set:game.currentSet,

    playerA,
    playerB,

    time:Date.now()

  });


  selectedPlayer=playerB;

  saveDatabase();
  render();

}


function swapPositions(
  positionA,
  positionB
){

  const game=
    currentGame();


  if(
    !game ||
    positionA===positionB
  ){

    return;

  }


  [
    game.lineup[positionA],
    game.lineup[positionB]
  ]=[
    game.lineup[positionB],
    game.lineup[positionA]
  ];


  game.substitutions.push({

    set:game.currentSet,

    positionA,
    positionB,

    time:Date.now()

  });


  saveDatabase();
  render();

}


function substitutePlayer(
  playerId,
  position
){

  const game=
    currentGame();


  if(!game) return;


  const oldPlayer=
    game.lineup[position];


  game.lineup[position]=
    playerId;


  game.substitutions.push({

    set:game.currentSet,

    incoming:playerId,
    outgoing:oldPlayer,
    position,

    time:Date.now()

  });


  selectedPlayer=
    playerId;


  saveDatabase();
  render();

  toast("Wechsel gespeichert");

}


/* =========================================================
   ROTATION
========================================================= */

/*

  Volleyball-Rotation:

  Wenn WIR Aufschlag haben:

    WIR gewinnen:
      Punkt für uns
      KEINE Rotation

    WIR verlieren:
      Punkt Gegner
      Aufschlag geht an Gegner
      KEINE Rotation


  Wenn DER GEGNER Aufschlag hat:

    WIR gewinnen:
      Punkt für uns
      Rotation
      Aufschlag geht an uns

    GEGNER gewinnt:
      Punkt Gegner
      KEINE Rotation

*/


function rotateTeam(game){

  const old=[
    ...game.lineup
  ];


  /*
    Positionen:

    1 → 6
    6 → 5
    5 → 4
    4 → 3
    3 → 2
    2 → 1

    Im Array:
    [Pos1,Pos2,Pos3,Pos4,Pos5,Pos6]
  */


  game.lineup=[

    old[1],
    old[2],
    old[3],
    old[4],
    old[5],
    old[0]

  ];

}


/* =========================================================
   PUNKTLOGIK
========================================================= */

function applyPoint(
  game,
  pointFor
){

  const servingBefore=
    game.servingTeam;


  const lineupBefore=[
    ...game.lineup
  ];


  if(pointFor==="us"){

    game.scoreUs++;


    /*
      Gegner hatte Aufschlag:
      Side-out → Rotation.
    */

    if(
      servingBefore==="opponent"
    ){

      rotateTeam(game);

    }


    /*
      Nach unserem Punkt
      haben wir Aufschlag.
    */

    game.servingTeam="us";

  }

  else{

    game.scoreOpponent++;


    /*
      Gegner gewinnt den Ball.
      Egal wer vorher serviert hat:
      Gegner hat danach Aufschlag.

      KEINE Rotation.
    */

    game.servingTeam="opponent";

  }


  return{

    servingBefore,

    lineupBefore,

    servingAfter:
      game.servingTeam,

    lineupAfter:[
      ...game.lineup
    ]

  };

}


/* =========================================================
   AKTION AUFNEHMEN
========================================================= */

function recordAction(
  category,
  result
){

  const game=
    currentGame();


  if(!game) return;


  if(!selectedPlayer){

    toast(
      "Bitte zuerst eine Spielerin auswählen."
    );

    return;

  }


  const player=
    currentTeam()
      .players
      .find(
        p=>p.id===selectedPlayer
      );


  if(!player){

    toast(
      "Spielerin nicht gefunden."
    );

    return;

  }


  let pointFor=null;


  /*
    ANGRIFF
  */

  if(
    category==="attack" &&
    result==="kill"
  ){

    pointFor="us";

  }


  if(
    category==="attack" &&
    (
      result==="error" ||
      result==="blocked"
    )
  ){

    pointFor="opponent";

  }


  /*
    ANNAHME
  */

  if(
    category==="reception" &&
    result==="error"
  ){

    pointFor="opponent";

  }


  /*
    AUFSCHLAG
  */

  if(
    category==="serve" &&
    result==="ace"
  ){

    pointFor="us";

  }


  if(
    category==="serve" &&
    result==="error"
  ){

    pointFor="opponent";

  }


  /*
    BLOCK
  */

  if(
    category==="block" &&
    result==="point"
  ){

    pointFor="us";

  }


  if(
    category==="block" &&
    result==="error"
  ){

    pointFor="opponent";

  }


  /*
    ABWEHR
  */

  if(
    category==="defense" &&
    result==="error"
  ){

    pointFor="opponent";

  }


  const before={

    scoreUs:
      game.scoreUs,

    scoreOpponent:
      game.scoreOpponent,

    servingTeam:
      game.servingTeam,

    lineup:[
      ...game.lineup
    ]

  };


  if(pointFor){

    applyPoint(
      game,
      pointFor
    );

  }


  const action={

    id:uid(),

    set:
      game.currentSet,

    category,

    result,

    playerId:
      player.id,

    playerName:
      player.name,

    pointFor,

    scoreAfter:
      `${game.scoreUs}:${game.scoreOpponent}`,

    scoreUs:
      before.scoreUs,

    scoreOpponent:
      before.scoreOpponent,

    servingBefore:
      before.servingTeam,

    servingAfter:
      game.servingTeam,

    lineupBefore:
      before.lineup,

    lineupAfter:[
      ...game.lineup
    ],

    time:
      Date.now()

  };


  game.actions.push(
    action
  );


  selectedCategory=null;


  saveDatabase();
  render();

}


/* =========================================================
   GEGNERFEHLER
========================================================= */

function openOpponentErrors(){

  const answer=
    prompt(
      "Gegnerfehler:\n\n"+
      "1 = Aufschlag ins Aus\n"+
      "2 = Aufschlag ins Netz\n"+
      "3 = Angriff ins Aus\n"+
      "4 = Angriff ins Netz\n"+
      "5 = Netz / Rotation\n"+
      "6 = Sonstiger Fehler"
    );


  if(answer===null) return;


  const error=
    OPPONENT_ERRORS[
      Number(answer)-1
    ];


  if(!error){

    toast(
      "Ungültige Auswahl."
    );

    return;

  }


  const game=
    currentGame();


  const before={

    scoreUs:
      game.scoreUs,

    scoreOpponent:
      game.scoreOpponent,

    servingTeam:
      game.servingTeam,

    lineup:[
      ...game.lineup
    ]

  };


  /*
    Gegnerfehler = Punkt für uns.
    applyPoint entscheidet automatisch,
    ob eine Rotation nötig ist.
  */

  applyPoint(
    game,
    "us"
  );


  game.actions.push({

    id:uid(),

    set:
      game.currentSet,

    category:
      "opponentError",

    result:
      error[0],

    label:
      error[1],

    playerName:
      "Gegner",

    pointFor:
      "us",

    scoreAfter:
      `${game.scoreUs}:${game.scoreOpponent}`,

    scoreUs:
      before.scoreUs,

    scoreOpponent:
      before.scoreOpponent,

    servingBefore:
      before.servingTeam,

    servingAfter:
      game.servingTeam,

    lineupBefore:
      before.lineup,

    lineupAfter:[
      ...game.lineup
    ],

    time:
      Date.now()

  });


  saveDatabase();
  render();

}


/* =========================================================
   MANUELLE PUNKTE
========================================================= */

function manualPoint(who){

  const game=
    currentGame();


  if(!game) return;


  const before={

    scoreUs:
      game.scoreUs,

    scoreOpponent:
      game.scoreOpponent,

    servingTeam:
      game.servingTeam,

    lineup:[
      ...game.lineup
    ]

  };


  applyPoint(
    game,
    who
  );


  game.actions.push({

    id:uid(),

    set:
      game.currentSet,

    category:"manual",

    result:
      who,

    label:
      who==="us"
        ?"Manueller Punkt für uns"
        :"Manueller Punkt Gegner",

    playerName:
      "Manuell",

    pointFor:
      who,

    scoreAfter:
      `${game.scoreUs}:${game.scoreOpponent}`,

    scoreUs:
      before.scoreUs,

    scoreOpponent:
      before.scoreOpponent,

    servingBefore:
      before.servingTeam,

    servingAfter:
      game.servingTeam,

    lineupBefore:
      before.lineup,

    lineupAfter:[
      ...game.lineup
    ],

    time:
      Date.now()

  });


  saveDatabase();
  render();

}


/* =========================================================
   RÜCKGÄNGIG
========================================================= */

function undo(){

  const game=
    currentGame();


  if(
    !game ||
    !game.actions.length
  ){

    toast(
      "Keine Aktion zum Rückgängigmachen."
    );

    return;

  }


  const action=
    game.actions.pop();


  /*
    Wichtig:
    Nicht nur den Punktestand,
    sondern auch Aufschlag und
    Rotation zurücksetzen.
  */

  if(
    action.scoreUs!==undefined
  ){

    game.scoreUs=
      action.scoreUs;

    game.scoreOpponent=
      action.scoreOpponent;

    game.servingTeam=
      action.servingBefore ||
      "us";


    if(
      action.lineupBefore
    ){

      game.lineup=[
        ...action.lineupBefore
      ];

    }

  }


  saveDatabase();

  render();

  toast(
    "Letzte Aktion rückgängig."
  );

}


/* =========================================================
   AUFSCHLAG MANUELL ÄNDERN
========================================================= */

function changeServingTeam(){

  const game=
    currentGame();


  if(!game) return;


  const answer=
    prompt(
      `Wer hat aktuell Aufschlag?\n\n`+
      `1 = ${currentTeam().name}\n`+
      `2 = ${game.opponent}`,
      game.servingTeam==="us"
        ?"1"
        :"2"
    );


  if(answer===null) return;


  game.servingTeam=
    answer==="2"
      ?"opponent"
      :"us";


  saveDatabase();
  render();

}


/* =========================================================
   SATZ BEENDEN
========================================================= */

function finishSet(){

  const game=
    currentGame();


  if(!game) return;


  if(
    game.scoreUs===
    game.scoreOpponent
  ){

    if(
      !confirm(
        "Der Satz steht unentschieden. Trotzdem speichern?"
      )
    ){

      return;

    }

  }


  if(
    !confirm(
      `Satz ${game.currentSet} mit `+
      `${game.scoreUs}:${game.scoreOpponent} speichern?`
    )
  ){

    return;

  }


  game.sets.push({

    set:
      game.currentSet,

    us:
      game.scoreUs,

    opponent:
      game.scoreOpponent

  });


  game.setFeeds[
    game.currentSet
  ]=
    readFeedValues(
      game.currentSet
    );


  game.currentSet++;

  game.scoreUs=0;
  game.scoreOpponent=0;


  /*
    Jeder neue Satz beginnt mit
    neuem Aufschlag.
  */

  const answer=
    prompt(
      `Wer hat im neuen Satz den ersten Aufschlag?\n\n`+
      `1 = ${currentTeam().name}\n`+
      `2 = ${game.opponent}`,
      game.servingTeam==="us"
        ?"1"
        :"2"
    );


  if(answer!==null){

    game.servingTeam=
      answer==="2"
        ?"opponent"
        :"us";

  }


  selectedPlayer=null;
  selectedCategory=null;


  saveDatabase();
  render();

  toast(
    "Satz gespeichert."
  );

}


/* =========================================================
   SPIEL BEENDEN
========================================================= */

function finishGame(){

  const game=
    currentGame();


  if(!game) return;


  if(
    game.scoreUs ||
    game.scoreOpponent
  ){

    if(
      confirm(
        "Aktuellen Satz ebenfalls speichern?"
      )
    ){

      game.sets.push({

        set:
          game.currentSet,

        us:
          game.scoreUs,

        opponent:
          game.scoreOpponent

      });


      game.setFeeds[
        game.currentSet
      ]=
        readFeedValues(
          game.currentSet
        );

    }

  }


  game.finished=true;


  saveDatabase();


  page="Analyse";

  render();

  toast(
    "Spiel beendet."
  );

}


/* =========================================================
   ZUSPIELVERTEILUNG
========================================================= */

function renderFeeds(
  game,
  setNumber
){

  const values=
    game.setFeeds[setNumber] || {};


  return `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Angriffsoption</th>
            <th>Anzahl</th>
            <th>Anteil</th>
          </tr>

        </thead>


        <tbody>

          ${
            FEED_OPTIONS
              .map(
                option=>`

                  <tr>

                    <td>
                      ${option}
                    </td>

                    <td>

                      <input

                        class="inline-input feed-input"

                        type="number"

                        min="0"

                        data-feed="${option}"

                        value="${
                          Number(
                            values[option]||0
                          )
                        }"

                        onchange="
                          saveFeeds(
                            ${setNumber}
                          )
                        "

                      >

                    </td>

                    <td>
                      ${feedPercentage(
                        values,
                        option
                      )}%
                    </td>

                  </tr>

                `
              )
              .join("")
          }

        </tbody>


        <tfoot>

          <tr>

            <th>
              Gesamt
            </th>

            <th>
              ${feedTotal(values)}
            </th>

            <th></th>

          </tr>

        </tfoot>

      </table>

    </div>

  `;

}


function readFeedValues(setNumber){

  const values={};


  document
    .querySelectorAll(".feed-input")
    .forEach(
      input=>{

        values[input.dataset.feed]=
          Math.max(
            0,
            Number(input.value)||0
          );

      }
    );


  return values;

}


function feedTotal(values){

  return FEED_OPTIONS.reduce(
    (sum,option)=>
      sum+
      Number(
        values[option]||0
      ),
    0
  );

}


function feedPercentage(
  values,
  option
){

  const total=
    feedTotal(values);


  if(!total) return 0;


  return Math.round(
    Number(values[option]||0)
    /total*100
  );

}


function saveFeeds(setNumber){

  const game=
    currentGame();


  if(!game) return;


  game.setFeeds[setNumber]=
    readFeedValues(
      setNumber
    );


  saveDatabase();
  render();

}


/* =========================================================
   STATISTIK
========================================================= */

function getStats(
  game,
  setNumber
){

  const actions=
    game.actions.filter(
      action=>
        action.set===setNumber &&
        ACTIONS[action.category]
    );


  const stats={};


  CATEGORIES.forEach(
    ([category])=>{

      const categoryActions=
        actions.filter(
          action=>
            action.category===category
        );


      stats[category]={

        total:
          categoryActions.length,

        items:{}

      };


      categoryActions.forEach(
        action=>{

          stats[category]
            .items[action.result]=
            (
              stats[category]
                .items[action.result]||0
            )+1;

        }
      );

    }
  );


  stats.attackSuccess=
    percent(
      stats.attack?.items.kill||0,
      stats.attack?.total||0
    );


  stats.receptionPositive=
    percent(
      stats.reception?.items.positive||0,
      stats.reception?.total||0
    );


  stats.defenseSuccess=
    percent(
      stats.defense?.items.successful||0,
      stats.defense?.total||0
    );


  return stats;

}


function renderStats(
  game,
  setNumber
){

  const stats=
    getStats(
      game,
      setNumber
    );


  return `

    <div class="metric-grid">


      <div class="metric">

        <strong>
          ${stats.attackSuccess}%
        </strong>

        <span>
          Angriffserfolgsquote
        </span>

      </div>


      <div class="metric">

        <strong>
          ${stats.receptionPositive}%
        </strong>

        <span>
          Positive Annahmen
        </span>

      </div>


      <div class="metric">

        <strong>
          ${stats.defenseSuccess}%
        </strong>

        <span>
          Erfolgreiche Abwehr
        </span>

      </div>


      <div class="metric">

        <strong>
          ${
            stats.serve?.items.ace||0
          }
        </strong>

        <span>
          Asse
        </span>

      </div>


      <div class="metric">

        <strong>
          ${
            stats.serve?.items.error||0
          }
        </strong>

        <span>
          Aufschlagfehler
        </span>

      </div>


      <div class="metric">

        <strong>
          ${
            stats.block?.items.point||0
          }
        </strong>

        <span>
          Punktblöcke
        </span>

      </div>


    </div>


    <div class="table-wrap section-gap">

      <table>

        <thead>

          <tr>

            <th>Bereich</th>
            <th>Aktionen</th>
            <th>Erfolg</th>
            <th>Fehler</th>

          </tr>

        </thead>


        <tbody>

          ${
            CATEGORIES
              .map(
                ([id,label])=>{

                  const stat=
                    stats[id];

                  const success=
                    id==="attack"
                      ?"kill"
                      :
                    id==="reception"
                      ?"positive"
                      :
                    id==="serve"
                      ?"ace"
                      :
                    id==="block"
                      ?"point"
                      :
                    "successful";


                  return `

                    <tr>

                      <td>
                        ${label}
                      </td>

                      <td>
                        ${stat.total}
                      </td>

                      <td>
                        ${
                          stat.items[success]||0
                        }
                      </td>

                      <td>
                        ${
                          stat.items.error||0
                        }
                      </td>

                    </tr>

                  `;

                }
              )
              .join("")
          }

        </tbody>

      </table>

    </div>

  `;

}


/* =========================================================
   ANALYSE
========================================================= */

function renderAnalysis(){

  const team=
    currentTeam();


  let game=
    currentGame();


  if(!game){

    game=
      team.games[0];

  }


  if(!game){

    return `

      <div class="page-title">
        <h2>Analyse</h2>
      </div>

      <div class="empty">
        Noch keine Spiele vorhanden.
      </div>

    `;

  }


  gameId=game.id;


  const sets=
    [...game.sets];


  if(
    game.actions.some(
      action=>
        action.set===game.currentSet
    ) &&
    !sets.some(
      set=>
        set.set===game.currentSet
    )
  ){

    sets.push({

      set:
        game.currentSet,

      us:
        game.scoreUs,

      opponent:
        game.scoreOpponent,

      live:true

    });

  }


  const playerRows=
    team.players
      .map(
        player=>{

          const actions=
            game.actions.filter(
              action=>
                action.playerId===
                player.id &&
                ACTIONS[action.category]
            );


          const attacks=
            actions.filter(
              action=>
                action.category==="attack"
            );


          const receptions=
            actions.filter(
              action=>
                action.category==="reception"
            );


          const defense=
            actions.filter(
              action=>
                action.category==="defense"
            );


          return `

            <tr>

              <td>
                ${esc(player.name)}
              </td>

              <td>
                ${attacks.length}
              </td>

              <td>
                ${
                  percent(
                    attacks.filter(
                      action=>
                        action.result==="kill"
                    ).length,
                    attacks.length
                  )
                }%
              </td>

              <td>
                ${receptions.length}
              </td>

              <td>
                ${
                  percent(
                    receptions.filter(
                      action=>
                        action.result==="positive"
                    ).length,
                    receptions.length
                  )
                }%
              </td>

              <td>
                ${defense.length}
              </td>

              <td>
                ${
                  percent(
                    defense.filter(
                      action=>
                        action.result==="successful"
                    ).length,
                    defense.length
                  )
                }%
              </td>

            </tr>

          `;

        }
      )
      .join("");


  return `

    <div class="page-title">

      <div>

        <h2>Analyse</h2>

        <div class="muted">

          ${esc(game.opponent)}
          ·
          ${esc(game.date)}

        </div>

      </div>


      <select
        class="team-select"
        onchange="openAnalysisGame(this.value)"
      >

        ${
          team.games.map(
            item=>`

              <option
                value="${item.id}"
                ${
                  item.id===game.id
                    ?"selected"
                    :""
                }
              >
                ${esc(item.opponent)}
                ·
                ${esc(item.date)}
              </option>

            `
          ).join("")
        }

      </select>

    </div>


    <section class="card">

      <div class="row between">

        <h3>
          Spielübersicht
        </h3>

        <span class="pill">
          Sätze ${getSetScore(game)}
        </span>

      </div>


      <div class="scoreboard">

        <div>

          <div class="score-label">
            ${esc(team.name)}
          </div>

          <div class="score">
            ${game.scoreUs}
          </div>

        </div>


        <div class="muted">
          STAND
        </div>


        <div>

          <div class="score-label">
            ${esc(game.opponent)}
          </div>

          <div class="score">
            ${game.scoreOpponent}
          </div>

        </div>

      </div>


      <div class="section-gap">

        ${renderStats(
          game,
          game.currentSet
        )}

      </div>

    </section>


    <section class="card section-gap">

      <h3>
        Analyse je Satz
      </h3>


      ${
        sets.length

        ?

        sets.map(
          set=>`

            <details
              class="section-gap"
              ${
                set.set===game.currentSet
                  ?"open"
                  :""
              }
            >

              <summary>

                <b>
                  Satz ${set.set}
                </b>

                ·

                ${set.us}:${set.opponent}

                ${
                  set.live
                    ?" · aktuell"
                    :""
                }

              </summary>


              <div class="section-gap">

                ${renderStats(
                  game,
                  set.set
                )}

              </div>


              <h4>
                Zuspielverteilung
              </h4>


              ${renderFeedsReadonly(
                game,
                set.set
              )}

          `
        ).join("")

        :

        `
          <p class="muted">
            Noch keine Sätze gespeichert.
          </p>
        `

      }

    </section>


    <section class="card section-gap">

      <h3>
        Spielerinnen-Analyse
      </h3>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>Spielerin</th>
              <th>Angriffe</th>
              <th>Angriffserfolg</th>
              <th>Annahmen</th>
              <th>Positiv</th>
              <th>Abwehren</th>
              <th>Erfolgreich</th>

            </tr>

          </thead>


          <tbody>

            ${playerRows}

          </tbody>

        </table>

      </div>

    </section>


    <section class="card section-gap">

      <h3>
        Aktionen
      </h3>


      <div class="actions-list">

        ${
          game.actions
            .slice()
            .reverse()
            .map(
              action=>`

                <div class="action-item">

                  <span>
                    ${esc(
                      actionText(
                        action,
                        game,
                        team
                      )
                    )}
                  </span>

                  <small>
                    Satz ${action.set}

                    ${action.scoreAfter||""}

function openAnalysisGame(id){

  gameId=id;

  render();

}


/* =========================================================
   AKTIONSTEXT
========================================================= */

function actionText(
  action,
  game,
  team
){

  if(
    action.category===
    "opponentError"
  ){

    return `Gegnerfehler: ${
      action.label
    } → Punkt für uns`;

  }


  if(
    action.category==="manual"
  ){

    return action.label;

  }


  const category=
    CATEGORIES.find(
      item=>
        item[0]===
        action.category
    )?.[1] ||
    action.category;


  const result=
    ACTIONS[action.category]
      ?.find(
        item=>
          item[1]===
          action.result
      )?.[0] ||
    action.result;


  let pointText="";


  if(
    action.pointFor==="us"
  ){

    pointText=
      " · Punkt für uns";

  }

  else if(
    action.pointFor==="opponent"
  ){

    pointText=
      " · Punkt Gegner";

  }


  return `

    ${
      action.playerName ||
      "Spielerin"
    }

    ·

    ${category}

    ·

    ${result}

    ${pointText}

  `;

}


/* =========================================================
   EXPORT / IMPORT
========================================================= */

function exportDatabase(){

  const blob=
    new Blob(
      [
        JSON.stringify(
          db,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const link=
    document.createElement("a");


  link.href=
    URL.createObjectURL(
      blob
    );


  link.download=
    "volleystats-backup.json";


  link.click();


  URL.revokeObjectURL(
    link.href
  );

}


function importDatabase(event){

  const file=
    event.target.files?.[0];


  if(!file) return;


  const reader=
    new FileReader();


  reader.onload=()=>{

    try{

      const imported=
        JSON.parse(
          reader.result
        );


      if(
        !Array.isArray(
          imported.teams
        )
      ){

        throw new Error();

      }


      imported.teams.forEach(
        team=>{

          team.players ??=[];
          team.games ??=[];

          team.games.forEach(
            game=>{

              game.servingTeam ??="us";

              game.lineup ??=[
                null,
                null,
                null,
                null,
                null,
                null
              ];

              game.actions ??=[];
              game.sets ??=[];
              game.setFeeds ??={};

            }
          );

        }
      );


      imported.currentTeam ??=
        imported.teams[0]?.id;


      db=imported;


      saveDatabase();

      gameId=null;

      render();

      toast(
        "Daten importiert."
      );

    }

    catch(error){

      alert(
        "Die Datei konnte nicht importiert werden."
      );

    }


    event.target.value="";

  };


  reader.readAsText(file);

}


/* =========================================================
   KEYBOARD / NUMPAD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(page!=="Live") return;


    const target=
      event.target?.tagName;


    if(
      ["INPUT","TEXTAREA","SELECT"]
      .includes(target)
    ){

      return;

    }


    const game=
      currentGame();


    if(!game) return;


    /*
      ESC
    */

    if(event.key==="Escape"){

      event.preventDefault();

      clearSelection();

      return;

    }


    /*
      0 = Gegnerfehler
    */

    if(
      event.key==="0" &&
      !event.shiftKey
    ){

      event.preventDefault();

      openOpponentErrors();

      return;

    }


    /*
      SPIELERIN AUSWÄHLEN

      1–9
      Shift+1–5
    */

    if(!selectedPlayer){

      let scoutingKey=null;


      if(
        event.shiftKey &&
        /^[1-5]$/.test(event.key)
      ){

        scoutingKey=
          Number(event.key)+9;

      }

      else if(
        !event.shiftKey &&
        /^[1-9]$/.test(event.key)
      ){

        scoutingKey=
          Number(event.key);

      }


      if(scoutingKey){

        const player=
          currentTeam()
            .players
            .find(
              p=>
                p.scoutingKey===
                scoutingKey
            );


        if(player){

          event.preventDefault();

          selectedPlayer=
            player.id;

          selectedCategory=null;

          render();

        }

        else{

          toast(
            "Keine Spielerin auf Taste "+
            keyText(scoutingKey)
          );

        }

        return;

      }

    }


    /*
      KATEGORIE
      1–5
    */

    if(
      selectedPlayer &&
      !selectedCategory &&
      !event.shiftKey &&
      /^[1-5]$/.test(event.key)
    ){

      event.preventDefault();


      const category=
        CATEGORIES[
          Number(event.key)-1
        ];


      if(category){

        chooseCategory(
          category[0]
        );

      }


      return;

    }


    /*
      ERGEBNIS

      1–4 je nach Kategorie
    */

    if(
      selectedPlayer &&
      selectedCategory &&
      !event.shiftKey &&
      /^[1-4]$/.test(event.key)
    ){

      const options=
        ACTIONS[
          selectedCategory
        ];


      const result=
        options[
          Number(event.key)-1
        ];


      if(result){

        event.preventDefault();

        recordAction(
          selectedCategory,
          result[1]
        );

      }

    }

  }
);


/* =========================================================
   START
========================================================= */

render();

</script>
