<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VolleyStats</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --dark:#111827;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#d97706;
  --text:#17202a;
  --muted:#6b7280;
  --border:#e5e7eb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  background:var(--dark);
  color:white;
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:50;
}

.topbar-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.team-select{
  background:#263244;
  color:white;
  border:1px solid #4b5563;
  border-radius:10px;
  padding:9px 12px;
  min-width:180px;
}

nav{
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  overflow-x:auto;
  position:sticky;
  top:61px;
  z-index:40;
}

nav button{
  background:white;
  border:0;
  padding:14px 18px;
  color:var(--muted);
  font-weight:800;
  white-space:nowrap;
}

nav button.active{
  color:var(--blue);
  border-bottom:3px solid var(--blue);
}

main{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.grid{
  display:grid;
  gap:14px;
}

.grid-2{
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.space{
  justify-content:space-between;
}

.title{
  margin:0 0 7px;
  font-size:21px;
  font-weight:900;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:#e5e7eb;
  font-weight:800;
}

.btn.primary{
  background:var(--blue);
  color:white;
}

.btn.green{
  background:var(--green);
  color:white;
}

.btn.red{
  background:var(--red);
  color:white;
}

.btn.orange{
  background:var(--orange);
  color:white;
}

.btn.big{
  padding:13px 17px;
  font-size:16px;
}

.input{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:10px;
}

.scoreboard{
  background:var(--dark);
  color:white;
  border-radius:18px;
  padding:18px;
  text-align:center;
}

.score{
  font-size:58px;
  font-weight:900;
  line-height:1;
}

.set-score{
  color:#cbd5e1;
  font-size:17px;
  margin-bottom:10px;
}

.score-buttons{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}

.court{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:1fr 1fr;
  gap:9px;
  background:#eef2f7;
  border:3px solid #94a3b8;
  border-radius:16px;
  padding:10px;
  aspect-ratio:1.5;
}

.position{
  background:white;
  border:2px dashed #cbd5e1;
  border-radius:12px;
  min-height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.position.selected{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

.position-number{
  font-size:12px;
  color:var(--muted);
}

.player-name{
  font-weight:900;
  margin-top:4px;
}

.player-number{
  font-size:12px;
  color:var(--muted);
}

.bench{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.bench-player{
  padding:10px 12px;
  background:white;
  border:2px solid #cbd5e1;
  border-radius:10px;
  font-weight:800;
}

.action-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
  gap:9px;
}

.action-button{
  border:1px solid #dbe1e8;
  background:#f1f5f9;
  border-radius:12px;
  padding:14px 9px;
  min-height:64px;
  font-weight:900;
}

.action-button.selected{
  background:var(--blue);
  color:white;
}

.key{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:3px;
}

.action-button.selected .key{
  color:white;
}

.last-action{
  border-left:5px solid var(--blue);
  background:#eff6ff;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
}

.stat{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
}

.stat-value{
  font-size:23px;
  font-weight:900;
  margin-top:4px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:9px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

th{
  background:#f8fafc;
}

.table-scroll{
  overflow-x:auto;
}

.pill{
  display:inline-block;
  background:#eef2ff;
  border-radius:999px;
  padding:4px 9px;
  font-size:12px;
  font-weight:800;
}

.legend{
  line-height:1.7;
  font-size:13px;
}

.feed-input{
  width:80px;
  padding:7px;
  border:1px solid #d1d5db;
  border-radius:8px;
}

@media(max-width:700px){
  main{
    padding:10px;
  }

  .topbar-inner{
    flex-direction:column;
    align-items:stretch;
  }

  .team-select{
    width:100%;
  }

  .score{
    font-size:48px;
  }

  .court{
    aspect-ratio:1.25;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">🏐 VolleyStats</div>

    <select id="teamSelect"
            class="team-select"
            onchange="switchTeam(this.value)">
    </select>
  </div>
</header>

<nav id="navigation"></nav>

<main>

<section id="gamesPage" class="page"></section>

<section id="livePage" class="page"></section>

<section id="rosterPage" class="page"></section>

<section id="analysisPage" class="page"></section>

</main>

<script>

/* =========================================================
   DATENBANK
========================================================= */

const STORAGE_KEY = "volleystats_final_v2";

let db = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

if(!db){
  db = {
    teams:[],
    activeTeam:null,
    activeGame:null
  };
}

let state = {
  page:"games",

  selectedPlayer:null,
  selectedCategory:null,

  /*
    Numpad:
    player -> category -> result

    opponent -> 0 -> 1-6
  */
  numpadMode:"player"
};


/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

function id(){
  return Date.now().toString(36) +
         Math.random().toString(36).substring(2);
}

function currentTeam(){
  return db.teams.find(
    team => team.id === db.activeTeam
  );
}

function currentGame(){
  const team = currentTeam();

  if(!team){
    return null;
  }

  return team.games.find(
    game => game.id === db.activeGame
  );
}

function playerById(playerId){
  const team = currentTeam();

  if(!team){
    return null;
  }

  return team.players.find(
    player => player.id === playerId
  );
}

function playerName(playerId){
  const player = playerById(playerId);

  return player ? player.name : "—";
}

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page){

  state.page = page;

  render();

}

function render(){

  renderTeamSelect();

  renderNavigation();

  document.querySelectorAll(".page")
    .forEach(page => page.classList.remove("active"));

  const page = document.getElementById(
    state.page + "Page"
  );

  if(page){
    page.classList.add("active");
  }

  if(state.page === "games"){
    renderGames();
  }

  if(state.page === "live"){
    renderLive();
  }

  if(state.page === "roster"){
    renderRoster();
  }

  if(state.page === "analysis"){
    renderAnalysis();
  }
}


/* =========================================================
   TEAM AUSWAHL
========================================================= */

function renderTeamSelect(){

  const select =
    document.getElementById("teamSelect");

  select.innerHTML = "";

  db.teams.forEach(team => {

    const option =
      document.createElement("option");

    option.value = team.id;
    option.textContent = team.name;

    if(team.id === db.activeTeam){
      option.selected = true;
    }

    select.appendChild(option);

  });

  const newOption =
    document.createElement("option");

  newOption.value = "__new__";
  newOption.textContent = "＋ Neues Team";

  select.appendChild(newOption);
}

function switchTeam(teamId){

  if(teamId === "__new__"){
    createTeam();
    return;
  }

  db.activeTeam = teamId;

  db.activeGame = null;

  state.selectedPlayer = null;
  state.selectedCategory = null;
  state.numpadMode = "player";

  save();

  render();
}


/* =========================================================
   NAVIGATION
========================================================= */

function renderNavigation(){

  const nav =
    document.getElementById("navigation");

  const items = [

    ["games","🏠 Spiele"],

    ["live","🎥 Live"],

    ["roster","👥 Kader"],

    ["analysis","📊 Analyse"]

  ];

  nav.innerHTML = items.map(item => {

    return `
      <button
        class="${state.page === item[0] ? "active" : ""}"
        onclick="showPage('${item[0]}')">
        ${item[1]}
      </button>
    `;

  }).join("");
}


/* =========================================================
   TEAMS
========================================================= */

function createTeam(){

  const name =
    prompt("Teamname, z. B. Damen 1:");

  if(!name){
    render();
    return;
  }

  const team = {

    id:id(),

    name:name,

    players:[],

    games:[]

  };

  db.teams.push(team);

  db.activeTeam = team.id;

  db.activeGame = null;

  save();

  render();

}

function deleteCurrentTeam(){

  const team = currentTeam();

  if(!team){
    return;
  }

  if(
    !confirm(
      `Team „${team.name}“ wirklich löschen?\n\nAlle Spiele und Statistiken dieses Teams werden gelöscht.`
    )
  ){
    return;
  }

  db.teams =
    db.teams.filter(
      t => t.id !== team.id
    );

  db.activeTeam =
    db.teams.length
      ? db.teams[0].id
      : null;

  db.activeGame = null;

  save();

  render();
}


/* =========================================================
   SPIELE
========================================================= */

function createGame(){

  const team = currentTeam();

  if(!team){
    createTeam();
    return;
  }

  const opponent =
    prompt("Gegner:");

  if(!opponent){
    return;
  }

  const date =
    new Date().toISOString().slice(0,10);

  const game = {

    id:id(),

    opponent:opponent,

    date:date,

    currentSet:1,

    scoreUs:0,

    scoreOpponent:0,

    sets:[],

    actions:[],

    substitutions:[],

    lineup:[null,null,null,null,null,null],

    setFeeds:{},

    finished:false

  };

  /*
    Die ersten sechs Spieler
    kommen automatisch aufs Feld.
  */

  team.players
    .slice(0,6)
    .forEach((player,index) => {

      game.lineup[index] =
        player.id;

    });

  team.games.unshift(game);

  db.activeGame = game.id;

  save();

  state.page = "live";

  render();
}

function openGame(gameId){

  db.activeGame = gameId;

  state.selectedPlayer = null;
  state.selectedCategory = null;
  state.numpadMode = "player";

  save();

  showPage("live");
}

function deleteGame(gameId){

  if(!confirm("Spiel wirklich löschen?")){
    return;
  }

  const team = currentTeam();

  team.games =
    team.games.filter(
      game => game.id !== gameId
    );

  if(db.activeGame === gameId){
    db.activeGame = null;
  }

  save();

  render();
}

function setScore(game){

  const us =
    game.sets.filter(
      set => set.us > set.opponent
    ).length;

  const opponent =
    game.sets.filter(
      set => set.opponent > set.us
    ).length;

  return `${us}:${opponent}`;
}


/* =========================================================
   SPIELE SEITE
========================================================= */

function renderGames(){

  const page =
    document.getElementById("gamesPage");

  const team = currentTeam();

  if(!team){

    page.innerHTML = `
      <div class="card">
        <h1 class="title">Willkommen bei VolleyStats</h1>

        <p class="muted">
          Lege zuerst ein Team an.
        </p>

        <button
          class="btn primary big"
          onclick="createTeam()">
          ＋ Team anlegen
        </button>
      </div>
    `;

    return;
  }

  page.innerHTML = `

    <div class="row space">

      <div>
        <h1 class="title">
          Spiele – ${escapeHTML(team.name)}
        </h1>

        <div class="muted">
          Spiele und Statistiken dieses Teams
        </div>
      </div>

      <div class="row">

        <button
          class="btn primary big"
          onclick="createGame()">
          ＋ Neues Spiel
        </button>

        <button
          class="btn"
          onclick="createTeam()">
          ＋ Neues Team
        </button>

      </div>

    </div>


    <div
      class="grid grid-2"
      style="margin-top:14px">

      ${
        team.games.length

        ?

        team.games.map(game => `

          <div class="card">

            <div class="row space">

              <div>

                <h2 class="title">
                  vs. ${escapeHTML(game.opponent)}
                </h2>

                <div class="muted">
                  ${escapeHTML(game.date)}
                </div>

              </div>

              <span class="pill">
                ${game.finished ? "Beendet" : "Laufend"}
              </span>

            </div>

            <p>
              <b>Sätze:</b>
              ${setScore(game)}
            </p>

            <p class="small muted">

              ${
                game.sets.length

                ?

                game.sets
                  .map(
                    set =>
                      `Satz ${set.set}: ${set.us}:${set.opponent}`
                  )
                  .join(" · ")

                :

                "Noch kein abgeschlossener Satz"

              }

            </p>

            <div class="row">

              <button
                class="btn primary"
                onclick="openGame('${game.id}')">
                Öffnen
              </button>

              <button
                class="btn"
                onclick="showGameAnalysis('${game.id}')">
                Analyse
              </button>

              <button
                class="btn red"
                onclick="deleteGame('${game.id}')">
                Löschen
              </button>

            </div>

          </div>

        `).join("")

        :

        `
          <div class="card">
            <b>Noch keine Spiele.</b>

            <p class="muted">
              Lege dein erstes Spiel an.
            </p>
          </div>
        `
      }

    </div>


    <div class="card">

      <div class="row space">

        <div>

          <b>Teamverwaltung</b>

          <div class="small muted">
            Aktives Team:
            ${escapeHTML(team.name)}
          </div>

        </div>

        <button
          class="btn red"
          onclick="deleteCurrentTeam()">
          Team löschen
        </button>

      </div>

    </div>

  `;
}

function showGameAnalysis(gameId){

  db.activeGame = gameId;

  state.page = "analysis";

  save();

  render();
}


/* =========================================================
   KADER
========================================================= */

function addPlayer(){

  const team = currentTeam();

  if(!team){
    return;
  }

  const name =
    prompt("Name:");

  if(!name){
    return;
  }

  const number =
    prompt("Trikotnummer:") || "";

  const position =
    prompt("Position, z. B. Außen:") || "";

  /*
    Automatisch freie Numpad-Taste.
  */

  const usedKeys =
    team.players
      .map(player => Number(player.key))
      .filter(Boolean);

  const freeKey =
    [1,2,3,4,5,6]
      .find(key => !usedKeys.includes(key));

  team.players.push({

    id:id(),

    name:name,

    number:number,

    position:position,

    key:freeKey || ""

  });

  save();

  render();
}

function editPlayer(playerId){

  const player =
    playerById(playerId);

  if(!player){
    return;
  }

  const name =
    prompt("Name:",player.name);

  if(name === null){
    return;
  }

  const number =
    prompt(
      "Trikotnummer:",
      player.number
    );

  const position =
    prompt(
      "Position:",
      player.position || ""
    );

  const key =
    prompt(
      "Numpad-Taste 1–6:",
      player.key || ""
    );

  if(
    key !== "" &&
    !/^[1-6]$/.test(key)
  ){

    alert(
      "Bitte eine Zahl von 1 bis 6 oder leer eingeben."
    );

    return;
  }

  if(
    key &&
    currentTeam().players.some(
      p =>
        p.id !== playerId &&
        String(p.key) === String(key)
    )
  ){

    alert(
      "Diese Numpad-Taste ist bereits vergeben."
    );

    return;
  }

  player.name = name;
  player.number = number || "";
  player.position = position || "";
  player.key = key ? Number(key) : "";

  save();

  render();
}

function deletePlayer(playerId){

  if(!confirm("Spieler/in löschen?")){
    return;
  }

  const team = currentTeam();

  team.players =
    team.players.filter(
      p => p.id !== playerId
    );

  /*
    Spieler/in aus allen Aufstellungen entfernen.
  */

  team.games.forEach(game => {

    game.lineup =
      game.lineup.map(
        id => id === playerId
          ? null
          : id
      );

  });

  save();

  render();
}

function renderRoster(){

  const page =
    document.getElementById("rosterPage");

  const team = currentTeam();

  if(!team){
    page.innerHTML = "";
    return;
  }

  page.innerHTML = `

    <div class="row space">

      <div>

        <h1 class="title">
          Kader – ${escapeHTML(team.name)}
        </h1>

        <div class="muted">
          Die Numpad-Taste bleibt während des gesamten Spiels
          fest mit einer Person verbunden.
        </div>

      </div>

      <button
        class="btn primary"
        onclick="addPlayer()">
        ＋ Spieler/in
      </button>

    </div>


    <div class="card">

      <div class="table-scroll">

        <table>

          <thead>

            <tr>
              <th>Numpad</th>
              <th>Name</th>
              <th>Trikot</th>
              <th>Position</th>
              <th></th>
            </tr>

          </thead>

          <tbody>

            ${
              team.players.length

              ?

              team.players.map(player => `

                <tr>

                  <td>
                    <b>
                      ${player.key || "—"}
                    </b>
                  </td>

                  <td>
                    ${escapeHTML(player.name)}
                  </td>

                  <td>
                    #${escapeHTML(player.number)}
                  </td>

                  <td>
                    ${escapeHTML(player.position)}
                  </td>

                  <td>

                    <button
                      class="btn"
                      onclick="editPlayer('${player.id}')">
                      Bearbeiten
                    </button>

                    <button
                      class="btn red"
                      onclick="deletePlayer('${player.id}')">
                      Löschen
                    </button>

                  </td>

                </tr>

              `).join("")

              :

              `
                <tr>
                  <td colspan="5">
                    <span class="muted">
                      Noch keine Spieler/innen.
                    </span>
                  </td>
                </tr>
              `
            }

          </tbody>

        </table>

      </div>

    </div>


    <div class="card">

      <b>🎥 Videoanalyse</b>

      <p class="small muted">

        Beispiel:
        <b>1</b> wählt Spielerin auf Numpad 1.
        Danach wird eine Kategorie und anschließend
        das Ergebnis gewählt.

        Die Position auf dem Spielfeld wird unabhängig
        davon automatisch verfolgt.

      </p>

    </div>

  `;
}


/* =========================================================
   LIVE
========================================================= */

function renderLive(){

  const page =
    document.getElementById("livePage");

  const game = currentGame();

  if(!game){

    page.innerHTML = `

      <div class="card">

        <h1 class="title">
          Kein Spiel ausgewählt
        </h1>

        <button
          class="btn primary"
          onclick="createGame()">
          ＋ Neues Spiel
        </button>

      </div>

    `;

    return;
  }

  const currentActions =
    game.actions.filter(
      action =>
        action.set === game.currentSet
    );

  const stats =
    calculateStats(currentActions);

  const last =
    game.actions[game.actions.length - 1];

  page.innerHTML = `

    <div class="row space">

      <div>

        <h1 class="title">
          vs. ${escapeHTML(game.opponent)}
        </h1>

        <div class="muted">
          Satz ${game.currentSet}
        </div>

      </div>

      <div class="row">

        <button
          class="btn"
          onclick="finishSet()">
          Satz beenden
        </button>

/* =========================================================

function renderCourt(game){

  /*
    Darstellung:

    vorne:
    4 | 3 | 2

    hinten:
    5 | 6 | 1
  */

  const order =
    [3,2,1,4,5,0];

  return order
    .map(index => {

      const playerId =
        game.lineup[index];

      const player =
        playerById(playerId);

      return `

        <div
          class="position
            ${
              state.selectedPlayer === playerId
                ? "selected"
                : ""
            }"

          draggable="${playerId ? "true" : "false"}"

          onclick="
            ${
              playerId
                ? `selectPlayer('${playerId}')`
                : ""
            }
          "

          ondragstart="
            ${
              playerId
                ? `dragField(event,'${playerId}',${index})`
                : ""
            }
          "

          ondragover="event.preventDefault()"

          ondrop="
            dropOnPosition(event,${index})
          "

        >

          <div class="position-number">
            Position ${index+1}
          </div>

          ${
            player

            ?

            `

              <div class="player-name">

                ${
                  player.key
                    ? `[${player.key}] `
                    : ""
                }

                ${escapeHTML(player.name)}

              </div>

              <div class="player-number">
                #${escapeHTML(player.number)}
              </div>

            `

            :

            `<div class="muted">frei</div>`

          }

        </div>

      `;

    })
    .join("");

}

function renderBench(game){

    new Set(
      game.lineup.filter(Boolean)

  return bench.map(player => `

    <div

/* =========================================================
   DRAG & DROP
========================================================= */

function dragField(event,playerId,index){

  event.dataTransfer.setData(
    "type",
    "field"
  );

  event.dataTransfer.setData(
    "playerId",
    playerId
  );

  event.dataTransfer.setData(
    "index",
    index
  );
}

function dragBench(event,playerId){

  event.dataTransfer.setData(
    "type",
    "bench"
  );

  event.dataTransfer.setData(
    "playerId",
    playerId
  );
}

function dropOnPosition(event,targetIndex){

  event.preventDefault();

  const game =
    currentGame();

  const type =
    event.dataTransfer.getData("type");

  const playerId =
    event.dataTransfer.getData("playerId");

  if(!game || !playerId){
    return;
  }

  if(type === "field"){

    const fromIndex =
      Number(
        event.dataTransfer.getData("index")
      );

    [
      game.lineup[fromIndex],
      game.lineup[targetIndex]
    ] =
    [
      game.lineup[targetIndex],
      game.lineup[fromIndex]
    ];

    game.substitutions.push({

      type:"field-swap",

      set:game.currentSet,

      from:fromIndex+1,

      to:targetIndex+1,

      time:Date.now()

    });

  }

  if(type === "bench"){

    const oldPlayer =
      game.lineup[targetIndex];

    game.lineup[targetIndex] =
      playerId;

    game.substitutions.push({

      type:"substitution",

      set:game.currentSet,

      incoming:playerId,

      outgoing:oldPlayer,

      position:targetIndex+1,

      time:Date.now()

    });

  }

  save();

  renderLive();
}

/* =========================================================
   AKTION AUFZEICHNEN
========================================================= */

function recordAction(category,result){

  const game =
    currentGame();

  if(!game || !state.selectedPlayer){
    return;
  }

  let ownPoint = false;
  let opponentPoint = false;

  /*
    Eigener Punkt
  */

  if(
    category === "attack" &&
    result === 1
  ){
    ownPoint = true;
  }

  if(
    category === "serve" &&
    result === 1
  ){
    ownPoint = true;
  }

  if(
    category === "block" &&
    result === 1
  ){
    ownPoint = true;
  }

  /*
    Fehler / Punkt für Gegner
  */

  if(
    category === "attack" &&
    [3,4].includes(result)
  ){
    opponentPoint = true;
  }

  if(
    category === "serve" &&
    result === 4
  ){
    opponentPoint = true;
  }

  if(
    category === "reception" &&
    result === 3
  ){
    opponentPoint = true;
  }

  if(
    category === "block" &&
    result === 3
  ){
    opponentPoint = true;
  }

  if(
    category === "defense" &&
    result === 3
  ){
    opponentPoint = true;
  }

  const action = {

    id:id(),

    set:game.currentSet,

    playerId:state.selectedPlayer,

    category:category,

    result:result,

    scoreUs:ownPoint ? 1 : 0,

    scoreOpponent:opponentPoint ? 1 : 0,

    time:Date.now()

  };

  game.actions.push(action);

  if(ownPoint){

    game.scoreUs++;

    /*
      Unser Punkt =
      Rotation.
    */

    rotate(game);

  }

  if(opponentPoint){

    game.scoreOpponent++;

    /*
      Gegnerpunkt =
      KEINE Rotation.
    */

  }

  state.selectedCategory =
    null;

  state.numpadMode =
    "player";

  save();

  renderLive();
}

/* =========================================================
   ROTATION
========================================================= */

function rotate(game){

  /*
    Volleyball:

    Position 1
       ↓
    Position 6
       ↓
    Position 5
       ↓
    Position 4
       ↓
    Position 3
       ↓
    Position 2
       ↓
    Position 1

    Array:

    [1,2,3,4,5,6]

    wird zu:

    [2,3,4,5,6,1]

  */

  game.lineup = [

    game.lineup[1],
    game.lineup[2],
    game.lineup[3],
    game.lineup[4],
    game.lineup[5],
    game.lineup[0]

  ];
}

function manualPointForOpponent(){

  */

/* =========================================================
   UNDO
========================================================= */

function undoLastAction(){

  const game =
    currentGame();

  if(!game || !game.actions.length){
    return;
  }

  const last =
    game.actions[game.actions.length-1];

  /*
    Wichtig:
    Rotation kann nicht einfach durch
    Punktabzug rückgängig gemacht werden.

    Deshalb wird der aktuelle Satz
    aus allen Aktionen neu aufgebaut.
  */

  game.actions.pop();

  rebuildCurrentSet(game);

  save();

  renderLive();
}

function rebuildCurrentSet(game){

  /*
    Wir rekonstruieren:
    Punktestand + Rotation.

    Ausgangsaufstellung ist nicht mehr
    separat gespeichert.
    Deshalb wird die Aufstellung
    aus dem aktuellen Zustand rückwärts
    nicht verändert.

    Für normale Undo-Nutzung wird deshalb
    nur der Punktstand neu berechnet.
  */

  let us = 0;
  let opponent = 0;

  game.actions
    .filter(
      action =>
        action.set === game.currentSet
    )
    .forEach(action => {

      us += action.scoreUs || 0;

      opponent +=
        action.scoreOpponent || 0;

    });

  game.scoreUs = us;
  game.scoreOpponent = opponent;
}


/* =========================================================
   SATZ BEENDEN
========================================================= */

function finishSet(){

  const game =
    currentGame();

  if(!game){
    return;
  }

  if(
    game.scoreUs === 0 &&
    game.scoreOpponent === 0
  ){

    alert(
      "Dieser Satz hat noch keinen Punkt."
    );

    return;
  }

  saveCurrentFeed(game);

  game.sets.push({

    set:game.currentSet,

    us:game.scoreUs,

    opponent:game.scoreOpponent,

    feed:
      game.setFeeds[game.currentSet] || {}

  });

  game.currentSet++;

  game.scoreUs = 0;

  game.scoreOpponent = 0;

  state.selectedPlayer = null;

  state.selectedCategory = null;

  state.numpadMode = "player";

  save();

  renderLive();
}


/* =========================================================
   SPIEL BEENDEN
========================================================= */

function finishGame(){

  const game =
    currentGame();

  if(!game){
    return;
  }

  /*
    Wenn der aktuelle Satz Punkte enthält,
    fragen wir, ob er gespeichert werden soll.
  */

  if(
    game.scoreUs > 0 ||
    game.scoreOpponent > 0
  ){

    const saveSet =
      confirm(
        "Der aktuelle Satz ist noch nicht beendet.\n\nSoll er als letzter Satz gespeichert werden?"
      );

    if(saveSet){

      saveCurrentFeed(game);

      game.sets.push({

        set:game.currentSet,

        us:game.scoreUs,

        opponent:game.scoreOpponent,

        feed:
          game.setFeeds[game.currentSet] || {}

      });

    }

  }

  game.finished = true;

  save();

  state.page = "analysis";

  render();
}

                    value="${feed[option] || 0}"

                      changeFeed(
                        '${option}',
                        this.value
                      )
                    "

          }

      ${
        total
          ? " · " +
            feedOptions
              .filter(o => Number(feed[o] || 0) > 0)
              .map(o =>

                  total *
                  100
                ).toFixed(1)}%`
              )
              .join(" · ")
          : ""
      }

    </p>

  `;
}

function changeFeed(option,value){

  const game =
    currentGame();

  if(!game){
    return;
  }

  if(!game.setFeeds[game.currentSet]){
    game.setFeeds[game.currentSet] = {};
  }

  game.setFeeds[game.currentSet][option] =
    Math.max(0,Number(value) || 0);

  save();

  renderLive();
}

function saveCurrentFeed(game){

  if(!game.setFeeds[game.currentSet]){
    game.setFeeds[game.currentSet] = {};
  }

}


/* =========================================================
   STATISTIK
========================================================= */

function calculateStats(actions){

  const attack =
    actions.filter(
      a => a.category === "attack"
    );

  const reception =
    actions.filter(
      a => a.category === "reception"
    );

  const serve =
    actions.filter(
      a => a.category === "serve"
    );

  const block =
    actions.filter(
      a => a.category === "block"
    );

  const defense =
    actions.filter(
      a => a.category === "defense"
    );

  const attackKills =
    attack.filter(
      a => a.result === 1
    ).length;

  const attackPlayable =
    attack.filter(
      a => a.result === 2
    ).length;

  const attackErrors =
    attack.filter(
      a => a.result === 3
    ).length;

  const attackBlocked =
    attack.filter(
      a => a.result === 4
    ).length;

  const receptionPositive =
    reception.filter(
      a => a.result === 1
    ).length;

  const serveAces =
    serve.filter(
      a => a.result === 1
    ).length;

  const serveErrors =
    serve.filter(
      a => a.result === 4
    ).length;

  const blockPoints =
    block.filter(
      a => a.result === 1
    ).length;

  const defenseSuccess =
    defense.filter(
      a => a.result === 1
    ).length;

  const defensePlayable =
    defense.filter(
      a => a.result === 2
    ).length;

  const defenseErrors =
    defense.filter(
      a => a.result === 3
    ).length;

  const attackRate =
    attack.length
      ? attackKills / attack.length * 100
      : 0;

  const receptionRate =
    reception.length
      ? receptionPositive / reception.length * 100
      : 0;

  const defenseRate =
    defense.length
      ? defenseSuccess / defense.length * 100
      : 0;

  return {

    attackKills,
    attackPlayable,
    attackErrors,
    attackBlocked,

    attackAttempts:
      attack.length,

    attackRate,

    receptionPositive,

    receptionAttempts:
      reception.length,

    receptionRate,

    serveAces,

    serveErrors,

    blockPoints,

    defenseSuccess,

    defensePlayable,

    defenseErrors,

    defenseAttempts:
      defense.length,

    defenseRate

  };

}

    <p class="small">

      <b>Annahme:</b>

      ${stats.receptionPositive} positiv /
      ${stats.receptionAttempts} insgesamt

    </p>


    <p class="small">

      <b>Aufschlag:</b>

      ${stats.serveAces} Asse ·
      ${stats.serveErrors} Fehler

    </p>

  `;
}


/* =========================================================
   AKTION FORMATTIEREN
========================================================= */

function formatAction(action){

  if(action.category === "opponent"){

    const found =
      opponentErrors.find(
        error =>
          error[0] === action.result
      );

    return `
      ❌ Gegner:
      ${found ? found[1] : "Fehler"}
      → Punkt für uns
    `;

  }

  return `

    ${categoryIcon(action.category)}

    ${escapeHTML(
      playerName(action.playerId)
    )}

    –
    ${categoryName(action.category)}

    –
    ${resultName(
      action.category,
      action.result
    )}

  `;
}

function categoryIcon(category){

  const icons = {

    attack:"🏐",

    reception:"👐",

    serve:"🎯",

    block:"🧱",

    defense:"🛡️"

  };

  return icons[category] || "🏐";
}

/* =========================================================

========================================================= */

function renderAnalysis(){

  const allStats =

/* =========================================================
   SPIELERANALYSE
========================================================= */

function renderPlayerAnalysis(game){

  const team =
    currentTeam();

  const players =
    team.players
      .map(player => {

        const actions =
          game.actions.filter(
            action =>
              action.playerId === player.id
          );

        if(!actions.length){
          return null;
        }

        const stats =
          calculateStats(actions);

        return {

          player,

          stats

        };

      })
      .filter(Boolean);

  if(!players.length){

    return `
      <p class="muted">
        Noch keine Spieleraktionen erfasst.
      </p>
    `;

  }

  return `

    <div class="table-scroll">

      <table>

        <thead>

          <tr>

            <th>Spieler/in</th>

            <th>Angriff</th>

            <th>Angriff %</th>

            <th>Annahme +</th>

            <th>Asse</th>

            <th>Aufschlagfehler</th>

            <th>Block</th>

            <th>Abwehr %</th>

          </tr>

        </thead>

        <tbody>

          ${

            players.map(item => `

              <tr>

                <td>

                  <b>
                    ${escapeHTML(
                      item.player.name
                    )}
                  </b>

                  <br>

                  <span class="small muted">

                    ${
                      item.player.key
                        ? `Numpad ${item.player.key}`
                        : ""
                    }

                    #${escapeHTML(
                      item.player.number
                    )}

                  </span>

                </td>


                <td>

                  ${item.stats.attackKills}
                  /
                  ${item.stats.attackAttempts}

                </td>


                <td>

                  ${item.stats.attackRate.toFixed(1)}%

                </td>


                <td>

                  ${item.stats.receptionRate.toFixed(1)}%

                </td>


                <td>

                  ${item.stats.serveAces}

                </td>


                <td>

                  ${item.stats.serveErrors}

                </td>


                <td>

                  ${item.stats.blockPoints}

                </td>


                <td>

                  ${item.stats.defenseRate.toFixed(1)}%

                </td>

              </tr>

            `).join("")

          }

        </tbody>

      </table>

    </div>

  `;

}


/* =========================================================
   SATZANALYSE
========================================================= */

function renderSetAnalysis(game,set){

  const actions =
    game.actions.filter(
      action =>
        action.set === set.set
    );

  const stats =
    calculateStats(actions);

  const feed =
    set.feed || {};

  const feedTotal =
    Object.values(feed)
      .reduce(
        (sum,value) =>
          sum + Number(value || 0),
        0
      );

  return `

    <div
      class="card"
      style="
        background:#f8fafc;
        margin-top:10px;
      "
    >

      <div class="row space">

        <h3 style="margin:0">

          Satz ${set.set}

          ·

          ${set.us}:${set.opponent}

        </h3>

        <span class="pill">

          ${actions.length}
          Aktionen

        </span>

      </div>


      <div style="margin-top:12px">

        ${renderStats(stats)}

      </div>


      <h4>
        Zuspielverteilung
      </h4>

      ${
        feedTotal

        ?

        `

          <div class="table-scroll">

            <table>

              <thead>

                <tr>
                  <th>Option</th>
                  <th>Zuspiele</th>
                  <th>%</th>
                </tr>

              </thead>

              <tbody>

                ${feedOptions
                  .filter(
                    option =>
                      Number(feed[option] || 0) > 0
                  )
                  .map(option => `

                    <tr>

                      <td>
                        ${option}
                      </td>

                      <td>
                        ${feed[option]}
                      </td>

                      <td>

                        ${(
                          Number(feed[option]) /
                          feedTotal *
                          100
                        ).toFixed(1)}%

                      </td>

                    </tr>

                  ).join("")}

              </tbody>

            </table>

          </div>

        `

        :

        `
          <p class="small muted">
            Keine Zuspielverteilung eingetragen.
          </p>
        `

      }

    </div>

  `;
}


/* =========================================================
   NUMPAD
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    /*
      Nur im Live-Modus.
    */

    if(state.page !== "live"){
      return;
    }

    const key =
      event.key;

    if(!/^[0-6]$/.test(key)){
      return;
    }

    event.preventDefault();

    const game =
      currentGame();

    if(!game){
      return;
    }


    /* -----------------------------------------
       0 = Gegnerfehler
    ----------------------------------------- */

    if(
      state.numpadMode === "player" &&
      key === "0"
    ){

      state.numpadMode =
        "opponent";

      return;
    }


    /* -----------------------------------------
       Spieler auswählen
    ----------------------------------------- */

    if(
      state.numpadMode === "player"
    ){

      if(
        !["1","2","3","4","5","6"]
          .includes(key)
      ){
        return;
      }

      const player =
        currentTeam().players.find(
          p =>
            String(p.key) === key
        );

      if(!player){
        alert(
          "Für Numpad " +
          key +
          " ist keine Spieler/in eingetragen."
        );

        return;
      }

      state.selectedPlayer =
        player.id;

      state.selectedCategory =
        null;

      state.numpadMode =
        "category";

      renderLive();

      return;
    }


    /* -----------------------------------------
       Gegnerfehler
    ----------------------------------------- */

    if(
      state.numpadMode === "opponent"
    ){

      if(key === "0"){
        return;
      }

      recordOpponentError(
        Number(key)
      );

      state.numpadMode =
        "player";

      return;
    }


    /* -----------------------------------------
       Kategorie
    ----------------------------------------- */

    if(
      state.numpadMode === "category"
    ){

      if(
        !["1","2","3","4","5"]
          .includes(key)
      ){
        return;
      }

      const index =
        Number(key) - 1;

      state.selectedCategory =
        categories[index].key;

      state.numpadMode =
        "result";

      renderLive();

      return;
    }


    /* -----------------------------------------
       Ergebnis
    ----------------------------------------- */

    if(
      state.numpadMode === "result"
    ){

      const result =
        Number(key);

      const options =
        resultOptions(
          state.selectedCategory
        );

      const valid =
        options.some(
          option =>
            option[0] === result
        );

      if(!valid){
        return;
      }

      recordAction(
        state.selectedCategory,
        result
      );

      state.numpadMode =
        "player";

    }

  }
);

  const firstTeamName =

}
else if(!db.activeTeam){

  db.activeTeam =
    db.teams[0].id;

  save();

}

render();
